# gitleaks configuration — extends the default ruleset with an allowlist for
# known-public, non-secret values so the secret scan doesn't false-positive.
title = "Hawkeye Sterling gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Public, non-secret values: the EU consolidated-list access token (published by the EU), the URL-only data registries, and the env template."
# NOTE: no whole-FILE exemptions for source files. screen.py and
# daily-sanctions-screen.yml were previously exempted wholesale (they carry only
# public Asana GIDs + the public EU FSF token, all covered by the regex allowlist
# below); a whole-file exemption would also blind the scan to a REAL secret later
# added to those files, so the specific public values are allow-listed by regex
# instead and the files themselves are scanned normally.
paths = [
  '''data/sanctions-sources\.json''',
  '''data/reg-sources\.json''',
  '''\.env\.example''',
]
regexes = [
  # EU FSF public access token embedded in the sanctions-list download URL
  '''token=dG9rZW4tMjAxNw''',
  # Asana project GIDs are public object identifiers (they appear in task URLs),
  # not secrets. The default asana-client-id rule false-positives on any 16-digit
  # number near the word "ASANA" (e.g. process.env.ASANA_*_GID || '<gid>' defaults).
  '''1216203370612914''',  # HAWKEYE STERLING APP project (RA delivery target)
  '''1216203370612916''',  # section: Assessment Report (pipeline report delivery target)
  '''1213914392047129''',  # Ongoing Monitoring project (watcher alerts + monitoring log)
  '''1213914392047131''',  # section: Daily Sanctions Screening (screen.py + daily-sanctions-screen.yml)
  '''1214107620220121''',  # Customer Database project (screen.py ASANA_CUSTOMER_DB_GID default)
  '''1215653768729951''',  # Risk Assessments - Madison LLC (former RA default)
  '''1215844297069727''',  # Regulations / Governance / Sanctions (merged into Ongoing Monitoring, then removed)
  # Section GIDs in the Ongoing Monitoring project (public identifiers), used by the
  # watchers after the Reg/Gov/Sanctions project was merged in.
  '''1216203873114460''',  # section: Regulatory changes
  '''1216203873114462''',  # section: Sanctions updates
  '''1216203873114461''',  # section: FATF list moves
  '''1216229252787647''',  # section: AI & Platform Governance (weekly summary default)
  '''1213645083721304''',  # user GID: default case/OM assignee (public object identifier)
  # Customer-record task GIDs used as offline test fixtures in
  # test/screening-cases.test.mjs (public object identifiers, not credentials;
  # fixture subject names are fictional).
  '''1214107985842154''',  # customer-record test fixture GID
  '''1214107921925846''',  # customer-record test fixture GID
  # Former Reg/Gov/Sanctions section GIDs (kept so history still scans clean).
  '''1215844241216116''',  # former section: Regulatory changes
  '''1215857714525481''',  # former section: Sanctions updates
  '''1215844241048837''',  # former section: FATF list moves
]
