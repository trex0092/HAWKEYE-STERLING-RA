# Static single-file app — publish the repo root, no build step.
[build]
  publish = "."

# Serverless: Asana task delivery on assessment completion.
[functions]
  directory = "netlify/functions"

# Security headers applied to every response (edge hardening).
# CSP is scoped to 'self'. script-src is 'self' only (no 'unsafe-inline'): all
# page logic lives in external same-origin files (app.js / console.js /
# advisor.js / i18n.js / sw-register.js) and former inline on* handlers are
# wired via event delegation, so inline script execution is fully blocked.
# style-src still permits 'unsafe-inline' because styles remain inlined (style
# injection is a far lower risk than script injection; removing it is a
# separate visual-layer refactor). connect-src permits the same-origin Netlify
# functions only; data: covers the inline SVG. The Google Fonts origins
# (fonts.googleapis.com for the stylesheet, fonts.gstatic.com for the font
# files) carry the Space Grotesk / JetBrains Mono / Manrope display faces; the
# app degrades gracefully to the system stack if they are blocked or offline.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; worker-src 'self'; manifest-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# The service worker must be re-checked on every visit so a new deploy's shell
# is picked up promptly (the SW itself versions and cleans the runtime cache).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
