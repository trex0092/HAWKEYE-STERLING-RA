# Static single-file app — publish the repo root, no build step.
# package.json exists for the DEV/CI toolchain only (all devDependencies, no
# install scripts): Netlify's dependency-install step is a fast no-op for the
# deploy — the published site is the checked-in files, unchanged. Node version
# for the build image is pinned by .nvmrc (22, same as CI).
[build]
  publish = "."

# Serve every checked-in file BYTE-FOR-BYTE — never let Netlify's post-processing
# (HTML/CSS/JS bundling & minification, image compression, snippet injection,
# pretty-URLs) mutate the published assets. This app is hand-optimised and runs
# under a strict pure-'self' CSP with Trusted Types; any injected snippet or
# rewritten markup would both violate the CSP and make the served bytes diverge
# from what main ships — exactly the drift the Site Currency probe guards. Off by
# repo policy so it can never be toggled on in the UI without a reviewed change.
[build.processing]
  skip_processing = true

# Serverless: Asana task delivery on assessment completion.
[functions]
  directory = "netlify/functions"

# Security headers applied to every response (edge hardening).
# CSP is a pure-'self' policy with NO 'unsafe-inline' and NO third-party origins:
#  - script-src 'self': all page logic is in external same-origin files
#    (app.js / console.js / advisor.js / i18n.js / sw-register.js); former inline
#    on* handlers are wired via event delegation.
#  - style-src 'self': all CSS is in external same-origin files (app.css /
#    console.css / advisor.css / fonts.css); former inline styles are applied via
#    the CSSOM (el.style.* / cssText), which CSP does not gate.
#  - font-src 'self': the Space Grotesk / JetBrains Mono / Manrope faces are
#    self-hosted under assets/fonts/ (see fonts.css) — no Google Fonts origin.
#  - connect-src 'self': same-origin Netlify functions only; img-src data: covers
#    the inline SVG/base64 assets.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; media-src 'none'; frame-src 'none'; child-src 'none'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; require-trusted-types-for 'script'; trusted-types default; report-to csp-endpoint; report-uri /.netlify/functions/csp-report"
    # Reporting API endpoint for the CSP `report-to` directive (modern browsers);
    # the legacy `report-uri` above covers older ones. Both POST violation
    # reports to the same-origin csp-report function (logged, never blocked).
    Reporting-Endpoints = "csp-endpoint=\"/.netlify/functions/csp-report\""
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-Permitted-Cross-Domain-Policies = "none"
    X-DNS-Prefetch-Control = "off"
    Referrer-Policy = "no-referrer"
    # Deny every powerful browser feature the app never uses (defence in depth +
    # opt out of FLoC/Topics ad tracking). Allowlist is empty () = disabled for all.
    Permissions-Policy = "accelerometer=(), autoplay=(), bluetooth=(), browsing-topics=(), camera=(), display-capture=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), interest-cohort=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), payment=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()"
    # 2-year HSTS with preload eligibility (HTTPS-only static site on Netlify).
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Full cross-origin isolation. COEP credentialless strips credentials from any
    # cross-origin no-cors fetch rather than hard-blocking it — the app is strictly
    # same-origin (pure-'self' CSP), so this isolates the context with no breakage.
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Resource-Policy = "same-origin"

# The service worker must be re-checked on every visit so a new deploy's shell
# is picked up promptly (the SW itself versions and cleans the runtime cache).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
