# Static single-file app — publish the repo root, no build step.
[build]
  publish = "."

# Serverless: Asana task delivery on assessment completion.
[functions]
  directory = "netlify/functions"

# Security headers applied to every response (edge hardening).
# CSP is a pure-'self' policy with NO 'unsafe-inline' and NO third-party origins:
#  - script-src 'self': all page logic is in external same-origin files
#    (app.js / console.js / advisor.js / i18n.js / sw-register.js); former inline
#    on* handlers are wired via event delegation.
#  - style-src 'self': all CSS is in external same-origin files (app.css /
#    console.css / advisor.css / fonts.css); former inline styles are applied via
#    the CSSOM (el.style.* / cssText), which CSP does not gate.
#  - font-src 'self': the Space Grotesk / JetBrains Mono / Manrope faces are
#    self-hosted under assets/fonts/ (see fonts.css) — no Google Fonts origin.
#  - connect-src 'self': same-origin Netlify functions only; img-src data: covers
#    the inline SVG/base64 assets.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; report-to csp-endpoint; report-uri /.netlify/functions/csp-report"
    # Reporting API endpoint for the CSP `report-to` directive (modern browsers);
    # the legacy `report-uri` above covers older ones. Both POST violation
    # reports to the same-origin csp-report function (logged, never blocked).
    Reporting-Endpoints = "csp-endpoint=\"/.netlify/functions/csp-report\""
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# The service worker must be re-checked on every visit so a new deploy's shell
# is picked up promptly (the SW itself versions and cleans the runtime cache).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
