# OSV vulnerability-scanning policy for hash-locked CI toolchain manifests.
# The scanner reads this file alongside ci/*-requirements.txt.
#
# No vulnerabilities are currently ignored. All observed findings remain
# blocking in the recursive OSV scan, including toolchain-only dependencies.
# Do not use [[IgnoredVulns]] to paper over findings or missing upstream patches.
#
# On 2026-10-26 the previous five ignored IDs were retired because the pinned
# click==8.4.2 and mcp==1.29.0 already exceed their affected version ranges.
# Two newly reported advisories, GHSA-84m7-p3x7-pcfv (mcp, fixed in 1.30.0) and
# GHSA-xcq7-p3pf-p88h (opentelemetry-api, fixed in 1.45.1), are fixed by
# upgrading, not by suppression: ci/semgrep-requirements.txt pins mcp 1.30.0 and
# opentelemetry 1.45.2 and is installed with --no-deps because Semgrep still
# declares the older ranges. OSV (api.osv.dev) returned no vulnerabilities for
# those versions, and the gate's own Semgrep rules gave identical results
# (0 findings, 7 rules, 123 targets) before and after. Do not use
# [[IgnoredVulns]] to paper over findings or missing upstream patches.
# Incident: https://github.com/trex0092/HAWKEYE-STERLING-RA/issues/1068
