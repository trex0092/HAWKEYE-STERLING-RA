# ============================================================
# HAWKEYE STERLING — ONBOARDING SCREENING (new customers)
# GitHub Actions Workflow — Hawkeye Sterling V2
# ============================================================
# Screens customers ADDED in the last ~26h immediately (sanctions +
# adverse media + PEP), so a new counterparty is screened at onboarding
# rather than waiting for the next daily batch. Posts an "Onboarding
# Screening" task in Ongoing Monitoring only when there are new customers.
# This SUPPLEMENTS the daily unified screen; it does not replace it.
# ============================================================

name: Onboarding Screening (new customers)

on:
  schedule:
    - cron: '11 */6 * * *'   # every 6 hours at :11 — near-onboarding turnaround (odd minute)
  workflow_dispatch:
    inputs:
      window_hours:
        description: 'Look-back window in hours (default 26)'
        required: false
        default: '26'

# contents:write only to commit the shared delta-state (what has been reported).
permissions:
  contents: read

# Never overlap the daily sweep's delta-state commit, and never overlap itself.
# Single-writer group SHARED with weekly-adverse-media.yml (see the comment
# there): both force-push screen-delta-state, so the writers must serialise.
# A queued onboarding cycle superseded during a very long daily sweep is
# covered by the 26h onboarding look-back window and the next 6h cycle.
concurrency:
  group: screen-state
  cancel-in-progress: false

jobs:
  onboarding:
    # Write scopes live at job level (top level is read-only — least privilege).
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60   # only the new-customer subset is enriched; the full DB is just listed

    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          # This job holds contents:write and fetches external content while handling
          # customer data — block egress to a fixed allowlist so it cannot exfiltrate.
          # Hosts = the sanctions sources + Google-News RSS + Wikidata (PEP) that
          # screen.py contacts, Asana, Anthropic (LLM triage, when enabled), and the
          # GitHub/PyPI infra for checkout + pip. A missed host fails LOUD (the
          # empty-list guard reds the job; adverse/PEP degrade, never a silent clear).
          # OFAC and UN serve their files via 302 to presigned storage URLs, so their
          # storage backends (S3 / Azure blob) are allowlisted next to the primaries.
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            app.asana.com:443
            api.anthropic.com:443
            sanctionslistservice.ofac.treas.gov:443
            wc2h-sls-prod-public-published.s3.us-gov-west-1.amazonaws.com:443
            scsanctions.un.org:443
            unsolprodfiles.blob.core.windows.net:443
            ofsistorage.blob.core.windows.net:443
            data.opensanctions.org:443
            www.international.gc.ca:443
            news.google.com:443
            api.gdeltproject.org:443
            www.wikidata.org:443
            query.wikidata.org:443
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # No credentials on disk (zizmor artipacked): the state push below
          # authenticates with an ephemeral env token, and the overlay fetch
          # is anonymous (public repo).
          persist-credentials: false

      - name: Overlay latest delta-state (shared with the daily sweep, on screen-delta-state)
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          # The dedup/delta state lives on the screen-delta-state branch (main is
          # protected — GH006). Without this overlay the onboarding run diffs
          # against main's stale copy and re-reports already-delivered findings.
          # With STATE_ENCRYPTION_KEY set the branch carries <file>.enc instead
          # of subject-data plaintext (P30): decrypt restores the working files;
          # an .enc with no key fails loudly rather than running with amnesia.
          if git fetch origin screen-delta-state --depth=1 2>/dev/null; then
            for f in data/screen-delta-state.json data/adverse-media-evidence.json data/run-metrics.json data/source-coverage-state.json; do
              git checkout FETCH_HEAD -- "$f" 2>/dev/null || true
              git checkout FETCH_HEAD -- "$f.enc" 2>/dev/null || true
            done
            node scripts/state-crypto.mjs decrypt data/screen-delta-state.json data/adverse-media-evidence.json data/run-metrics.json data/source-coverage-state.json
            echo "delta-state overlaid from screen-delta-state"
          else
            echo "no screen-delta-state branch yet — using state from main"
          fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet --require-hashes -r ci/requirements.txt

      - name: Screen newly-added customers
        env:
          ASANA_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN || secrets.ASANA_TOKEN }}
          TRIGGER_TYPE: schedule
          RUN_MODE: onboarding
          ONBOARDING_WINDOW_HOURS: ${{ github.event.inputs.window_hours || '26' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # PDPL GATE: held OFF until the Anthropic DPA is executed + transfer basis recorded.
          # Set repo variable LLM_TRIAGE=1 to re-enable once signed (no code change needed).
          LLM_TRIAGE: ${{ vars.LLM_TRIAGE || '0' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'claude-haiku-4-5-20251001' }}
        run: python screen.py

      - name: Commit delta-state (what has already been reported)
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          # Stage only the state files that exist: an early-exit run (e.g. 0 new
          # customers) doesn't write the optional ones, and a hard `git add` of
          # a missing path fatals (exit 128) instead of persisting the rest.
          # With STATE_ENCRYPTION_KEY set, the commit carries only <file>.enc:
          # the plaintext working files are restored to their main-branch
          # content so CURRENT subject data never lands on the public branch
          # (P30, encrypt-forward; same pattern as the daily sweep).
          state_files=()
          for f in data/screen-delta-state.json data/adverse-media-evidence.json data/run-metrics.json data/source-coverage-state.json; do
            [ -f "$f" ] && state_files+=("$f")
          done
          if [ "${#state_files[@]}" -gt 0 ] && [ -n "$(git status --porcelain -- "${state_files[@]}")" ]; then
            git config user.name "onboarding-screen"
            git config user.email "actions@github.com"
            if [ -n "$STATE_ENCRYPTION_KEY" ]; then
              node scripts/state-crypto.mjs encrypt "${state_files[@]}"
              for f in "${state_files[@]}"; do
                [ -f "$f.enc" ] && git add "$f.enc"
                git checkout -- "$f" 2>/dev/null || true
              done
            else
              echo "::warning::delta-state persisted in PLAINTEXT (subject data) - set the STATE_ENCRYPTION_KEY secret to encrypt state commits (P30)"
              git add -- "${state_files[@]}"
            fi
            git commit -m "chore(screen): update delta-state (onboarding) [skip ci]"
            # Persist on the screen-delta-state branch (main is protected — a plain
            # `git push` to main is rejected and, previously, swallowed). Rebuilt as
            # <current main> + one data commit, force-updated, matching the sweep.
            # Auth is the ephemeral env token in the push URL — the checkout
            # persists no credentials, so nothing lands in .git/config.
            pushed=
            for attempt in 1 2 3 4 5; do
              git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/screen-delta-state && { pushed=1; break; }
              echo "push failed (attempt $attempt) — retrying"
              sleep $((attempt * 3))
            done
            [ -n "$pushed" ] || { echo "::error::state push to screen-delta-state failed after 5 attempts — state NOT persisted"; exit 1; }
          else
            echo "delta-state unchanged"
          fi
