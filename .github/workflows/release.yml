name: Release

# Creates a tag + GitHub release from the Actions tab (or via API dispatch):
# Actions → Release → Run workflow → enter the tag (e.g. v3.2.0).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create (e.g. v3.2.0)"
        required: true

permissions:
  contents: write
  id-token: write       # OIDC for Sigstore-keyless build-provenance attestation
  attestations: write   # store the attestation in the repo's attestation log

# One release at a time — concurrent runs could race on the same tag/attestation.
concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          disable-sudo: true
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false   # no git push here (gh/create-pull-request use the token directly)
      - name: Create tag, GitHub release, and supply-chain artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          # Pass the free-text dispatch input through env (never interpolate it into
          # the shell), then validate its shape — closes the script-injection path on
          # this contents/attestations:write job.
          TAG: ${{ inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "Refusing to release: tag must look like vX.Y.Z (got '$TAG')"; exit 1 ;;
          esac
          gh release create "$TAG" \
            --target "$SHA" \
            --title "$TAG" \
            --generate-notes
          # Deterministic source tarball of the released commit + CycloneDX SBOM,
          # both attested below.
          git archive --format=tar.gz -o "hawkeye-sterling-ra-$TAG.tar.gz" "$SHA"
          gh release upload "$TAG" "hawkeye-sterling-ra-$TAG.tar.gz" --clobber || echo "tarball upload skipped"
          if node scripts/gen-sbom.mjs; then
            gh release upload "$TAG" sbom.cdx.json --clobber || echo "SBOM upload skipped"
          else
            echo "SBOM generation skipped"
          fi

      # Sign the release artifacts with a Sigstore-keyless build-provenance
      # attestation (OIDC, no long-lived keys). Verify with:
      #   gh attestation verify hawkeye-sterling-ra-<tag>.tar.gz --repo <owner>/<repo>
      - name: Attest build provenance for the release artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          # Glob (not the literal path) so a best-effort SBOM that failed to
          # generate is silently skipped rather than erroring the attest step on a
          # missing subject; the always-present tarball keeps the subject set non-empty.
          subject-path: |
            hawkeye-sterling-ra-*.tar.gz
            *.cdx.json
