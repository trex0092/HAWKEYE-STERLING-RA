name: Release

# Creates a tag + GitHub release from the Actions tab (or via API dispatch):
# Actions → Release → Run workflow → enter the tag (e.g. v3.2.0).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create (e.g. v3.2.0)"
        required: true

permissions:
  contents: read

# One release at a time — concurrent runs could race on the same tag/attestation.
concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  release:
    # Write scopes live at job level (top level is read-only — least privilege).
    permissions:
      contents: write
      id-token: write       # OIDC for Sigstore-keyless build-provenance attestation
      attestations: write   # store the attestation in the repo's attestation log
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Protected environment: same gate as auto-release.yml, so the required
    # reviewer configured on the `release` environment (repo settings) binds
    # BOTH release paths. Until configured, GitHub auto-creates it unprotected
    # (no-op gating) — see docs/governance/github-repository-hardening.md §4.
    environment: release
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          # Stays audit: release-asset upload + Sigstore attestation endpoints
          # vary, so a fixed allowlist would flake a release.
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false   # no git push here (gh/create-pull-request use the token directly)
      - name: Create tag, GitHub release, and supply-chain artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          # Pass the free-text dispatch input through env (never interpolate it into
          # the shell), then validate its shape — closes the script-injection path on
          # this contents/attestations:write job.
          TAG: ${{ inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "Refusing to release: tag must look like vX.Y.Z (got '$TAG')"; exit 1 ;;
          esac
          gh release create "$TAG" \
            --target "$SHA" \
            --title "$TAG" \
            --generate-notes
          # Deterministic source tarball of the released commit + CycloneDX SBOM,
          # both attested below.
          git archive --format=tar.gz -o "hawkeye-sterling-ra-$TAG.tar.gz" "$SHA"
          gh release upload "$TAG" "hawkeye-sterling-ra-$TAG.tar.gz" --clobber || echo "tarball upload skipped"
          if node scripts/gen-sbom.mjs; then
            gh release upload "$TAG" sbom.cdx.json --clobber || echo "SBOM upload skipped"
          else
            echo "SBOM generation skipped"
          fi

      # Sign the release artifacts with a Sigstore-keyless build-provenance
      # attestation (OIDC, no long-lived keys). Verify with:
      #   gh attestation verify hawkeye-sterling-ra-<tag>.tar.gz --repo <owner>/<repo>
      - name: Attest build provenance for the release artifacts
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            hawkeye-sterling-ra-*.tar.gz
            sbom.cdx.json

      - name: Attach the Sigstore bundle as a release asset
        # The attestation lives in the repo attestation log either way; also
        # shipping the bundle beside the artifacts makes the release
        # self-contained and machine-verifiable (Scorecard: Signed-Releases).
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          # Two names for the same Sigstore bundle: the .sigstore copy is the
          # signature evidence, the .intoto.jsonl copy carries the SLSA
          # provenance statement under its conventional suffix.
          cp "$BUNDLE" "hawkeye-sterling-ra-$TAG.sigstore"
          cp "$BUNDLE" "hawkeye-sterling-ra-$TAG.intoto.jsonl"
          gh release upload "$TAG" "hawkeye-sterling-ra-$TAG.sigstore" "hawkeye-sterling-ra-$TAG.intoto.jsonl" --clobber || echo "bundle upload skipped"
