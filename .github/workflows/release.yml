name: Release

# Creates a tag + GitHub release from the Actions tab (or via API dispatch):
# Actions → Release → Run workflow → enter the tag (e.g. v3.2.0).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create (e.g. v3.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "${{ inputs.tag }}" \
            --generate-notes
