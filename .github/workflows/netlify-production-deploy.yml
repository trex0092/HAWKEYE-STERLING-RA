name: Netlify Production Deploy (build hook)

# Production deploys stopped publishing after 27 Jun 2026: pushes to main no
# longer trigger a Netlify production build (no Netlify status/check appears
# on main commits — verified 25 Jul), while PR deploy previews still build.
# The live site therefore serves the 27 Jun bundle (pre app.js split) and the
# deploy badge shows the last failed production attempt. The July workaround
# (netlify-deploy.yml, since repurposed) prescribed a Netlify BUILD HOOK but
# its secret was never created.
#
# ONE-TIME SETUP (Netlify UI, ~1 minute):
#   Netlify -> Site configuration -> Build & deploy -> Build hooks ->
#   "Add build hook" (branch: main) -> copy the URL, then GitHub repo ->
#   Settings -> Secrets and variables -> Actions -> New repository secret:
#     NETLIFY_BUILD_HOOK_URL = <that URL>
# (Re-linking the repository under Build & deploy -> Continuous deployment
#  fixes push-triggered production builds permanently and is the better fix;
#  this workflow is the GitHub-native lever until/alongside that.)
#
# NOTE: a Netlify build consumes the team's build minutes/credits.

on:
  workflow_dispatch:
  # Self-sufficient CD: once the NETLIFY_BUILD_HOOK_URL secret exists, every
  # merge to main that touches the SERVED app re-publishes production even if
  # Netlify's own Git integration stays broken (it has been since 27 Jun).
  # Path-filtered so the many daily state-sync/docs/workflow merges don't
  # burn Netlify build minutes; while the secret is still missing a push
  # firing is a soft no-op (warning, green), so this trigger is safe to
  # carry before setup completes. Site Currency (08:07 UTC) independently
  # alarms if production ever drifts behind main again.
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'console.html'
      - 'advisor.html'
      - '*.js'
      - '*.css'
      - 'assets/**'
      - 'netlify/**'
      - 'netlify.toml'
      - 'manifest.webmanifest'
      - 'fonts.css'

permissions:
  contents: read

concurrency:
  group: netlify-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # headroom for the ~18-min publish-verify poll (slow Free-tier CDN propagation)
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          # Build hooks live on api.netlify.com; the publish check reads the
          # live site. The GitHub/nodejs.org endpoints are the checkout and the
          # Node toolchain the publish check runs on. Nothing else is contacted.
          egress-policy: block
          allowed-endpoints: >
            api.netlify.com:443
            hawkeye-sterling-ra.netlify.app:443
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            *.githubapp.com:443

      - name: Trigger Netlify production build via build hook
        id: kick
        env:
          HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
          EVENT: ${{ github.event_name }}
          # Self-diagnosis for the missing-secret path (4 identical dispatch
          # failures, 25-26 Jul, HOOK_URL always empty). Individual probes of
          # the LIKELY misconfigurations only — zizmor's overprovisioned-
          # secrets audit rightly rejects toJSON(secrets), so no whole-context
          # injection: each candidate is a single-secret provision, values are
          # never printed, and a uniquely-matching variant is USED with a loud
          # rename warning so a typo still deploys today.
          ALT_1: ${{ secrets.NETLIFY_BUILD_HOOK }}
          ALT_2: ${{ secrets.NETLIFY_BUILDHOOK_URL }}
          ALT_3: ${{ secrets.NETLIFY_HOOK_URL }}
          ALT_4: ${{ secrets.BUILD_HOOK_URL }}
          ALT_5: ${{ secrets.NETLIFY_WEBHOOK_URL }}
          # Saved on the adjacent Variables tab instead of Secrets:
          VAR_HOOK: ${{ vars.NETLIFY_BUILD_HOOK_URL }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -u
          if [ -z "${HOOK_URL:-}" ]; then
            found=""
            for pair in "NETLIFY_BUILD_HOOK:${ALT_1:-}" "NETLIFY_BUILDHOOK_URL:${ALT_2:-}" "NETLIFY_HOOK_URL:${ALT_3:-}" "BUILD_HOOK_URL:${ALT_4:-}" "NETLIFY_WEBHOOK_URL:${ALT_5:-}"; do
              name="${pair%%:*}"; val="${pair#*:}"
              if [ -n "$val" ]; then
                echo "::warning::Found a build-hook secret under the name '$name' — using it this run. Rename it to NETLIFY_BUILD_HOOK_URL so every firing (including push-triggered deploys) finds it."
                HOOK_URL="$val"; found="$name"; break
              fi
            done
            if [ -z "$found" ] && [ -n "${VAR_HOOK:-}" ]; then
              echo "::warning::NETLIFY_BUILD_HOOK_URL exists as a VARIABLE, not a Secret — using it this run. Variables are stored unencrypted and unmasked: delete it from the Variables tab and re-save it on the SECRETS tab."
              HOOK_URL="$VAR_HOOK"; found="vars.NETLIFY_BUILD_HOOK_URL"
            fi
            if [ -z "$found" ]; then
              echo "Repository/organization VARIABLE names visible to this run (secrets cannot be enumerated without over-provisioning):"
              echo "$VARS_JSON" | python3 -c 'import json,sys; [print("  -", k) for k in sorted(json.load(sys.stdin) or {})]' || true
              echo "Probed and empty: NETLIFY_BUILD_HOOK_URL and common variants (NETLIFY_BUILD_HOOK, NETLIFY_BUILDHOOK_URL, NETLIFY_HOOK_URL, BUILD_HOOK_URL, NETLIFY_WEBHOOK_URL), plus the Variables tab."
              echo "Remaining causes: saved under an ENVIRONMENT (this workflow binds none — re-save as a Repository secret), saved on a different repository, or never saved on the GitHub side at all."
              if [ "$EVENT" = "push" ]; then
                # Deliberately non-fatal so ordinary merges are not blocked by a
                # one-time setup step nobody can perform from CI — but the
                # warning must name the CONSEQUENCE, not just the missing
                # secret. Netlify's own Git integration has not published a
                # production deploy from a push since 27 Jun (no Netlify
                # check-run appears on any main commit), so with this secret
                # absent there is NO path from a merge to the live site at all.
                # Site Currency (08:07 UTC daily) is the alarm that this has
                # happened; it went undetected for a month because it was
                # comparing a hand-maintained version string instead of content.
                echo "::warning::NETLIFY_BUILD_HOOK_URL is not set, so THIS MERGE IS NOT DEPLOYED — it is on main but not on the live site, and Netlify's Git integration has not published a push-triggered production build since 27 Jun. Set the secret (see the header of this workflow) or re-link the repository in Netlify."
                echo "kicked=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::NETLIFY_BUILD_HOOK_URL is not set as a Repository secret (all likely variants probed empty — see above). Netlify -> Site configuration -> Build & deploy -> Build hooks -> Add build hook (branch: main); then GitHub -> Settings -> Secrets and variables -> Actions -> SECRETS tab -> New repository secret, name NETLIFY_BUILD_HOOK_URL."
              exit 1
            fi
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$HOOK_URL")
          echo "Netlify build hook POST -> HTTP $code"
          if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "204" ]; then
            echo "::error::Build hook POST failed (HTTP $code) — the hook may have been deleted; recreate it in the Netlify UI."
            exit 1
          fi
          echo "kicked=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.kick.outputs.kicked == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.kick.outputs.kicked == 'true'
        with:
          node-version-file: .nvmrc

      - name: Wait for the publish to reach the live site
        if: steps.kick.outputs.kicked == 'true'
        env:
          LIVE_ORIGIN: https://hawkeye-sterling-ra.netlify.app
          GRACE_SECONDS: '0'   # this step exists to confirm THIS commit published; no lag allowance
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -u
          # This step used to succeed as soon as /app.js served ANY APP_VERSION.
          # That was a valid signal exactly once — while the live site still
          # carried the pre-app.js-split 27 Jun bundle, its appearance meant a
          # modern publish had landed. After the first modern publish the
          # condition became permanently true, so the step would have reported
          # "PUBLISHED" within seconds even if the build hook had done nothing
          # at all. On 30 Jul that was the live state: production was serving a
          # 31-commit-old build that DOES contain an APP_VERSION.
          #
          # It now verifies the only thing worth verifying — that the site
          # serves the bytes of the commit being deployed. Poll up to ~18
          # minutes: a no-build static publish uploads in ~15-30s, but CDN
          # propagation of the fresh atomic deploy to the edge node this runner
          # hits is SLOW and variable on the Free (nf_team_dev) tier — measured
          # 2026-08-03 at ~12 min on three consecutive deploys, so the old
          # 10-min window timed out here while the independent daily Site
          # Currency probe (24h grace) confirmed the same deploys were current.
          # This is deploy-lag tolerance, NOT a weakening of the drift check:
          # the content comparison stays byte-exact, only the wait is longer.
          for i in $(seq 1 54); do
            # --quiet: an expected "not yet" poll must not file a red annotation
            # on a step that is about to succeed.
            if node scripts/site-currency.mjs --quiet > /tmp/currency.txt 2>&1; then
              echo "PUBLISHED: the live site now serves this commit."
              exit 0
            fi
            echo "  not published yet (check $i/54) — waiting 20s"
            sleep 20
          done
          cat /tmp/currency.txt
          echo "::error::Build was triggered but after ~18 minutes the live site still does not serve this commit's assets (see the divergences listed above) — check the deploy log in the Netlify UI (app.netlify.com/projects/hawkeye-sterling-ra/deploys)."
          exit 1

  # Self-heal — register item 26's first half. On 2026-08-04 four consecutive
  # runner-shutdown signals killed the ~18-minute publish-verify poll above
  # (checks 35/39/40/32) and each left this workflow red with the deploy
  # itself healthy; nothing retried. This job runs only when the deploy job
  # fails, on a fresh runner, for seconds — far inside the kill horizon — and
  # re-dispatches the workflow once via workflow_dispatch, the same chaining
  # pattern auto-release.yml uses for the container publish (the workflow-lint
  # zizmor gate keeps workflow_run chaining off the table by design).
  #
  # Degrade loudly, never silently:
  #   - the failed deploy job KEEPS its red — nothing here rewrites history;
  #   - only a push-triggered failure retries, so a retried run that fails
  #     again stops at a human instead of chaining;
  #   - a hard cap of 3 workflow runs per UTC day backstops even that — at
  #     the cap this job goes red itself and says so, because a Netlify build
  #     spends the team's build minutes and a fourth identical failure needs
  #     eyes, not another build.
  retry:
    needs: deploy
    if: ${{ failure() && github.event_name == 'push' }}
    # ACCEPTED RISK — OpenSSF Scorecard Token-Permissions (code-scanning alert
    # #136, dismissed 2026-08-05): `gh workflow run` (the workflow_dispatch API)
    # requires `actions: write`; GitHub offers no narrower "dispatch-only"
    # scope, and a PAT/App token would be strictly worse (long-lived credential
    # with the same power). Exposure is contained: the grant is job-level only
    # (workflow default stays `contents: read`), the job runs no third-party
    # code beyond SHA-pinned harden-runner, egress is blocked to
    # github.com/api.github.com, its script consumes no untrusted input, it
    # fires only on a push-triggered deploy failure, and the 3-runs/UTC-day cap
    # below fails red rather than dispatch a fourth build.
    permissions:
      actions: write # count today's runs + dispatch this workflow once
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - name: Re-dispatch once, capped per UTC day
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%F)
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/netlify-production-deploy.yml/runs?created=%3E%3D${today}T00:00:00Z&per_page=50" --jq '.workflow_runs | length')
          echo "production-deploy runs today (UTC): $runs"
          if [ "$runs" -ge 3 ]; then
            echo "::error::Deploy retry cap reached ($runs runs today, max 3) — a human look is needed, not another build (open-actions register item 26)."
            exit 1
          fi
          gh workflow run netlify-production-deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "::notice::Re-dispatched netlify-production-deploy.yml once ($runs run(s) already today, cap 3)."
