name: Netlify Production Deploy (build hook)

# Production deploys stopped publishing after 27 Jun 2026: pushes to main no
# longer trigger a Netlify production build (no Netlify status/check appears
# on main commits — verified 25 Jul), while PR deploy previews still build.
# The live site therefore serves the 27 Jun bundle (pre app.js split) and the
# deploy badge shows the last failed production attempt. The July workaround
# (netlify-deploy.yml, since repurposed) prescribed a Netlify BUILD HOOK but
# its secret was never created.
#
# ONE-TIME SETUP (Netlify UI, ~1 minute):
#   Netlify -> Site configuration -> Build & deploy -> Build hooks ->
#   "Add build hook" (branch: main) -> copy the URL, then GitHub repo ->
#   Settings -> Secrets and variables -> Actions -> New repository secret:
#     NETLIFY_BUILD_HOOK_URL = <that URL>
# (Re-linking the repository under Build & deploy -> Continuous deployment
#  fixes push-triggered production builds permanently and is the better fix;
#  this workflow is the GitHub-native lever until/alongside that.)
#
# NOTE: a Netlify build consumes the team's build minutes/credits.

on:
  workflow_dispatch:
  # Self-sufficient CD: once the NETLIFY_BUILD_HOOK_URL secret exists, every
  # merge to main that touches the SERVED app re-publishes production even if
  # Netlify's own Git integration stays broken (it has been since 27 Jun).
  # Path-filtered so the many daily state-sync/docs/workflow merges don't
  # burn Netlify build minutes; while the secret is still missing a push
  # firing is a soft no-op (warning, green), so this trigger is safe to
  # carry before setup completes. Site Currency (08:07 UTC) independently
  # alarms if production ever drifts behind main again.
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'console.html'
      - 'advisor.html'
      - '*.js'
      - '*.css'
      - 'assets/**'
      - 'netlify/**'
      - 'netlify.toml'
      - 'manifest.webmanifest'
      - 'fonts.css'

permissions:
  contents: read

concurrency:
  group: netlify-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          # Build hooks live on api.netlify.com; the publish check reads the
          # live site. Nothing else is contacted.
          egress-policy: block
          allowed-endpoints: >
            api.netlify.com:443
            hawkeye-sterling-ra.netlify.app:443

      - name: Trigger Netlify production build via build hook
        id: kick
        env:
          HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
          EVENT: ${{ github.event_name }}
          # Self-diagnosis for the missing-secret path (4 identical dispatch
          # failures, 25-26 Jul, HOOK_URL always empty). Individual probes of
          # the LIKELY misconfigurations only — zizmor's overprovisioned-
          # secrets audit rightly rejects toJSON(secrets), so no whole-context
          # injection: each candidate is a single-secret provision, values are
          # never printed, and a uniquely-matching variant is USED with a loud
          # rename warning so a typo still deploys today.
          ALT_1: ${{ secrets.NETLIFY_BUILD_HOOK }}
          ALT_2: ${{ secrets.NETLIFY_BUILDHOOK_URL }}
          ALT_3: ${{ secrets.NETLIFY_HOOK_URL }}
          ALT_4: ${{ secrets.BUILD_HOOK_URL }}
          ALT_5: ${{ secrets.NETLIFY_WEBHOOK_URL }}
          # Saved on the adjacent Variables tab instead of Secrets:
          VAR_HOOK: ${{ vars.NETLIFY_BUILD_HOOK_URL }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -u
          if [ -z "${HOOK_URL:-}" ]; then
            found=""
            for pair in "NETLIFY_BUILD_HOOK:${ALT_1:-}" "NETLIFY_BUILDHOOK_URL:${ALT_2:-}" "NETLIFY_HOOK_URL:${ALT_3:-}" "BUILD_HOOK_URL:${ALT_4:-}" "NETLIFY_WEBHOOK_URL:${ALT_5:-}"; do
              name="${pair%%:*}"; val="${pair#*:}"
              if [ -n "$val" ]; then
                echo "::warning::Found a build-hook secret under the name '$name' — using it this run. Rename it to NETLIFY_BUILD_HOOK_URL so every firing (including push-triggered deploys) finds it."
                HOOK_URL="$val"; found="$name"; break
              fi
            done
            if [ -z "$found" ] && [ -n "${VAR_HOOK:-}" ]; then
              echo "::warning::NETLIFY_BUILD_HOOK_URL exists as a VARIABLE, not a Secret — using it this run. Variables are stored unencrypted and unmasked: delete it from the Variables tab and re-save it on the SECRETS tab."
              HOOK_URL="$VAR_HOOK"; found="vars.NETLIFY_BUILD_HOOK_URL"
            fi
            if [ -z "$found" ]; then
              echo "Repository/organization VARIABLE names visible to this run (secrets cannot be enumerated without over-provisioning):"
              echo "$VARS_JSON" | python3 -c 'import json,sys; [print("  -", k) for k in sorted(json.load(sys.stdin) or {})]' || true
              echo "Probed and empty: NETLIFY_BUILD_HOOK_URL and common variants (NETLIFY_BUILD_HOOK, NETLIFY_BUILDHOOK_URL, NETLIFY_HOOK_URL, BUILD_HOOK_URL, NETLIFY_WEBHOOK_URL), plus the Variables tab."
              echo "Remaining causes: saved under an ENVIRONMENT (this workflow binds none — re-save as a Repository secret), saved on a different repository, or never saved on the GitHub side at all."
              if [ "$EVENT" = "push" ]; then
                echo "::warning::NETLIFY_BUILD_HOOK_URL secret not set — skipping (push firing)."
                echo "kicked=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::NETLIFY_BUILD_HOOK_URL is not set as a Repository secret (all likely variants probed empty — see above). Netlify -> Site configuration -> Build & deploy -> Build hooks -> Add build hook (branch: main); then GitHub -> Settings -> Secrets and variables -> Actions -> SECRETS tab -> New repository secret, name NETLIFY_BUILD_HOOK_URL."
              exit 1
            fi
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$HOOK_URL")
          echo "Netlify build hook POST -> HTTP $code"
          if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "204" ]; then
            echo "::error::Build hook POST failed (HTTP $code) — the hook may have been deleted; recreate it in the Netlify UI."
            exit 1
          fi
          echo "kicked=true" >> "$GITHUB_OUTPUT"

      - name: Wait for the publish to reach the live site
        if: steps.kick.outputs.kicked == 'true'
        run: |
          set -u
          # The 27 Jun bundle predates the app.js split, so the first modern
          # publish is unambiguous: /app.js starts serving an APP_VERSION.
          # Poll up to 10 minutes (a no-build static publish takes ~1-2).
          for i in $(seq 1 30); do
            live=$(curl -sSL "https://hawkeye-sterling-ra.netlify.app/app.js" | grep -oE "APP_VERSION = '[0-9.]+'" | head -1 || true)
            if [ -n "$live" ]; then
              echo "PUBLISHED: live site now serves $live"
              exit 0
            fi
            echo "  not published yet (check $i/30) — waiting 20s"
            sleep 20
          done
          echo "::error::Build was triggered but the live site still serves the pre-split bundle after 10 minutes — check the deploy log in the Netlify UI (app.netlify.com/projects/hawkeye-sterling-ra/deploys)."
          exit 1
