name: Runtime priority repair

on:
  push:
    branches: [fix/runtime-priority-20260929]
    paths: [.github/workflows/runtime-priority-repair.yml]

permissions:
  contents: read

concurrency:
  group: runtime-priority-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden runner
        # Offline tests; only checkout, toolchain and branch push need egress.
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443 api.github.com:443 codeload.github.com:443
            objects.githubusercontent.com:443 nodejs.org:443 *.githubapp.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Apply immutable source repair and distinguish outage from throttling
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync, spawnSync } from 'node:child_process';
          const original = execFileSync('git', ['show',
            'c27e406a272ff5d96cdece873b0933e9948305b9:.github/workflows/runtime-priority-repair.yml'], { encoding: 'utf8' });
          const match = /^          node --input-type=module <<'PATCH'\n([\s\S]*?)^          PATCH$/m.exec(original);
          assert.ok(match, 'Exact immutable patch must exist');
          const run = spawnSync(process.execPath, ['--input-type=module'], {
            input: match[1].replace(/^          /gm, ''),
            stdio: ['pipe', 'inherit', 'inherit'], encoding: 'utf8',
          });
          assert.ifError(run.error);
          assert.equal(run.status, 0);
          // Keep the legacy two-query failure test: a 503 outage still tries
          // wide then base. The new integration test separately proves a 429
          // is a quota refusal and must not double the requests.
          const path = 'test/adverse-media.test.mjs';
          const text = readFileSync(path, 'utf8');
          const old = "stub(() => reply(429, 'rate limited'));";
          assert.equal(text.split(old).length, 2);
          writeFileSync(path, text.replace(old, "stub(() => reply(503, 'temporarily unavailable'));"));
          NODE
      - name: Verify source and offline integration regressions
        run: |
          git diff --check
          node --check scripts/adverse-media.mjs
          node --check scripts/pep-worldwide.mjs
          node test/runtime-priority.test.mjs
          node test/runtime-recovery.test.mjs
          node test/adverse-media.test.mjs
          node test/pep-check.test.mjs
          node test/board-figures.test.mjs
          node test/changelog.test.mjs
          node test/ci-coverage.test.mjs
      - name: Commit verified source changes to repair branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = 'fix/runtime-priority-20260929'
          # The connector commits the final CI wiring and bootstrap removal.
          # Do not ask the Actions token to modify workflow files.
          git restore -- .github/workflows/ci.yml .github/workflows/runtime-priority-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/adverse-media.mjs scripts/pep-worldwide.mjs test/runtime-priority.test.mjs test/adverse-media.test.mjs CHANGELOG.md
          git diff --cached --stat
          git commit -m 'fix: isolate provider waits and prioritize missing PEP person names'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/fix/runtime-priority-20260929
