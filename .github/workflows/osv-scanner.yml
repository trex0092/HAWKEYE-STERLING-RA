name: OSV-Scanner (toolchain CVEs)

# Audits the project's dependency surface for known vulnerabilities (OSV.dev).
# The app ships ZERO runtime npm dependencies, so GitHub Dependency Review (which
# only fires on manifest changes) has little to chew on; what actually carries
# risk is the dev/CI TOOLCHAIN (the pinned npm/pip/Actions versions). This scans
# the CycloneDX SBOM that scripts/gen-sbom.mjs already produces (the toolchain is
# its main content) plus the committed package-lock.json and source tree, against
# the OSV database.
#
# Scheduled + manual + on push to main — deliberately NOT a pull_request gate, so
# a newly-published CVE in a transitive dev tool never blocks an unrelated PR; it
# surfaces here and in the weekly run instead.
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  push:
    branches: [main]
    # All CI lockfiles, input pins and OSV exceptions are scan inputs. Excluding
    # ci/** delayed evidence after policy and dependency changes, leaving the
    # latest green badge stale despite unsuppressed vulnerabilities.
    paths: ['.github/workflows/**', 'ci/**', 'scripts/gen-sbom.mjs', 'package.json', 'package-lock.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (egress block)
        # Allowlist observed from the 2026-07-14 run's egress audit: GitHub
        # (checkout), nodejs.org for setup-node on a toolchain-cache miss, the
        # Go module proxy pair for `go install osv-scanner`
        # (storage.googleapis.com is the module CDN behind the proxy), and the
        # OSV/deps.dev APIs the scanner queries.
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            api.osv.dev:443
            api.deps.dev:443
            *.githubapp.com:443

      # GitHub's checkout action already retries Git internally. A separate
      # single retry helps a transient Actions-runner network refusal without
      # bypassing the pinned action, read-only credentials, or blocked egress.
      - name: Checkout repository (primary)
        id: checkout_primary
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Pause before one bounded GitHub checkout retry
        if: steps.checkout_primary.outcome == 'failure'
        run: |
          echo "::warning::GitHub checkout failed; retrying once after a 20-second pause."
          sleep 20

      - name: Checkout repository (single retry)
        id: checkout_retry
        if: steps.checkout_primary.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require verified repository checkout before vulnerability scanning
        env:
          PRIMARY_OUTCOME: ${{ steps.checkout_primary.outcome }}
          RETRY_OUTCOME: ${{ steps.checkout_retry.outcome }}
        run: |
          if [ "$PRIMARY_OUTCOME" != "success" ] && [ "$RETRY_OUTCOME" != "success" ]; then
            echo "::error::Both GitHub checkouts failed; OSV scan was not run."
            exit 1
          fi
          test -s scripts/gen-sbom.mjs || { echo "::error::SBOM generator missing after checkout."; exit 1; }
          test -s package-lock.json || { echo "::error::Lockfile missing after checkout."; exit 1; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Generate the CycloneDX SBOM
        run: node scripts/gen-sbom.mjs

      # Install OSV-Scanner with the same `go install` pattern used for actionlint
      # in workflow-lint.yml (no third-party action to pin).
      - name: Install OSV-Scanner
        # Version-pinned; integrity is verified by the Go module checksum DB (sum.golang.org).
        run: go install github.com/google/osv-scanner/cmd/osv-scanner@v1.9.2

      - name: Scan the SBOM and the source tree
        shell: bash
        run: |
          # Fail closed on a provider error, incomplete scan, or any finding in
          # EITHER the generated toolchain SBOM or the recursive repository.
          # Explicit pipefail keeps tee from hiding scanner exit statuses.
          # Do not stop after the first failed scan: retain both results.
          set -uo pipefail
          # GitHub's explicit Bash shell starts with errexit. Disable it only
          # while collecting both independent scan statuses, then restore it.
          set +e
          SCANNER="$(go env GOPATH)/bin/osv-scanner"
          "$SCANNER" --sbom=sbom.cdx.json | tee -a "$GITHUB_STEP_SUMMARY"
          sbom_status=$?
          # OSV v1.9.2 CLI has no "scan" subcommand; use its documented flag.
          "$SCANNER" --recursive . | tee -a "$GITHUB_STEP_SUMMARY"
          tree_status=$?
          set -e
          if [ "$sbom_status" -ne 0 ] || [ "$tree_status" -ne 0 ]; then
            echo "::error::OSV findings or incomplete scan: SBOM=$sbom_status; recursive=$tree_status. Both must pass."
            exit 1
          fi
