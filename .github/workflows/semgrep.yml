name: Semgrep SAST

# Static analysis that complements CodeQL:
#   - .semgrep/hawkeye.yml : app-specific security invariants (blocking, ERROR).
#   - p/javascript + p/security-audit : community rulesets (advisory; surfaced as
#     annotations + a step summary, never blocking, to avoid third-party rule
#     churn gating merges — CodeQL is the blocking generic scanner).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (egress block)
        # Allowlist observed from the 2026-07-14 run's egress audit: GitHub
        # (checkout), PyPI for the hash-locked semgrep install, and semgrep.dev
        # — the registry serving the p/javascript + p/security-audit rulesets
        # used by the advisory step (which is continue-on-error, so a missing
        # endpoint there would degrade silently: keep semgrep.dev listed).
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            semgrep.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install Semgrep (hash-locked)
        # Exact version + hashes (ci/semgrep-requirements.txt, pip-compile
        # --generate-hashes) so the SAST gate itself is supply-chain pinned.
        run: python -m pip install --quiet --require-hashes -r ci/semgrep-requirements.txt

      - name: Semgrep — app invariants (blocking)
        # Targets = the executable JS surface + the Python screening engine
        # (the hawkeye-py-* rules are dead code without the .py targets).
        # test/*.py stays out so the gate's surface tracks shipped code only.
        # assets/super-data.js is served under the CSP like any script — a
        # "data" file is exactly where a smuggled expression would hide; the
        # MCP layer and the STR assembler joined when they shipped un-SAST'd
        # (#377/#378, found 2026-08-04).
        run: |
          semgrep scan --config .semgrep/hawkeye.yml --error --metrics off \
            app.js console.js advisor.js assets/super-data.js scripts netlify \
            screen.py ai.py agents.py kyc.py txn_monitor.py monitoring.py \
            mcp_server.py mcp_tools.py str_dossier.py

      - name: Semgrep — community rulesets (advisory)
        continue-on-error: true
        run: |
          semgrep scan --config p/javascript --config p/security-audit \
            --metrics off --no-error \
            app.js console.js advisor.js assets/super-data.js scripts netlify | tee -a "$GITHUB_STEP_SUMMARY"
