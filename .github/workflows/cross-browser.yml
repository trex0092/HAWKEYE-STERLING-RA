name: Cross-Browser Smoke

# Functional smoke of the three screens in Chromium, Firefox and WebKit.
# Complements Visual Regression (chromium-only screenshot diff) by catching
# engine-specific JS/CSS breakage: each page must boot, paint substantial
# content, and raise NO uncaught JS exception in any engine. No screenshot
# baselines, so it is self-contained.
#
# pull_request has NO paths filter: the `smoke` job is a REQUIRED status in
# branch protection, and a required check that is path-gated deadlocks any PR
# that doesn't touch the app surface — it sits at "Expected — waiting for
# status" forever and the PR can never merge. The smoke exercises the committed
# screens regardless of what the PR changed, so it is always meaningful. The
# push trigger keeps its paths filter (nothing is gated on push, so skipping
# data/docs-only main commits there just saves runner minutes).

on:
  push:
    branches: [main]
    paths: ['index.html', 'console.html', 'advisor.html', 'app.js', 'console.js', 'advisor.js', 'i18n.js', 'app.css', 'console.css', 'advisor.css', 'fonts.css', 'assets/**', 'test/cross-browser.spec.mjs', 'test/keyboard.spec.mjs', 'test/print-report.spec.mjs', 'test/csp-runtime.spec.mjs', 'playwright.cross-browser.config.mjs', 'netlify.toml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          # sudo must stay enabled: `playwright install --with-deps` runs
          # `sudo apt-get` to install the browser system libraries (same as
          # the Visual Regression workflow). Disabling sudo breaks the install.
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Install Playwright + browsers
        # npm ci restores the lockfile-pinned toolchain (@playwright/test,
        # @axe-core/playwright, axe-core — the axe packages previously floated
        # to latest here). node_modules is gitignored.
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit

      - name: Cross-browser smoke
        # Non-blocking, mirroring the Visual Regression workflow's browser step:
        # the report is uploaded for inspection, but a single-engine quirk or a
        # flaky browser launch never blocks the merge. Findings live in the
        # uploaded artifact and the step annotation.
        continue-on-error: true
        run: npx playwright test --config=playwright.cross-browser.config.mjs

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cross-browser-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
