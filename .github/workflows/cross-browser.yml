name: Cross-Browser Smoke

# Functional smoke of the three screens in Chromium, Firefox and WebKit.
# Complements Visual Regression (chromium-only screenshot diff) by catching
# engine-specific JS/CSS breakage: each page must boot, paint substantial
# content, and raise NO uncaught JS exception in any engine. No screenshot
# baselines, so it is self-contained.

on:
  push:
    branches: [main]
    paths: ['index.html', 'console.html', 'advisor.html', 'assets/**', 'test/cross-browser.spec.mjs', 'playwright.cross-browser.config.mjs']
  pull_request:
    paths: ['index.html', 'console.html', 'advisor.html', 'assets/**', 'test/cross-browser.spec.mjs', 'playwright.cross-browser.config.mjs']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          disable-sudo: true
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Install Playwright + browsers
        # Local install so `import '@playwright/test'` resolves (the repo has no
        # package.json). node_modules is gitignored.
        run: |
          npm install @playwright/test@1.49.1
          npx playwright install --with-deps chromium firefox webkit

      - name: Cross-browser smoke
        run: npx playwright test --config=playwright.cross-browser.config.mjs

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cross-browser-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
