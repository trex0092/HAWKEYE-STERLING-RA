name: Anomaly Watch

# Escalates SUSTAINED runtime/coverage anomalies — an anomaly that has persisted
# across consecutive screening runs (per monitoring.sustained_anomalies), as
# opposed to a single-run blip — to a GitHub issue for the MLRO. Detection lives
# in monitoring.py and is unit-tested; this workflow only ROUTES the verdict.
# It reads the committed metrics history (data/run-metrics.json) from the
# screen-delta-state branch, where the engine persists it (main is push-
# protected); until the engine commits that state the run is a clean, green
# no-op.

on:
  schedule:
    - cron: '37 6 * * *'   # 06:37 UTC daily, just after the morning screening run (odd minute — see daily-brief.yml)
  workflow_dispatch:

# Least privilege: read the repo, write an issue. No other scope.
# Least privilege at the top level; the job declares its own write scope.
permissions:
  contents: read

concurrency:
  group: anomaly-watch
  cancel-in-progress: false

jobs:
  watch:
    permissions:
      contents: read
      issues: write # anomaly alerts are filed as issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          # Pure local-analysis + GitHub-API job: checkout/setup-python downloads
          # and the issue write are its ONLY legitimate egress.
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Overlay latest metrics history (lives on the screen-delta-state branch)
        run: |
          # The screening engine persists data/run-metrics.json on the
          # screen-delta-state branch (main is push-protected — GH006), so the
          # copy on main freezes at whatever the last direct-to-main commit was.
          # Reading main's copy here made the staleness heartbeat report a false
          # "dead pipeline" while the daily sweep was green (issue #222). A
          # MISSING branch is the pre-bootstrap case (fall back to main's copy);
          # a FAILED fetch must red this job — silently reverting to the stale
          # copy would re-create the false escalation. Anonymous fetch is fine:
          # the repo is public and checkout kept persist-credentials: false.
          if [ -n "$(git ls-remote --heads origin screen-delta-state)" ]; then
            git fetch origin screen-delta-state --depth=1
            git checkout FETCH_HEAD -- data/run-metrics.json
            echo "run-metrics overlaid from screen-delta-state"
          else
            echo "no screen-delta-state branch yet — using state from main"
          fi
      - name: Detect sustained anomalies
        id: detect
        run: |
          verdict="$(python monitoring.py escalate data/run-metrics.json)"
          echo "verdict: $verdict"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          if printf '%s' "$verdict" | grep -q '"escalate": true'; then
            echo "escalate=true" >> "$GITHUB_OUTPUT"
          else
            echo "escalate=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update the escalation issue
        if: steps.detect.outputs.escalate == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          VERDICT: ${{ steps.detect.outputs.verdict }}
        with:
          script: |
            const v = JSON.parse(process.env.VERDICT || '{}');
            const { owner, repo } = context.repo;
            const label = 'anomaly-watch';
            const today = new Date().toISOString().slice(0, 10);
            const summary = v.summary || (v.types || []).join(', ');
            const body = [
              '**The runtime monitor has detected a SUSTAINED anomaly** — one that persisted',
              `across the last ${v.window || 3} screening runs, not a one-off blip.`,
              '',
              `- Categories: **${summary}**`,
              `- Detected: ${today}`,
              '',
              'This is the degrade-loudly escalation from `monitoring.sustained_anomalies`.',
              'Investigate the screening engine (latency / error rate / subject coverage),',
              'confirm the sanctions lists are intact, and record the disposition. Close this',
              'issue once the anomaly has cleared for a full run.',
            ].join('\n');
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label });
            if (open.data.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number,
                body: `Still sustained as of ${today}: ${summary}.` });
              core.info(`updated existing escalation issue #${open.data[0].number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title: 'Sustained screening anomaly detected', body, labels: [label] });
              core.info(`opened escalation issue #${created.data.number}`);
            }
      # Close-the-loop: when the sustained window is clean again, say so and
      # close the escalation issue instead of leaving it open forever (the
      # anomaly-watch label is deliberately NOT stale-exempt, but waiting 67
      # days for actions/stale is not "cleared"). Safe by construction: the
      # detect step always emits escalate, and a missing/stale history reads
      # escalate=true via stale_history — so this can never fire on a dead
      # pipeline, only on a genuinely healthy last-3-runs window.
      - name: Clear and close the escalation issue when the anomaly is gone
        if: steps.detect.outputs.escalate == 'false'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = 'anomaly-watch';
            const today = new Date().toISOString().slice(0, 10);
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label });
            for (const issue of open.data) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                body: `Cleared as of ${today}: no sustained anomaly across the last-3-run window ` +
                      '(per `monitoring.sustained_anomalies` on the live metrics history). ' +
                      'Auto-closing — this re-opens as a new escalation if it recurs.' });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number,
                state: 'closed', state_reason: 'completed' });
              core.info(`cleared and closed escalation issue #${issue.number}`);
            }
            if (!open.data.length) core.info('no open escalation issue — nothing to clear');
