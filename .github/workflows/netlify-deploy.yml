name: Asana Delivery Verify (manual)

# Verifies the GitHub-native delivery path to Asana: GitHub Actions -> Asana
# REST API, directly. The scheduled compliance workflows (daily brief,
# screening, weekly summary) all deliver to Asana straight from Actions with
# ASANA_ACCESS_TOKEN — no Netlify hop — and this workflow proves that path
# end-to-end: it creates a throwaway task in the target project, confirms the
# task landed there, then deletes it.
#
# This file previously deployed/verified the Netlify web app's asana-task
# function. That hop is not needed for Actions -> Asana delivery and was
# retired; the filename is kept so the workflow's run history stays attached.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asana-delivery-verify
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        # This job handles ASANA_ACCESS_TOKEN and talks only to the Asana API.
        # Block all other egress so a compromised dependency can't exfiltrate it.
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            app.asana.com:443
            *.githubapp.com:443

      - name: Verify direct GitHub -> Asana delivery into HAWKEYE STERLING APP
        env:
          ASANA_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN || secrets.ASANA_TOKEN }}
          TARGET_PROJECT: "1216203370612914"
        run: |
          set -u
          if [ -z "${ASANA_TOKEN:-}" ]; then
            echo "::error::ASANA_ACCESS_TOKEN secret not set"
            exit 1
          fi
          REF="VERIFY-${GITHUB_RUN_ID}"
          HTTP=$(curl -sS -o resp.json -w '%{http_code}' -X POST "https://app.asana.com/api/1.0/tasks" \
            -H "Authorization: Bearer ${ASANA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"data\":{\"name\":\"VERIFY direct delivery ${REF} - safe to delete\",\"projects\":[\"${TARGET_PROJECT}\"],\"notes\":\"GitHub Actions -> Asana direct delivery verification (${REF}). Safe to delete.\"}}")
          echo "create: HTTP $HTTP"
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            cat resp.json; echo
            echo "::error::Asana task create failed (HTTP $HTTP)"
            exit 1
          fi
          GID=$(grep -o '"gid":"[0-9]*"' resp.json | head -n1 | grep -o '[0-9]*' || true)
          if [ -z "${GID:-}" ]; then
            cat resp.json; echo
            echo "::error::Asana response contained no task gid"
            exit 1
          fi
          # Re-read the task from the API so the project check is independent
          # of the create response's field shape.
          curl -sS -o verify.json -H "Authorization: Bearer ${ASANA_TOKEN}" \
            "https://app.asana.com/api/1.0/tasks/${GID}?opt_fields=projects.gid"
          if grep -q "\"gid\":\"${TARGET_PROJECT}\"" verify.json; then
            echo "PROJECT CHECK: PASS - task ${GID} delivered directly into ${TARGET_PROJECT} (HAWKEYE STERLING APP)"
            OK=1
          else
            cat verify.json; echo
            echo "PROJECT CHECK: FAIL - task ${GID} did not land in ${TARGET_PROJECT}"
            OK=0
          fi
          curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer ${ASANA_TOKEN}" "https://app.asana.com/api/1.0/tasks/${GID}" || true
          echo "cleaned up verification task ${GID}"
          [ "$OK" = 1 ] || exit 1
