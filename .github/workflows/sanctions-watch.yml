name: Sanctions Watch

# Daily check of the major consolidated designation lists (OFAC SDN + non-SDN,
# UN Security Council, UK OFSI, EU FSF) defined in data/sanctions-sources.json.
# On any change it creates a task in the "Regulations / Governance / Sanctions"
# Asana project, commits the refreshed fingerprint state to main, and falls back
# to a labelled GitHub issue if Asana delivery fails. Country black/grey list
# moves are handled by the FATF Watchdog.
#
# Needs the ASANA_ACCESS_TOKEN repository secret to route alerts to Asana.
# First run: dispatch with mode = seed to record the baseline quietly.

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC daily
  workflow_dispatch:
    inputs:
      mode:
        description: 'check (compare + alert on change) | seed (record baseline)'
        default: 'check'

permissions:
  contents: write
  issues: write

concurrency:
  group: sanctions-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run sanctions watch
        id: watch
        run: node scripts/sanctions-watch.mjs "${{ inputs.mode || 'check' }}"

      - name: Notify Asana — Regulations / Governance / Sanctions project
        id: asana
        continue-on-error: true
        if: steps.watch.outputs.has_changes == 'true' || inputs.mode == 'seed'
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          ASANA_REG_PROJECT_GID: ${{ vars.ASANA_REG_PROJECT_GID }}
          # "Sanctions updates" section of the Regulations/Governance/Sanctions project
          ASANA_SECTION_GID: ${{ vars.ASANA_SANCTIONS_SECTION_GID || '1215857714525481' }}
        run: node scripts/watch-notify.mjs "${{ steps.watch.outputs.pr_title }}" sanctions-watch-report.md sanctions-watch-changes.json

      - name: Commit refreshed fingerprint state to main
        if: steps.watch.outputs.has_changes == 'true' || inputs.mode == 'seed'
        run: |
          if [ -n "$(git status --porcelain data/ 2>/dev/null)" ]; then
            git config user.name "sanctions-watch"
            git config user.email "actions@github.com"
            git add data/sanctions-state.json
            git commit -m "${{ steps.watch.outputs.pr_title }} [skip ci]"
            for attempt in 1 2 3 4 5; do
              git push && break
              echo "push rejected (attempt $attempt) — rebasing on origin/main"
              git pull --rebase origin main || git rebase --abort
              sleep $((attempt * 3))
            done
          else
            echo "state unchanged"
          fi

      - name: Fallback to a GitHub issue if Asana delivery failed
        if: (steps.watch.outputs.has_changes == 'true' || inputs.mode == 'seed') && steps.asana.outcome == 'failure'
        uses: actions/github-script@v9
        env:
          PR_TITLE: ${{ steps.watch.outputs.pr_title }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('sanctions-watch-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const body = report + [
              '', '---',
              '> This change could not be delivered to the Asana "Regulations / Governance / Sanctions" project',
              '> (no `ASANA_ACCESS_TOKEN` repository secret, or the Asana API call failed), so this issue was opened instead.',
              '> Set the `ASANA_ACCESS_TOKEN` secret to route future changes to Asana automatically.',
            ].join('\n');
            await github.rest.issues.create({
              owner, repo,
              title: process.env.PR_TITLE || 'Sanctions Watch - changes detected',
              body,
              labels: ['sanctions-watch'],
            });
