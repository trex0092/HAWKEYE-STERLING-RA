name: Freshness Check

# Silent-failure alarm for the mandatory scheduled controls. A scheduled
# compliance watcher that simply stops running (bad cron, disabled workflow,
# runner outage) produces no failure — just nothing — which GitHub never alerts
# on. This guard runs after the watchers each day and asks the Actions API
# whether each mandatory control has a SUCCESSFUL run inside its cadence window
# (daily: today UTC; weekly: 8 days; quarterly: 96 days — see
# scripts/freshness-check.mjs CONTROLS); if any is missing it fails loudly
# (red + Actions email) and opens an Asana alert.
#
# Needs the ASANA_ACCESS_TOKEN repository secret to route the alert to Asana.

on:
  schedule:
    - cron: '9 9 * * *' # 09:09 UTC daily — after sanctions-watch (05:07), the screening runs and regulatory-watch (06:19)
  workflow_dispatch:

# Least privilege: read the repo + read Actions run history. The Asana alert on
# failure uses ASANA_ACCESS_TOKEN (a secret), not GITHUB_TOKEN.
permissions:
  contents: read
  actions: read

concurrency:
  group: freshness-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            app.asana.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify mandatory controls ran inside their cadence window
        id: freshness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/freshness-check.mjs

      - name: Alert in Asana on stale control
        if: failure()
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/asana-alert.mjs \
            "CONTROL STALE: a mandatory scheduled compliance control missed its cadence window" \
            "The Freshness Check found that at least one mandatory control (daily: Sanctions Watch / Daily Screening / Sanctions Screen / Regulatory Watch / FATF Watchdog / Onboarding Screen; weekly: Advisor Guardrail Eval; quarterly: Advisor Bias Eval / Quarterly Screening Review) has no successful run inside its cadence window. A scheduled control that silently stops is a potential regulatory breach (e.g. UNSC / EOCN ingestion must run daily without delay; the evals evidence the AI assurance cadence). Review the schedules and the run log: $RUN_URL"
