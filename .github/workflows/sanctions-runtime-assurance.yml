name: Sanctions Runtime Assurance

on:
  schedule:
    - cron: '27 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sanctions-runtime-assurance.mjs'
      - 'scripts/sanctions-screen.mjs'
      - 'scripts/sanctions-match.mjs'
      - 'data/sanctions-sources.json'
      - 'data/worldwide-screening-sources.json'
      - '.github/workflows/sanctions-runtime-assurance.yml'

permissions:
  contents: read

concurrency:
  group: sanctions-runtime-assurance
  cancel-in-progress: true

jobs:
  prove:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            app.asana.com:443
            sanctionslistservice.ofac.treas.gov:443
            wc2h-sls-prod-public-published.s3.us-gov-west-1.amazonaws.com:443
            scsanctions.un.org:443
            unsolprodfiles.blob.core.windows.net:443
            webgate.ec.europa.eu:443
            ecas.ec.europa.eu:443
            sanctionslist.fcdo.gov.uk:443
            *.githubapp.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Prove required sanctions runtime
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          ASANA_CUSTOMER_PROJECT_GID: ${{ vars.ASANA_CUSTOMER_PROJECT_GID }}
          ASANA_EMPLOYEE_PROJECT_GID: ${{ vars.ASANA_EMPLOYEE_PROJECT_GID }}
          SCREEN_MATCH_THRESHOLD: ${{ vars.SCREEN_MATCH_THRESHOLD }}
          # Personal EU FSF crawler token (optional): the shared public token now
          # redirects to EU Login. Unset = public token, and the EU list fails loudly.
          EU_FSF_TOKEN: ${{ secrets.EU_FSF_TOKEN }}
        run: node scripts/sanctions-runtime-assurance.mjs

      - name: Persist sanctions runtime evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/sanctions-runtime/data/badges
          cp data/sanctions-runtime-assurance.json /tmp/sanctions-runtime/data/
          cp data/badges/sanctions-operational.svg /tmp/sanctions-runtime/data/badges/
          rm -f data/sanctions-runtime-assurance.json data/badges/sanctions-operational.svg

          git config user.name "sanctions-runtime-assurance"
          git config user.email "actions@github.com"
          git fetch origin screen-state --depth=1
          git checkout --detach FETCH_HEAD
          mkdir -p data/badges
          cp /tmp/sanctions-runtime/data/sanctions-runtime-assurance.json data/
          cp /tmp/sanctions-runtime/data/badges/sanctions-operational.svg data/badges/
          git add data/sanctions-runtime-assurance.json data/badges/sanctions-operational.svg

          if git diff --cached --quiet; then
            echo "sanctions runtime evidence unchanged"
            exit 0
          fi

          git commit -m "chore(state): refresh sanctions runtime assurance"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:screen-state
