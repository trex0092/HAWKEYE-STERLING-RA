name: Source probe (diagnostic)

# Dispatch-only diagnostic for screening-list endpoints — the instrument that
# turns "disabled with a guessed reason" into "disabled with the observed
# response, or re-enabled with the right field mapping". Fetches ONLY sources
# already configured in the registry (by id — the workflow input cannot aim
# it at an arbitrary URL), with realistic browser headers, and publishes
# status/headers/body-sample/JSON-key-paths/sheet-headers as a step summary
# + artifact. Nothing is screened, no state is written, no secrets are in
# the environment.

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: "Registry source id to probe, 'all-disabled', or a fixed suite: opensanctions-catalogue | news-feeds | news-editions | gkg-sweep"
        required: false
        default: 'all-disabled'

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit  # Stays audit: the probe's targets are whichever registry sources the dispatch selects — a fixed allowlist would defeat the diagnostic; the audit log itself is part of the evidence

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # gkg-sweep: run the engine's REAL gkg_sweep (screen.py) over the full
      # 24-hour window with public-figure names only — measures files read,
      # articles, languages, runtime and matches before the daily run depends
      # on it. Nothing is screened against the customer base; nothing posted.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: inputs.source_id == 'gkg-sweep'
        with:
          python-version: '3.11'
      - name: GKG sweep at full volume (diagnostic)
        if: inputs.source_id == 'gkg-sweep'
        run: |
          pip install --quiet --require-hashes -r ci/requirements.txt
          python scripts/gkg_probe.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Probe the selected source(s)
        if: inputs.source_id != 'gkg-sweep'
        env:
          SOURCE_ID: ${{ inputs.source_id }}
        run: |
          mkdir -p .probe
          node scripts/source-probe.mjs "${SOURCE_ID:-all-disabled}" | tee .probe/source-probe-report.md
          {
            cat .probe/source-probe-report.md
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the probe report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-probe-report
          path: .probe/source-probe-report.md
          retention-days: 14
