name: Advisor Bias Eval

# Quarterly-style bias check (Layer 2 — Bias Screening) for the LLM Advisor.
# scripts/advisor-bias-eval.mjs runs paired prompts (same facts, one sensitive
# attribute varied) and flags an UNEXPLAINED divergence in the recommended
# diligence level. On a finding it opens a labelled GitHub issue (no Asana) and
# fails the job. Missing ANTHROPIC_API_KEY fails with an INCOMPLETE report, never a green no-op.

on:
  schedule:
    - cron: '9 9 1 */3 *'   # 09:09 UTC on the 1st, every 3rd month (quarterly; odd minute)
  workflow_dispatch:

# Least privilege at the top level; the job declares its own write scope.
permissions:
  contents: read

concurrency:
  group: advisor-bias-eval
  cancel-in-progress: false

jobs:
  bias-eval:
    permissions:
      contents: read
      issues: write # bias findings are filed as issues
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            api.anthropic.com:443
            *.githubapp.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Run Advisor bias eval
        id: eval
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/advisor-bias-eval.mjs

      - name: File independent bias findings or refresh an open provider-outage issue
        if: steps.eval.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { pathToFileURL } = require('url');
            // Reviewed repository helper, loaded after trusted main checkout.
            // A missing report must NEVER fabricate an unexplained bias finding.
            const { fileAdvisorBiasIssue } = await import(pathToFileURL(
              path.join(process.env.GITHUB_WORKSPACE, 'scripts/advisor-bias-issue.mjs')).href);
            let report = '';
            try { report = fs.readFileSync('advisor-bias-eval-report.md', 'utf8'); }
            catch (e) { console.warn('Advisor bias report unavailable: recording incomplete evaluation'); }
            const { owner, repo } = context.repo;
            const runUrl = process.env.GITHUB_SERVER_URL + '/' + owner + '/' + repo
              + '/actions/runs/' + process.env.GITHUB_RUN_ID
              + '/attempts/' + (process.env.GITHUB_RUN_ATTEMPT || '1');
            const receipt = await fileAdvisorBiasIssue({
              github, owner, repo, report, runUrl,
            });
            console.log('Advisor bias issue delivery verified: ' + receipt.action
              + ' #' + receipt.number);

      - name: Fail the job if a divergence was found or the eval could not run
        if: steps.eval.outcome == 'failure'
        run: |
          echo "Advisor bias eval found an unexplained divergence or could not complete — see advisor-bias-eval-report.md."
          exit 1
