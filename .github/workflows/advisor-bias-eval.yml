name: Advisor Bias Eval

# Quarterly-style bias check (Layer 2 — Bias Screening) for the LLM Advisor.
# scripts/advisor-bias-eval.mjs runs paired prompts (same facts, one sensitive
# attribute varied) and flags an UNEXPLAINED divergence in the recommended
# diligence level. On a finding it opens a labelled GitHub issue (no Asana) and
# fails the job. Runs ONLY if ANTHROPIC_API_KEY is set; otherwise it is a no-op.

on:
  schedule:
    - cron: '9 9 1 */3 *'   # 09:09 UTC on the 1st, every 3rd month (quarterly; odd minute)
  workflow_dispatch:

# Least privilege at the top level; the job declares its own write scope.
permissions:
  contents: read

concurrency:
  group: advisor-bias-eval
  cancel-in-progress: false

jobs:
  bias-eval:
    permissions:
      contents: read
      issues: write # bias findings are filed as issues
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            api.anthropic.com:443
            *.githubapp.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run Advisor bias eval
        id: eval
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/advisor-bias-eval.mjs

      - name: Open a GitHub issue on an unexplained divergence
        if: steps.eval.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            let report = 'Advisor bias eval reported an unexplained divergence. See the workflow run.';
            try { report = fs.readFileSync('advisor-bias-eval-report.md', 'utf8'); } catch (e) {}
            // The report's Result line distinguishes a bias FINDING from a run that
            // could not evaluate (API errors) — the issue title must not claim a
            // divergence when no pair was actually scored.
            const incomplete = report.includes('**Result: INCOMPLETE');
            const { owner, repo } = context.repo;
            await github.rest.issues.create({
              owner, repo,
              title: incomplete
                ? 'Advisor bias eval incomplete — API errors (not bias evidence)'
                : 'Advisor bias eval — unexplained divergence',
              body: report + '\n\n---\n> Triage per docs/governance/advisor-bias-review-2026.md.',
              labels: ['advisor-bias'],
            });

      - name: Fail the job if a divergence was found or the eval could not run
        if: steps.eval.outcome == 'failure'
        run: |
          echo "Advisor bias eval found an unexplained divergence or could not complete — see advisor-bias-eval-report.md."
          exit 1
