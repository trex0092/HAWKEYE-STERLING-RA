name: Control Retry (self-healing dispatcher)

# Shared recovery for the registered mandatory controls, including overdue
# weekly/quarterly controls, plus safe runtime/delivery/production probes.
# A dispatch request is never reported as proof that a control is operational.
on:
  schedule:
    - cron: '7,37 6-23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/control-retry.yml'
      - 'scripts/workflow-recovery.mjs'
      - 'scripts/freshness-check.mjs'
      - 'scripts/evidence-aware-recovery.mjs'
      - 'scripts/evidence-aware-recovery-selftest.mjs'
      - 'scripts/screening-assurance.mjs'
      - 'scripts/github-workflow-dispatch-guard.mjs'
  pull_request:
    paths:
      - '.github/workflows/control-retry.yml'
      - 'scripts/workflow-recovery.mjs'
      - 'scripts/freshness-check.mjs'
      - 'scripts/evidence-aware-recovery.mjs'
      - 'scripts/evidence-aware-recovery-selftest.mjs'
      - 'scripts/screening-assurance.mjs'
      - 'scripts/github-workflow-dispatch-guard.mjs'

permissions:
  contents: read

concurrency:
  group: control-retry-${{ github.event_name == 'pull_request' && github.ref || 'runtime' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            *.githubapp.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate recovery syntax and offline regression cases
        run: |
          node --check scripts/workflow-recovery.mjs
          node scripts/workflow-recovery.mjs --self-test
          node --check scripts/evidence-aware-recovery.mjs
          node scripts/evidence-aware-recovery-selftest.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { CONTROLS } from './scripts/freshness-check.mjs';
          import { decide, makeApi, readRuns, HELPERS, activePrerequisite } from './scripts/workflow-recovery.mjs';
          import { dispatchOnce } from './scripts/github-workflow-dispatch-guard.mjs';
          import { checkStored, approvedSourcePopulationIssue } from './scripts/screening-assurance.mjs';
          import { qualifyEvidence, recoveryStepSummary } from './scripts/evidence-aware-recovery.mjs';
          for (const helper of [makeApi, readRuns, activePrerequisite, dispatchOnce, checkStored, approvedSourcePopulationIssue]) {
            assert.equal(typeof helper, 'function', 'the runtime helper must be exported and loadable');
          }
          assert.ok(Array.isArray(HELPERS), 'the existing operational helpers remain registered');
          const watchControl = CONTROLS.find(c => c.id === 'sanctions-watch.yml');
          assert.ok(watchControl, 'the mandatory Sanctions Watch must remain registered');
          assert.equal(watchControl.allowPush, true,
            'protected-main Sanctions Watch executions are real operational runs');
          const watchRun = { id: 2, event: 'push', head_branch: 'main',
            status: 'completed', conclusion: 'success', created_at: '2026-09-29T06:00:00Z' };
          assert.equal(decide(watchControl, [watchRun], { nowMs: Date.parse('2026-09-29T12:00:00Z') }).action,
            'healthy', 'a successful protected-main Sanctions Watch must prevent duplicate recovery dispatch');
          const control = CONTROLS.find(c => c.id === 'sanctions-screen.yml');
          assert.ok(control, 'the actual sanctions producer must remain registered');
          const nowMs = Date.parse('2026-09-29T12:00:00Z');
          const run = { id: 1, event: 'schedule', head_branch: 'main',
            status: 'completed', conclusion: 'success', created_at: '2026-09-29T06:00:00Z' };
          assert.equal(decide(control, [run], { nowMs }).action, 'healthy');
          assert.equal(decide(control, [{ ...run, conclusion: 'failure' }], { nowMs }).action, 'dispatch');
          console.log('Legacy cadence regression only; evidence-aware recovery independently gates the producer.');
          // Synthetic integration fixture only. No operational receipt is written.
          const expectedSha = 'a'.repeat(40);
          const fixture = { version: 1, generatedAt: '2026-09-29T10:00:00Z', operational: true,
            run: { githubRunId: '123', commit: expectedSha, screenedSubjects: 991 },
            sourceQuality: { assured: true, reasons: [], evidence: {
              sanctionsFloors: [{ id: 'fixture', minimum: 1, observed: 1, primaryComplete: true }],
              fallbackSourcesUsed: [], adverseMediaPartialSubjects: 0, pepUnscreenableSourceRecords: 0,
              adverseMediaBackboneFailures: { googleNews: 0, gdelt: 0, bing: 0 } } },
            domains: {
              sanctions: { operational: true, evidence: { sourcePopulation: {
                customer: { projectGid: '1214107620220121', screenedSubjects: 971 },
                employee: { projectGid: '1216239131596624', screenedSubjects: 20 } } } },
              adverseMedia: { operational: true, evidence: { screenedSubjects: 991, skippedSubjects: 0,
                partialSubjects: 0, globalBackbones: ['Google News RSS', 'GDELT global index', 'Bing News'],
                backboneFailures: { googleNews: 0, gdelt: 0, bing: 0 } } },
              pep: { operational: true, evidence: { sourceUnscreenable: [] } } } };
          const producer = { ...run, id: 123, head_sha: expectedSha, path: '.github/workflows/sanctions-screen.yml' };
          const verify = () => qualifyEvidence(fixture, producer, expectedSha,
            { nowMs, checkStored, approvedSourcePopulationIssue });
          assert.equal(verify().state, 'verified', 'valid fixture integrates with unchanged production validators');
          fixture.sourceQuality.assured = false;
          assert.equal(verify().state, 'degraded', 'actual production quality validation fails closed');
          fixture.sourceQuality.assured = true;
          fixture.domains.sanctions.evidence.sourcePopulation.employee.projectGid = 'unapproved-fixture';
          assert.equal(verify().state, 'degraded', 'actual production source validation rejects redirection');
          console.log('Three offline integration cases passed with real imported validators; no live evidence was generated.');
          const payload = '<script>untrusted-API-payload</script>\n::error::payload';
          const valid = { state: 'verified', stateSha: payload, blobSha: payload };
          const row = action => ({ action, id: payload, reason: payload });
          const fixed = recoveryStepSummary(valid, [row('healthy')]);
          const blocked = recoveryStepSummary({ state: 'degraded' }, [row('healthy')]);
          assert.match(blocked, /BLOCKED OR UNVERIFIED/);
          assert.notEqual(fixed, blocked);
          let checks = 2;
          for (const action of ['healthy', 'wait', 'cooldown', 'skip', 'dispatched']) {
            const output = recoveryStepSummary(valid, [row(action)]);
            assert.equal(output, fixed);
            assert.ok(!output.includes(payload) && !output.includes('untrusted-API-payload'));
            checks++;
          }
          for (const rows of [[], null, [null], [row('blocked')], [row('unknown')], [row(payload)]]) {
            assert.equal(recoveryStepSummary(valid, rows), blocked);
            checks++;
          }
          for (const state of ['unknown', 'degraded', payload, undefined]) {
            assert.equal(recoveryStepSummary({ state }, [row('healthy')]), blocked);
            checks++;
          }
          const code = readFileSync('scripts/evidence-aware-recovery.mjs', 'utf8');
          assert.ok(code.includes('console.log(report);'));
          assert.ok(code.includes('appendFileSync(process.env.GITHUB_STEP_SUMMARY, recoveryStepSummary(evidence, rows));'));
          assert.ok(!code.includes('appendFileSync(process.env.GITHUB_STEP_SUMMARY, report);'));
          checks += 3;
          console.log(`${checks} offline summary-security checks passed. No live evidence was created or changed.`);
          NODE

  heal:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            app.asana.com:443
            *.githubapp.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Recover controls without duplicate runs or false success
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/evidence-aware-recovery.mjs
      - name: Alert when recovery needs intervention
        if: failure()
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/asana-alert.mjs \
            "WORKFLOW RECOVERY BLOCKED: a registered control needs intervention" \
            "Recovery encountered an unverifiable status, disabled workflow, or exhausted retry budget. Review the job log for per-control decisions and the summary for status. No operational pass is inferred from an accepted dispatch. $RUN_URL"
