name: Control Retry (self-healing dispatcher)

# Repo-wide self-healing for the mandatory DAILY controls. The 24-25 Jul
# incidents showed the failure mode: a scheduled control's runner VM dies to a
# transient infra kill ("The runner has received a shutdown signal"), the day's
# run stays red, and nothing re-fires it until a human notices hours later —
# meanwhile Freshness Check correctly cascades red. weekly-adverse-media.yml
# gained its own 03:07 UTC retry; this dispatcher generalises the pattern to
# EVERY daily control without touching each workflow: for each control with no
# successful run today (UTC) and no run currently queued/in progress, it fires
# one workflow_dispatch. Two passes (07:37 and 10:07 UTC) both land before the
# Freshness Check firing (~11:07 UTC in practice), so a transient morning death
# is healed the same day.
#
# Deliberately narrow, so it can never mask a real failure:
#   - a control that fails DETERMINISTICALLY (e.g. the EOCN review-age gate)
#     fails again on re-dispatch and the day stays honestly red;
#   - a control mid-run is left alone (its own concurrency group would queue
#     the duplicate anyway);
#   - at most one dispatch per control per firing — no retry storms.
# The weekly/quarterly evals are excluded: their windows are days-wide, so a
# single transient death never breaches them and their own schedules recover.

on:
  schedule:
    - cron: '37 7 * * *'   # first healing pass — after every daily control's own schedule
    - cron: '7 10 * * *'   # second pass — catches a retry that itself died; still before freshness (~11:07)
  workflow_dispatch:

# Least privilege: read-only at top level; the healer job below elevates the
# one scope it needs (Scorecard Token-Permissions).
permissions:
  contents: read

concurrency:
  group: control-retry
  cancel-in-progress: false

jobs:
  heal:
    # actions: write — read run history + fire workflow_dispatch on the controls.
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            *.githubapp.com:443

      - name: Re-dispatch any daily control missing today's success
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          # Keep in step with the daily entries in scripts/freshness-check.mjs
          # CONTROLS (maxAgeDays 0). The freshness test pins that list; a new
          # daily control should be added in both places.
          CONTROLS="sanctions-watch.yml weekly-adverse-media.yml regulatory-watch.yml sanctions-screen.yml fatf-watchdog.yml onboarding-screen.yml"
          today="$(date -u +%Y-%m-%d)"
          rc=0
          for wf in $CONTROLS; do
            resp=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/workflows/$wf/runs?created=%3E%3D${today}&per_page=50") || { echo "::error::API query failed for $wf"; rc=1; continue; }
            summary=$(printf '%s' "$resp" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          runs = d.get("workflow_runs", [])
          ok = sum(1 for r in runs if r.get("conclusion") == "success")
          live = sum(1 for r in runs if r.get("status") in ("queued", "in_progress", "waiting"))
          print(f"{ok} {live} {len(runs)}")')
            ok=$(echo "$summary" | cut -d' ' -f1)
            live=$(echo "$summary" | cut -d' ' -f2)
            total=$(echo "$summary" | cut -d' ' -f3)
            if [ "$ok" -gt 0 ]; then
              echo "OK   $wf — $ok success(es) today ($total run(s))"
            elif [ "$live" -gt 0 ]; then
              echo "WAIT $wf — a run is queued/in progress; leaving it alone"
            else
              echo "HEAL $wf — no success and nothing running today ($total run(s)); dispatching"
              code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/actions/workflows/$wf/dispatches" \
                -d '{"ref":"main"}')
              if [ "$code" != "204" ]; then
                cat /tmp/dispatch.out; echo
                echo "::error::dispatch failed for $wf (HTTP $code)"
                rc=1
              fi
            fi
          done
          exit "$rc"
