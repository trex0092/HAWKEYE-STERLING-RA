name: Control Retry (self-healing dispatcher)

# Shared recovery for the registered mandatory controls, including overdue
# weekly/quarterly controls, plus safe runtime/delivery/production probes.
# A dispatch request is never reported as proof that a control is operational.
on:
  schedule:
    - cron: '7,37 6-23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/control-retry.yml'
      - 'scripts/workflow-recovery.mjs'
      - 'scripts/freshness-check.mjs'
  pull_request:
    paths:
      - '.github/workflows/control-retry.yml'
      - 'scripts/workflow-recovery.mjs'
      - 'scripts/freshness-check.mjs'

permissions:
  contents: read

concurrency:
  group: control-retry-${{ github.event_name == 'pull_request' && github.ref || 'runtime' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            *.githubapp.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Validate recovery syntax and offline regression cases
        run: |
          node --check scripts/workflow-recovery.mjs
          node scripts/workflow-recovery.mjs --self-test
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { CONTROLS } from './scripts/freshness-check.mjs';
          import { decide } from './scripts/workflow-recovery.mjs';
          const control = CONTROLS.find(c => c.id === 'sanctions-screen.yml');
          assert.ok(control, 'the actual sanctions producer must remain registered');
          const nowMs = Date.parse('2026-09-29T12:00:00Z');
          const run = { id: 1, event: 'schedule', head_branch: 'main',
            status: 'completed', conclusion: 'success', created_at: '2026-09-29T06:00:00Z' };
          assert.equal(decide(control, [run], { nowMs }).action, 'healthy');
          assert.equal(decide(control, [{ ...run, conclusion: 'failure' }], { nowMs }).action, 'dispatch');
          console.log('Registry integration: successful sanctions execution is recognized; a failed bail is retried.');
          NODE

  heal:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            app.asana.com:443
            *.githubapp.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Recover controls without duplicate runs or false success
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/workflow-recovery.mjs
      - name: Alert when recovery needs intervention
        if: failure()
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/asana-alert.mjs \
            "WORKFLOW RECOVERY BLOCKED: a registered control needs intervention" \
            "Recovery encountered an unverifiable status, disabled workflow, or exhausted retry budget. Review the per-control job summary. No operational pass is inferred from an accepted dispatch. $RUN_URL"
