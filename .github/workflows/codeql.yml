name: CodeQL

# Static security analysis (SAST) of the app's JavaScript AND Python. CodeQL's JS
# extractor scans the inline <script> in index.html plus scripts/*.mjs,
# netlify/functions/*.js and test/*; the Python extractor scans the screening
# engine (screen.py, ai.py, agents.py, kyc.py, monitoring.py, txn_monitor.py) —
# the network/XML/PDF-parsing code that is otherwise unscanned. Findings surface
# in the repo's Security → Code scanning tab. This is the one CI gap not covered
# by ci.yml (which only runs tests + a render smoke).
# On a failed *scheduled* run it opens an assigned alert task in the RISK
# ASSESSMENTS Asana project, mirroring site-health.yml.
on:
  # Push is scoped to main only: feature branches are already analysed by the
  # pull_request trigger. Running on every branch push too spawns a second,
  # redundant analysis whose code-scanning upload races the PR run and fails
  # with "ref ... not found in this repository". main + PRs + the weekly
  # schedule keep full coverage. (lint.yml scopes push the same way.)
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '11 6 * * 1' # 06:11 UTC every Monday (odd minute)
  workflow_dispatch:

# Least privilege at the top level; the analyze job widens to the minimum it
# needs (security-events: write to upload SARIF). Scorecard's Token-Permissions
# check wants an explicit top-level block.
permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          disable-sudo: true
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: javascript-typescript,actions,python
          queries: security-and-quality
          # Scope: production code only. design/ holds static reference mockups
          # (see design/README.md) that never ship as part of the app's pages,
          # and test/ holds fixtures/assertions whose "findings" are the test
          # inputs themselves (e.g. URL-substring checks in test doubles).
          # Scanning them produced only non-actionable alerts (CA-13 triage,
          # 2026-07-07 — docs/security/code-scanning-triage-2026-07.md).
          config: |
            paths-ignore:
              - design
              - test
      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
      - name: Alert in Asana
        if: failure() && github.event_name == 'schedule'
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/asana-alert.mjs \
            "CODE SCAN FAILED: HAWKEYE STERLING CodeQL run could not complete" \
            "The weekly CodeQL security scan failed before producing results. Review the run log and the Security → Code scanning tab: $RUN_URL"
