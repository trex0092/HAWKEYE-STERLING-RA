name: CodeQL

# Static security analysis (SAST) of the app's JavaScript. CodeQL's JS extractor
# scans the inline <script> in index.html plus scripts/*.mjs, netlify/functions/*.js
# and test/*, surfacing findings in the repo's Security → Code scanning tab. This is
# the one CI gap not covered by ci.yml (which only runs tests + a render smoke).
# On a failed *scheduled* run it opens an assigned alert task in the RISK
# ASSESSMENTS Asana project, mirroring site-health.yml.
on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # 06:00 UTC every Monday (one hour after site-health)
  workflow_dispatch:

# Least privilege at the top level; the analyze job widens to the minimum it
# needs (security-events: write to upload SARIF). Scorecard's Token-Permissions
# check wants an explicit top-level block.
permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
      - name: Alert in Asana
        if: failure() && github.event_name == 'schedule'
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/asana-alert.mjs \
            "CODE SCAN FAILED: HAWKEYE STERLING CodeQL run could not complete" \
            "The weekly CodeQL security scan failed before producing results. Review the run log and the Security → Code scanning tab: $RUN_URL"
