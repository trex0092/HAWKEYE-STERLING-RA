name: Auto Release

# Publishes a GitHub release whenever main carries a new APP_VERSION:
# every feature/fix lands with a version bump in app.js, so each merge
# to main that changes the version is tagged automatically with generated
# notes (the PR titles since the previous release). Pushes that do not
# change APP_VERSION are a green no-op.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  release:
    # Write scopes live at job level (top level is read-only — least privilege).
    permissions:
      contents: write
      id-token: write       # OIDC for Sigstore-keyless build-provenance attestation
      attestations: write   # store the attestation in the repo's attestation log
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Protected environment: configure required reviewers on the `release`
    # environment in repo settings to gate publishing (see CONTRIBUTING.md).
    # Until configured, GitHub auto-creates it unprotected (no-op gating).
    environment: release
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          # Stays audit: release-asset upload + Sigstore attestation endpoints
          # vary, so a fixed allowlist would flake a release.
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false   # no git push here (gh/create-pull-request use the token directly)
      - name: Release the current APP_VERSION if untagged
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oE "APP_VERSION = '[0-9]+\.[0-9]+\.[0-9]+'" app.js | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          test -n "$V" || { echo "could not read APP_VERSION from app.js"; exit 1; }
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$V already released — nothing to do"
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "v$V" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "v$V" --generate-notes
            # Build the supply-chain artifacts: a deterministic source tarball of the
            # released commit + a CycloneDX SBOM. Both are attested below.
            git archive --format=tar.gz -o "hawkeye-sterling-ra-$V.tar.gz" "$GITHUB_SHA"
            gh release upload "v$V" "hawkeye-sterling-ra-$V.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber || echo "tarball upload skipped"
            if node scripts/gen-sbom.mjs; then
              gh release upload "v$V" sbom.cdx.json --repo "$GITHUB_REPOSITORY" --clobber || echo "SBOM upload skipped"
            else
              echo "SBOM generation skipped"
            fi
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$V" >> "$GITHUB_OUTPUT"
            echo "released v$V"
          fi

      # Sign the release artifacts with a Sigstore-keyless build-provenance
      # attestation (OIDC, no long-lived keys). Verify with:
      #   gh attestation verify hawkeye-sterling-ra-<v>.tar.gz --repo <owner>/<repo>
      - name: Attest build provenance for the release artifacts
        id: attest
        if: steps.rel.outputs.released == 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            hawkeye-sterling-ra-*.tar.gz
            sbom.cdx.json

      - name: Attach the Sigstore bundle as a release asset
        # The attestation lives in the repo attestation log either way; also
        # shipping the bundle beside the artifacts makes the release
        # self-contained and machine-verifiable (Scorecard: Signed-Releases).
        if: steps.rel.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.rel.outputs.version }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          # Two names for the same Sigstore bundle: the .sigstore copy is the
          # signature evidence, the .intoto.jsonl copy carries the SLSA
          # provenance statement under its conventional suffix.
          cp "$BUNDLE" "hawkeye-sterling-ra-$V.sigstore"
          cp "$BUNDLE" "hawkeye-sterling-ra-$V.intoto.jsonl"
          gh release upload "v$V" "hawkeye-sterling-ra-$V.sigstore" "hawkeye-sterling-ra-$V.intoto.jsonl" --repo "$GITHUB_REPOSITORY" --clobber || echo "bundle upload skipped"
