name: Auto Release

# Publishes a GitHub release whenever main carries a new APP_VERSION:
# every feature/fix lands with a version bump in index.html, so each merge
# to main that changes the version is tagged automatically with generated
# notes (the PR titles since the previous release). Pushes that do not
# change APP_VERSION are a green no-op.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Release the current APP_VERSION if untagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oE "APP_VERSION = '[0-9]+\.[0-9]+\.[0-9]+'" index.html | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          test -n "$V" || { echo "could not read APP_VERSION from index.html"; exit 1; }
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$V already released — nothing to do"
          else
            gh release create "v$V" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "v$V" --generate-notes
            echo "released v$V"
          fi
