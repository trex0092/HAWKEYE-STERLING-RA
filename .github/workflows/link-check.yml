name: Link Check

# Resolves every source URL in data/reg-sources.json + data/sanctions-sources.json
# and every link in docs/, to protect the "every answer cited" promise.
# Weekly: opens/updates a tracking issue when links are dead.
# Pull request: reports to the job summary, non-blocking (external links are flaky).

on:
  schedule:
    - cron: '0 7 * * 1'   # Mondays 07:00 UTC
  pull_request:
    paths:
      - 'data/reg-sources.json'
      - 'data/sanctions-sources.json'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check links
        id: lc
        run: node scripts/link-check.mjs

      - name: Job summary
        if: always()
        run: cat link-check-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open/refresh tracking issue (scheduled runs only)
        if: github.event_name == 'schedule' && steps.lc.outputs.has_dead == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('link-check-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const title = 'Link check: dead citations detected';
            const existing = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'link-check', per_page: 1 });
            if (existing.data.length) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['link-check'] });
            }
