name: Link Check

# Resolves every source URL in data/reg-sources.json + data/sanctions-sources.json
# and every link in docs/ and the top-level docs (README, SECURITY, CONTRIBUTING,
# CODE_OF_CONDUCT, SUPPORT, CHANGELOG), to protect the "every answer cited" promise
# and keep README badges/links live. Loopback + reserved-example placeholders
# (e.g. the README's localhost quick-start) are skipped, never probed.
# Weekly: opens/updates a tracking issue when links are dead.
# Pull request: reports to the job summary, non-blocking (external links are flaky).

on:
  schedule:
    - cron: '23 7 * * 1'   # Mondays 07:23 UTC (odd minute)
  pull_request:
    paths:
      - 'data/reg-sources.json'
      - 'data/sanctions-sources.json'
      - 'docs/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SUPPORT.md'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check links
        id: lc
        run: node scripts/link-check.mjs

      - name: Job summary
        if: always()
        run: |
          if [ -f link-check-report.md ]; then
            cat link-check-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "link-check produced no report (the check step errored before writing it — see its log)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open/refresh tracking issue (scheduled runs only)
        if: github.event_name == 'schedule' && steps.lc.outputs.has_dead == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('link-check-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const title = 'Link check: dead citations detected';
            const existing = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'link-check', per_page: 1 });
            if (existing.data.length) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['link-check'] });
            }
