name: Lighthouse

# Runs Lighthouse against the three screens on each PR and uploads the report.
# Decision: Lighthouse is ADVISORY (report-only) — the step is continue-on-error
# and category/size assertions are "warn", because Lighthouse scores are
# environment-sensitive and should not gate merges on infra flakiness.
# lighthouserc.json also sets resource budgets (script/stylesheet/font/total
# size) and a third-party-request budget of ZERO; the no-third-party guarantee
# is additionally HARD-enforced (blocking) by test/csp.test.mjs and the
# real-browser test/csp-runtime.spec.mjs, so this is a secondary signal.

on:
  pull_request:
    paths: ['index.html', 'console.html', 'advisor.html', 'assets/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          disable-sudo: true
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Run Lighthouse CI
        continue-on-error: true   # report scores; don't block PRs on infra flakiness
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
