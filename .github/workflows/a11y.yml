name: Accessibility (a11y)

# Audits the three screens against WCAG 2.1 AA with pa11y. BLOCKING: the three
# screens are clean (0 issues), so a newly-introduced WCAG2AA violation fails the
# gate rather than merging silently. Results are still mirrored to the job summary.

on:
  push:
    branches: [main]
    paths: ['index.html', 'console.html', 'advisor.html']
  pull_request:
    paths: ['index.html', 'console.html', 'advisor.html']
  schedule:
    - cron: '0 8 * * 1'   # Mondays 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  pa11y:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          disable-sudo: true
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Audit (WCAG 2.1 AA)
        id: a11y
        run: |
          set -o pipefail
          fail=0
          for f in index.html console.html advisor.html; do
            echo "## $f" | tee -a "$GITHUB_STEP_SUMMARY"
            npx --yes pa11y@8 --standard WCAG2AA --reporter cli \
              --config test/pa11y.config.json "file://$PWD/$f" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || fail=1
          done
          exit $fail
