name: Accessibility (a11y)

# Audits the three screens against WCAG 2.1 AA with pa11y. BLOCKING: the three
# screens are clean (0 issues), so a newly-introduced WCAG2AA violation fails the
# gate rather than merging silently. Results are still mirrored to the job summary.

# The path filter covers everything that builds the rendered DOM, not just the
# HTML shells: app.js/console.js/advisor.js construct most of what pa11y
# audits, the stylesheets carry contrast and focus-visibility, i18n flips
# lang/dir, and assets/super-data.js feeds the advisor's rendered Q&A. Filtering
# on the three .html files alone left every JS-built WCAG regression unaudited.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'console.html'
      - 'advisor.html'
      - 'app.js'
      - 'console.js'
      - 'advisor.js'
      - 'i18n.js'
      - 'app.css'
      - 'console.css'
      - 'advisor.css'
      - 'fonts.css'
      - 'assets/**'
      - '.github/workflows/a11y.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'console.html'
      - 'advisor.html'
      - 'app.js'
      - 'console.js'
      - 'advisor.js'
      - 'i18n.js'
      - 'app.css'
      - 'console.css'
      - 'advisor.css'
      - 'fonts.css'
      - 'assets/**'
      - '.github/workflows/a11y.yml'
  schedule:
    - cron: '9 8 * * 1'   # Mondays 08:09 UTC (odd minute)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  pa11y:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          # Stays audit: pa11y's puppeteer fetches Chrome from a variable CDN,
          # so a fixed allowlist would flake.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Audit (WCAG 2.1 AA)
        id: a11y
        # pa11y is intentionally NOT in package.json: its puppeteer dependency
        # downloads Chrome at install time, which would break `npm ci` in the
        # blocked-egress lint job and bloat every local/Netlify install. It is
        # exact-pinned here instead (was `pa11y@8`, which floats within 8.x).
        run: |
          set -o pipefail
          fail=0
          for f in index.html console.html advisor.html; do
            echo "## $f" | tee -a "$GITHUB_STEP_SUMMARY"
            npx --yes pa11y@8.0.0 --standard WCAG2AA --reporter cli \
              --config test/pa11y.config.json "file://$PWD/$f" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || fail=1
          done
          exit $fail
