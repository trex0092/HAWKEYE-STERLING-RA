name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run scoring-engine tests
        run: node test/app.test.js
      - name: Run FATF watchdog unit tests
        run: node test/watchdog.test.mjs
      - name: Run daily-brief unit tests
        run: node test/daily-brief.test.mjs
      - name: Run regulatory-watch unit tests
        run: node test/reg-watch.test.mjs
      - name: Run sanctions-watch unit tests
        run: node test/sanctions-watch.test.mjs
      - name: Run sanctions-screen unit tests
        run: node test/sanctions-screen.test.mjs
      - name: Run sanctions matcher unit tests
        run: node test/sanctions-match.test.mjs
      - name: Run adverse-media unit tests
        run: node test/adverse-media.test.mjs
      - name: Run PEP-check unit tests
        run: node test/pep-check.test.mjs
      - name: Run link-check unit tests
        run: node test/link-check.test.mjs
      - name: Run Asana Netlify-function tests (timeout + non-JSON handling)
        run: node test/asana-functions.test.js
      - name: Check Regulatory Watch docs are in sync with the registry
        run: node scripts/reg-sources-doc.mjs --check
      - name: Run console + advisor screen smoke tests
        run: node test/screens.test.js
      - name: Run advisor full-surface smoke tests (every Q&A subject + tool + ask phase)
        run: node test/advisor-smoke.test.js
      - name: Run Advisor assurance tests (charter integrity + tipping-off red-team + routing)
        run: node test/advisor-assurance.test.js
      - name: Run AI asset register schema test
        run: node test/ai-assets.test.js
      - name: Run data/*.json integrity test
        run: node test/data-json.test.js
      - name: Browser smoke test (reduced motion — stable)
        run: |
          # Reduced motion skips the gauge draw-in animation, whose mid-flight
          # rewind raced the DOM dump under virtual time (flaky runs 38/39).
          # Chrome's own exit code is tolerated; the greps are the assertions.
          google-chrome --headless=new --no-sandbox --disable-gpu --force-prefers-reduced-motion \
            --virtual-time-budget=5000 \
            --dump-dom "file://$PWD/index.html" > /tmp/dom.html || echo "chrome exit tolerated; asserting content"
          test -s /tmp/dom.html
          for s in 'HAWKEYE STERLING' 'Entity Risk Assessment' 'CDD — Customer Due Diligence' 'stroke-dasharray: 250.8, 600' 'AI Risk Advisor'; do
            grep -q "$s" /tmp/dom.html || { echo "MISSING: $s"; exit 1; }
          done
          echo "smoke ok — app renders, engine computes 19/CDD, gauge wired, advisor present"
      - name: Browser smoke test (motion enabled — animation paths)
        run: |
          # Second run without prefers-reduced-motion exercises the gauge draw-in
          # and count-up animation code paths that the stable run skips.
          google-chrome --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=8000 \
            --dump-dom "file://$PWD/index.html" > /tmp/dom-motion.html || echo "chrome exit tolerated; asserting content"
          test -s /tmp/dom-motion.html
          for s in 'HAWKEYE STERLING' 'CDD — Customer Due Diligence'; do
            grep -q "$s" /tmp/dom-motion.html || { echo "MISSING (motion run): $s"; exit 1; }
          done
          echo "motion smoke ok — animation code paths exercised"
      - name: Browser smoke test (AI Operations Console)
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --force-prefers-reduced-motion \
            --virtual-time-budget=5000 \
            --dump-dom "file://$PWD/console.html" > /tmp/dom-console.html || echo "chrome exit tolerated; asserting content"
          test -s /tmp/dom-console.html
          # New app (no register): the console must show zeros / empty states, not mock data.
          for s in 'Operations Console' 'AI ANALYST ON DUTY' 'Live Alert Stream' 'Jurisdiction Watch' 'Entities Monitored' 'No assessments filed yet'; do
            grep -q "$s" /tmp/dom-console.html || { echo "MISSING (console): $s"; exit 1; }
          done
          for s in 'Meridian Bullion DMCC' '9,471'; do
            grep -q "$s" /tmp/dom-console.html && { echo "UNEXPECTED mock data in console: $s"; exit 1; } || true
          done
          echo "console smoke ok — HUD + panels render, zero mock data on a fresh app"
      - name: Browser smoke test (Hawkeye Sterling Advisor)
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --force-prefers-reduced-motion \
            --virtual-time-budget=5000 \
            --dump-dom "file://$PWD/advisor.html" > /tmp/dom-advisor.html || echo "chrome exit tolerated; asserting content"
          test -s /tmp/dom-advisor.html
          for s in 'Hawkeye Sterling advisor.' 'Ask the advisor' 'Regulatory Q&amp;A' 'Super Tools' 'Ask me anything about AML compliance.' 'Advisor persona' 'You are interacting with an AI system'; do
            grep -q "$s" /tmp/dom-advisor.html || { echo "MISSING (advisor): $s"; exit 1; }
          done
          echo "advisor smoke ok — composer, persona picker and hero render"
