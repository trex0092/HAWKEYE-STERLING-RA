name: AI Governance Report

# One consolidated Asana task each morning covering the non-AML control suite:
# AI/advisor governance, security & supply-chain scans, CI/code quality,
# app/site health and release/repo hygiene — the daily operating-effectiveness
# evidence for ISO/IEC 42001 A.6/A.8 and NIST AI RMF MEASURE/MANAGE. Sibling of
# the Daily Compliance Brief (which rolls up the AML monitoring). It always
# files — "all green" on a quiet day — and flags scheduled controls that have
# silently stopped running (STALE), so silence is never evidence.
# Needs the ASANA_ACCESS_TOKEN secret; reads run states with the runner token.
on:
  schedule:
    - cron: '51 7 * * *' # 07:51 UTC daily (11:51 UAE), after the Daily Compliance Brief (07:09)
  workflow_dispatch:

permissions:
  contents: read
  actions: read # read the latest run state of every control workflow
  security-events: read # best-effort open code-scanning alert count

# Manual dispatch must not race the 07:45 schedule and double-post the report.
concurrency:
  group: governance-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            app.asana.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Compose and file the governance report
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          ASANA_REG_PROJECT_GID: ${{ vars.ASANA_DELIVERY_PROJECT_GID || '1216203370612914' }}
          ASANA_GOV_SECTION_GID: ${{ vars.ASANA_GOV_SECTION_GID }}
        run: node scripts/governance-report.mjs
