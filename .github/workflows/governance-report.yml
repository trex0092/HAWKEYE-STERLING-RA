name: AI Governance Report

# One consolidated report each morning (published in the run's job summary;
# Asana task delivery retired 2026-11-06) covering the non-AML control suite:
# AI/advisor governance, security & supply-chain scans, CI/code quality,
# app/site health and release/repo hygiene — the daily operating-effectiveness
# evidence for ISO/IEC 42001 A.6/A.8 and NIST AI RMF MEASURE/MANAGE. It always
# files — "all green" on a quiet day — and flags scheduled controls that have
# silently stopped running (STALE), so silence is never evidence.
# Reads run states with the runner token; needs no Asana secret.
on:
  schedule:
    - cron: '51 7 * * *' # 07:51 UTC daily (11:51 UAE), after the daily watchers
  workflow_dispatch:

permissions:
  contents: read
  actions: read # read the latest run state of every control workflow
  security-events: read # best-effort open code-scanning alert count

# Manual dispatch must not race the 07:45 schedule and double-post the report.
concurrency:
  group: governance-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            app.asana.com:443
            *.githubapp.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Compose and publish the governance report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node scripts/governance-report.mjs | tee -a "$GITHUB_STEP_SUMMARY"
