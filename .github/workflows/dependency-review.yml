name: Dependency Review

# Flags known-vulnerable dependencies introduced by a pull request. This repo is
# vanilla (no runtime npm deps), so this only runs when an actual dependency
# manifest changes — which is why it does NOT run on docs/data/workflow PRs.
# It requires the repo's Dependency Graph (Settings -> Code security and
# analysis), which is now enabled — so the step BLOCKS a PR that introduces a
# high-severity vulnerable dependency.

on:
  pull_request:
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '**/yarn.lock'
      - '**/pnpm-lock.yaml'
      - '**/requirements.txt'
      - '**/Gemfile.lock'
      - '**/composer.lock'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
