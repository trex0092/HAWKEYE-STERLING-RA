name: Dependency Review

# Flags known-vulnerable dependencies introduced by a pull request.
# It requires the repo's Dependency Graph (Settings -> Code security and
# analysis), which is now enabled — so the step BLOCKS a PR that introduces a
# high-severity vulnerable dependency.
#
# Runs on EVERY pull request (no paths filter): this check is a REQUIRED status
# in branch protection, and a required check that is path-gated deadlocks any
# PR that doesn't touch a manifest — it sits at "Expected — waiting for status"
# forever and the PR can never merge. When no dependency manifest changed, the
# action sees an empty diff and passes in seconds, so the always-run is cheap.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  review:
    # Display name MUST stay "Dependency Review": branch protection
    # (.github/settings.yml → required_status_checks.contexts) requires the
    # status context by this exact string. Without an explicit name the check
    # reports as the job id ("review"), never matches, and every PR waits on
    # "Dependency Review — Expected" forever.
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (egress block)
        # Egress = the dependency-review action: the GitHub dependency-graph API
        # plus api.deps.dev / api.securityscorecards.dev for vulnerability + OSV
        # enrichment of the changed dependencies.
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            api.deps.dev:443
            api.securityscorecards.dev:443
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
