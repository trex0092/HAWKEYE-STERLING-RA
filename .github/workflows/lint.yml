name: Lint

# ESLint on the Node scripts/tests/functions (real-breakage rules only) and
# HTMLHint on the three screens. ESLint is enforced; HTMLHint is reported but
# non-blocking (the hand-written HTML uses patterns HTMLHint is picky about).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (egress block)
        # Egress = setup-node (nodejs.org) + npm ci restoring the lockfile-pinned
        # dev toolchain from the npm registry. Nothing else leaves the runner.
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            registry.npmjs.org:443
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Install the pinned dev toolchain
        # npm ci restores the exact package-lock.json versions instead of the
        # floating major-pinned npx installs used before. No `cache: npm` on
        # setup-node — the Actions cache service endpoints are not in the
        # egress allow-list.
        run: npm ci --no-audit --no-fund

      - name: ESLint (app logic, scripts, tests, functions)
        run: npm run lint

      - name: HTMLHint (screens) — report only
        continue-on-error: true
        run: |
          npm run --silent lint:html | tee -a "$GITHUB_STEP_SUMMARY"
