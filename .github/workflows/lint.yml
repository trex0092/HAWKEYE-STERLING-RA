name: Lint

# ESLint on the Node scripts/tests/functions (real-breakage rules only) and
# HTMLHint on the three screens. ESLint is enforced; HTMLHint is reported but
# non-blocking (the hand-written HTML uses patterns HTMLHint is picky about).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          disable-sudo: true
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: ESLint (scripts, tests, functions)
        run: npx --yes eslint@9 scripts test netlify

      - name: HTMLHint (screens) — report only
        continue-on-error: true
        run: |
          npx --yes htmlhint@1 index.html console.html advisor.html | tee -a "$GITHUB_STEP_SUMMARY"
