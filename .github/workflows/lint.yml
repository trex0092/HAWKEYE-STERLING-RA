name: Lint

# ESLint on the Node scripts/tests/functions and Ruff on the Python screening
# engine — both scoped to real-breakage rules only — plus HTMLHint on the three
# screens. ESLint and Ruff are enforced; HTMLHint is reported but non-blocking
# (the hand-written HTML uses patterns HTMLHint is picky about).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (egress block)
        # Egress = setup-node (nodejs.org) + npm ci restoring the lockfile-pinned
        # dev toolchain from the npm registry. Nothing else leaves the runner.
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            registry.npmjs.org:443
            pypi.org:443
            files.pythonhosted.org:443
            *.githubapp.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install the pinned dev toolchain
        # npm ci restores the exact package-lock.json versions instead of the
        # floating major-pinned npx installs used before. No `cache: npm` on
        # setup-node — the Actions cache service endpoints are not in the
        # egress allow-list.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: ESLint (app logic, scripts, tests, functions)
        run: npm run lint

      - name: Install the pinned Ruff
        run: pip install --quiet --require-hashes -r ci/ruff-requirements.txt

      - name: Ruff (Python screening engine, real-breakage rules only)
        # Until 2026-07-29 the ~5,900 lines of Python that make the screening
        # decisions had no static analysis at all — `py_compile` (a syntax
        # check) was the only gate. Rule selection lives in pyproject.toml and
        # mirrors the ESLint scope above: pyflakes correctness, not formatting.
        run: ruff check .

      - name: HTMLHint (screens) — report only
        continue-on-error: true
        run: |
          npm run --silent lint:html | tee -a "$GITHUB_STEP_SUMMARY"
