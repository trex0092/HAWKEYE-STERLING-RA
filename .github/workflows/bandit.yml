name: Bandit (Python security lint)

# Advisory-only for its first rollout: Ruff (lint.yml) is scoped to real-breakage
# rules only (pyflakes + syntax, see pyproject.toml), so nothing in this repo has
# looked at the ~10,600 lines of Python screening code for security-specific
# patterns (hardcoded temp paths, requests without a timeout, subprocess use,
# try/except/pass, etc.) before this workflow. continue-on-error: true here
# mirrors semgrep.yml's community-ruleset step and lint.yml's HTMLHint step --
# report first via the job summary, decide what's worth enforcing once someone
# has actually triaged a baseline, rather than gate merges on an unreviewed tool
# turned on for the first time.
#
# test/ is excluded to match Ruff's per-file-ignores for the same directory
# (offline test harnesses intentionally do things production code should not).
# assets/ and node_modules/ are excluded because they carry no Python.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (egress block)
        # Bandit is a pure static analyzer -- no network calls during the scan
        # itself. Egress is only for checkout and the hash-locked pip install.
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            *.githubapp.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install Bandit (hash-locked)
        run: python -m pip install --quiet --require-hashes -r ci/bandit-requirements.txt

      - name: Bandit -- Python screening engine (advisory)
        continue-on-error: true
        run: |
          bandit -r . --exclude ./assets,./node_modules,./test | tee -a "$GITHUB_STEP_SUMMARY"
