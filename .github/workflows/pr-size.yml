name: PR Size Gate

# Warns (non-blocking) when a pull request touches more than 500 lines.
# Large diffs are harder to review for a compliance tool where
# auditability matters — the comment nudges authors to split if possible.
# The check never fails CI; it only adds a comment when the threshold is crossed.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Count lines changed
        id: count
        # Pass the SHAs through env (never interpolate into the shell); they are
        # hex-constrained but this is the safe pattern that keeps zizmor clean.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BASE="$BASE_SHA"
          HEAD="$HEAD_SHA"
          ADDED=$(git diff --numstat "$BASE" "$HEAD" | awk '{a+=$1} END{print a+0}')
          REMOVED=$(git diff --numstat "$BASE" "$HEAD" | awk '{a+=$2} END{print a+0}')
          TOTAL=$((ADDED + REMOVED))
          {
            echo "added=$ADDED"
            echo "removed=$REMOVED"
            echo "total=$TOTAL"
          } >> "$GITHUB_OUTPUT"
          echo "Lines changed: +$ADDED / -$REMOVED = $TOTAL total"

      - name: Warn on large PR
        if: ${{ fromJson(steps.count.outputs.total) > 500 }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        # Read the counts from env (not template-interpolated into the script body).
        env:
          TOTAL: ${{ steps.count.outputs.total }}
          ADDED: ${{ steps.count.outputs.added }}
          REMOVED: ${{ steps.count.outputs.removed }}
        with:
          script: |
            const total   = Number(process.env.TOTAL);
            const added   = Number(process.env.ADDED);
            const removed = Number(process.env.REMOVED);
            const body = [
              `> ⚠️ **Large PR — ${total} lines changed** (+${added} / −${removed})`,
              '',
              'PRs over 500 lines are harder to audit for a compliance tool.',
              'Consider splitting into smaller, focused changes where possible.',
              'This is a warning only — it does not block merge.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body
            });
