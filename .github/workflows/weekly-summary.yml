name: Weekly Compliance Summary

# Every Monday 09:00 UAE (05:03 UTC — odd minute per repo convention, GitHub
# delays top-of-hour crons the most). One consolidated Asana card with ALL the
# week's information: pipeline health, source health, regulatory changes (with
# links to the AI drafts), FATF list position, sanctions-list movement, and
# open customer-screening flags. If Asana is unreachable the summary lands as
# a labelled GitHub issue instead — the weekly delivery is never lost.

on:
  schedule:
    - cron: '3 5 * * 1'   # Mondays 05:03 UTC = 09:03 UAE
  workflow_dispatch:

# Least privilege at the top level; the job declares its own scopes.
permissions:
  contents: read

concurrency:
  group: weekly-summary
  cancel-in-progress: false

jobs:
  summary:
    permissions:
      contents: read
      actions: read # reads workflow-run history for the digest
      issues: write # posts the weekly summary issue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            app.asana.com:443
            *.githubapp.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # read-only job — never persist the token into .git/config
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Overlay latest watcher state (lives on the reg-watch-state branch)
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          if git fetch origin reg-watch-state --depth=1 2>/dev/null; then
            git checkout FETCH_HEAD -- data/reg-watch-state.json 2>/dev/null || true
            git checkout FETCH_HEAD -- docs/research/auto 2>/dev/null || true
            echo "state overlaid from reg-watch-state"
          else
            echo "no reg-watch-state branch — using state from main"
          fi
          # Each data branch contributes ONLY its own files — a whole-data/
          # checkout would overwrite one branch's fresh state with another
          # branch's stale copy of it.
          if git fetch origin screen-state --depth=1 2>/dev/null; then
            # P30 encrypt-forward: the branch's plaintext copies are restored to
            # main's (frozen) content and the real state rides in <file>.enc —
            # overlay BOTH and decrypt, or the summary computes screening/case
            # figures from a fossil (same class as anomaly-watch issue #304).
            git checkout FETCH_HEAD -- data/sanctions-screen-state.json 2>/dev/null || true
            git checkout FETCH_HEAD -- data/sanctions-screen-state.json.enc 2>/dev/null || true
            git checkout FETCH_HEAD -- data/screening-cases-state.json 2>/dev/null || true
            git checkout FETCH_HEAD -- data/screening-cases-state.json.enc 2>/dev/null || true
            node scripts/state-crypto.mjs decrypt data/sanctions-screen-state.json data/screening-cases-state.json
            echo "state overlaid from screen-state"
          fi
          if git fetch origin sanctions-watch-state --depth=1 2>/dev/null; then
            git checkout FETCH_HEAD -- data/sanctions-state.json 2>/dev/null || true
            echo "state overlaid from sanctions-watch-state"
          fi
          if git fetch origin fatf-state --depth=1 2>/dev/null; then
            git checkout FETCH_HEAD -- data/fatf-state.json 2>/dev/null || true
            echo "state overlaid from fatf-state"
          fi

      - name: Build and deliver the weekly summary
        id: summary
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          ASANA_REG_PROJECT_GID: ${{ vars.ASANA_DELIVERY_PROJECT_GID || '1216203370612914' }}
          # "AI & Platform Governance" section of the Ongoing Monitoring project
          ASANA_WEEKLY_SECTION_GID: ${{ vars.ASANA_WEEKLY_SECTION_GID || '1216229252787647' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Don't fail the run if Asana is unreachable; the issue fallback covers it.
        continue-on-error: true
        run: node scripts/weekly-summary.mjs

      - name: Fallback to a GitHub issue if Asana delivery failed
        if: steps.summary.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            let report = 'Weekly summary could not be generated — check the workflow run.';
            try { report = fs.readFileSync('weekly-summary.md', 'utf8'); } catch {}
            const { owner, repo } = context.repo;
            await github.rest.issues.create({
              owner, repo,
              title: 'Weekly Compliance Summary — Asana delivery failed',
              body: report + [
                '', '---',
                '> This summary could not be delivered to Asana (no `ASANA_ACCESS_TOKEN`',
                '> secret, or the API call failed), so this issue was opened instead.',
              ].join('\n'),
              labels: ['regulatory-watch'],
            });
