name: Dockerfile security lint (Hadolint)

# Adapted from actions/starter-workflows/code-scanning/hadolint.yml.
# This job NEVER builds, signs, pushes or deploys the image.
on:
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/dockerfile-security-lint.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/dockerfile-security-lint.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerfile-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-dockerfile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            *.githubapp.com:443

      - name: Checkout, without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check Dockerfile best practices (blocking)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.2.0 from GitHub starter workflows
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          no-fail: false
          format: tty
