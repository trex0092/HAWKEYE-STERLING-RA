name: Dockerfile security lint (Hadolint)

# Adapted from actions/starter-workflows/code-scanning/hadolint.yml.
# This job NEVER builds, signs, pushes or deploys the image.
on:
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/dockerfile-security-lint.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/dockerfile-security-lint.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerfile-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-dockerfile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            *.githubapp.com:443

      - name: Checkout, without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check Dockerfile best practices (blocking)
        uses: hadolint/hadolint-action@f988afea3da57ee48710a9795b6bb677cc901183 # v3.2.0 from GitHub starter workflows
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          no-fail: false
          format: tty
