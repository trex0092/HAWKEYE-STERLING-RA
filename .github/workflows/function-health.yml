name: Function Health

# Daily check that the live Netlify functions (asana-task, risk-backup,
# brain-soul) are reachable, have their secrets configured, and return 400 for a
# known-bad payload rather than 500/503 (missing secret) or a connection error
# (function not deployed). On failure it creates an alert task in Asana
# and GitHub sends the normal Actions failure email.
#
# Why 400 is the "healthy" signal:
#   Both functions validate the request body before touching Asana.
#   An empty-body POST returns 400 "name required" / "sheet with overrides
#   required" — that proves the function started, passed CORS, found the
#   token, and reached body validation. A 500/503 means the secret is gone
#   (asana-task / risk-backup -> ASANA_ACCESS_TOKEN; brain-soul -> ANTHROPIC_API_KEY);
#   anything else (502, 0) means the function crashed or is undeployed.
#
# Why 400 is NOT sufficient for the Advisor:
#   That probe proves the key EXISTS, never that it WORKS — brain-soul checks the
#   key before parsing the body, so a REVOKED or unentitled key still returns 400.
#   This workflow ran green ten days running, 2026-07-30 included, while the
#   Advisor answered nothing. So the Advisor also gets a real end-to-end call
#   asserting ok:true. Do not reduce that back to a status-code check.

on:
  schedule:
    - cron: '23 5 * * *'   # 05:23 UTC daily (just after site-health at 05:19; odd minute)
  workflow_dispatch:

# Read-only probe: checks out the repo and curls live functions. The Asana
# alert on failure uses ASANA_ACCESS_TOKEN (a secret), not GITHUB_TOKEN.
permissions:
  contents: read

# A manual dispatch must not race the scheduled run (duplicate alert tasks).
concurrency:
  group: function-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # a hung curl must not pin a runner
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            app.asana.com:443
            hawkeye-sterling-ra.netlify.app:443
            *.githubapp.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Probe asana-task function
        id: asana_task
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://hawkeye-sterling-ra.netlify.app/.netlify/functions/asana-task" \
            -H "Content-Type: application/json" -H "Origin: https://hawkeye-sterling-ra.netlify.app" \
            -d '{}')
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "asana-task → HTTP $STATUS"
          if [ "$STATUS" != "400" ]; then
            echo "FAIL: expected 400 (name required), got $STATUS — 500 = token missing, other = function down"
            exit 1
          fi
          echo "ok: asana-task is live and token is present"

      - name: Probe risk-backup function
        id: risk_backup
        # Run even if an earlier probe failed: without this the first
        # failure SKIPS every later step, so one dead function hides the
        # state of all the others and the alert reports them as
        # "not-reached". Observed live — a 400 from the Advisor meant the
        # Asana-token probe never ran at all.
        if: '!cancelled()'
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://hawkeye-sterling-ra.netlify.app/.netlify/functions/risk-backup" \
            -H "Content-Type: application/json" -H "Origin: https://hawkeye-sterling-ra.netlify.app" \
            -d '{}')
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "risk-backup → HTTP $STATUS"
          if [ "$STATUS" != "400" ]; then
            echo "FAIL: expected 400 (sheet required), got $STATUS — 500 = token missing, other = function down"
            exit 1
          fi
          echo "ok: risk-backup is live and token is present"

      - name: Probe brain-soul function
        id: brain_soul
        # Run even if an earlier probe failed: without this the first
        # failure SKIPS every later step, so one dead function hides the
        # state of all the others and the alert reports them as
        # "not-reached". Observed live — a 400 from the Advisor meant the
        # Asana-token probe never ran at all.
        if: '!cancelled()'
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://hawkeye-sterling-ra.netlify.app/.netlify/functions/brain-soul" \
            -H "Content-Type: application/json" -H "Origin: https://hawkeye-sterling-ra.netlify.app" \
            -d '{}')
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "brain-soul → HTTP $STATUS"
          if [ "$STATUS" != "400" ]; then
            echo "FAIL: expected 400 (question required), got $STATUS — 503 = ANTHROPIC_API_KEY missing, other = function down"
            exit 1
          fi
          echo "ok: brain-soul is deployed and ANTHROPIC_API_KEY is CONFIGURED (not yet proven to work)"

      # ── The probe above proves the key EXISTS. It never proved it WORKS. ──
      #
      # brain-soul checks the key's presence BEFORE it parses the body, so an
      # empty-body POST returns 400 whenever the variable is merely set. A key
      # that is present but REVOKED, EXPIRED, or without access to the routed
      # model returns 400 to this probe every day while every real user call
      # dies at the Anthropic API with 401/403/404.
      #
      # That is exactly what happened: ten consecutive green runs of this
      # workflow — including 2026-07-30 07:43 — while the Advisor answered
      # nothing and its on-device telemetry read "last call failed". The alarm
      # that exists to catch a dead Advisor could not see the way it actually
      # died, so nobody was told.
      #
      # So: make one real end-to-end call. Speed mode (haiku, 1024 tokens) keeps
      # it to a trivial daily cost, and ok:true is the only signal that proves
      # the key is live, entitled to its model, and within quota.
      - name: Prove the Advisor can actually ANSWER (end-to-end, not just configured)
        id: brain_soul_e2e
        # Run even if an earlier probe failed: without this the first
        # failure SKIPS every later step, so one dead function hides the
        # state of all the others and the alert reports them as
        # "not-reached". Observed live — a 400 from the Advisor meant the
        # Asana-token probe never ran at all.
        if: '!cancelled()'
        run: |
          BODY=$(curl -s --max-time 45 \
            -X POST "https://hawkeye-sterling-ra.netlify.app/.netlify/functions/brain-soul" \
            -H "Content-Type: application/json" -H "Origin: https://hawkeye-sterling-ra.netlify.app" \
            -d '{"question":"Reply with the single word OK.","mode":"speed"}') && rc=0 || rc=$?
          if [ "${rc:-0}" -ne 0 ]; then
            echo "answered=curl-failed" >> "$GITHUB_OUTPUT"
            echo "FAIL: could not reach brain-soul (curl rc=$rc)"
            exit 1
          fi
          # `ok` is the function's own verdict: false carries the upstream status
          # in `text` (e.g. "[API error 401 — …]"), which is safe to print because
          # the function never reflects the provider's error body.
          OK=$(printf '%s' "$BODY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);process.stdout.write(j&&j.ok===true?"true":"false")}catch{process.stdout.write("unparseable")}})')
          # Collapse newlines: a multi-line value corrupts the key=value format of
          # $GITHUB_OUTPUT and is an output-injection vector.
          DETAIL=$(printf '%s' "$BODY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let t;try{const j=JSON.parse(s);t=String((j&&(j.error||j.text))||"")}catch{t=s}process.stdout.write(t.replace(/[\r\n]+/g," ").slice(0,300))})')
          echo "answered=$OK" >> "$GITHUB_OUTPUT"
          echo "detail=$DETAIL" >> "$GITHUB_OUTPUT"
          if [ "$OK" != "true" ]; then
            echo "FAIL: the Advisor is configured but CANNOT ANSWER — $DETAIL"
            exit 1
          fi
          echo "ok: the Advisor answered end-to-end (key live, model entitled, within quota)"

      # ── Same blindness, one token over ────────────────────────────────────
      # asana-task and risk-backup check ASANA_ACCESS_TOKEN's PRESENCE before
      # body validation too, so their {} probes also return 400 whenever the
      # variable is merely set. A REVOKED Asana token passes both every day.
      #
      # A real asana-task call would CREATE a task, which a daily probe must not
      # do. asana-mirror action:"read" exercises the same token with no side
      # effect — it finds and parses the two backup tasks — and already returns a
      # DISTINCT 401 ("Asana token unauthorized — rotate ASANA_ACCESS_TOKEN") that
      # is separable from the app-gate 401 by its text. An empty register still
      # returns ok:true, so a site with no backups yet does not cry wolf.
      - name: Prove the Asana token actually WORKS (read-only, no side effect)
        id: asana_token_e2e
        # Run even if an earlier probe failed: without this the first
        # failure SKIPS every later step, so one dead function hides the
        # state of all the others and the alert reports them as
        # "not-reached". Observed live — a 400 from the Advisor meant the
        # Asana-token probe never ran at all.
        if: '!cancelled()'
        run: |
          BODY=$(curl -s --max-time 30 \
            -X POST "https://hawkeye-sterling-ra.netlify.app/.netlify/functions/asana-mirror" \
            -H "Content-Type: application/json" -H "Origin: https://hawkeye-sterling-ra.netlify.app" \
            -d '{"action":"read"}') && rc=0 || rc=$?
          if [ "${rc:-0}" -ne 0 ]; then
            echo "works=curl-failed" >> "$GITHUB_OUTPUT"
            echo "FAIL: could not reach asana-mirror (curl rc=$rc)"
            exit 1
          fi
          VERDICT=$(printf '%s' "$BODY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let o="unparseable";try{const j=JSON.parse(s);if(j&&j.ok===true)o="true";else if(/X-App-Token/i.test(String(j&&j.error||"")))o="gated";else o="false"}catch{}process.stdout.write(o)})')
          echo "works=$VERDICT" >> "$GITHUB_OUTPUT"
          # APP_SHARED_TOKEN is an operator opt-in; when it is on, an unauthenticated
          # probe cannot reach Asana at all. Skip rather than alarm — a daily false
          # alarm is its own failure mode, and the gate itself is not a fault.
          if [ "$VERDICT" = "gated" ]; then
            echo "SKIP: APP_SHARED_TOKEN is enabled, so this probe cannot exercise the Asana token"
            exit 0
          fi
          if [ "$VERDICT" != "true" ]; then
            DETAIL=$(printf '%s' "$BODY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let t;try{const j=JSON.parse(s);t=String((j&&j.error)||"")}catch{t=s}process.stdout.write(t.replace(/[\r\n]+/g," ").slice(0,300))})')
            echo "detail=$DETAIL" >> "$GITHUB_OUTPUT"
            echo "FAIL: the Asana token is configured but does NOT work — $DETAIL"
            exit 1
          fi
          echo "ok: the Asana token is live (mirror read succeeded)"

      - name: Alert in Asana on failure
        if: failure()
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASANA_STATUS: ${{ steps.asana_task.outputs.status }}
          BACKUP_STATUS: ${{ steps.risk_backup.outputs.status }}
          BRAIN_STATUS: ${{ steps.brain_soul.outputs.status }}
          BRAIN_ANSWERED: ${{ steps.brain_soul_e2e.outputs.answered }}
          BRAIN_DETAIL: ${{ steps.brain_soul_e2e.outputs.detail }}
          ASANA_TOKEN_WORKS: ${{ steps.asana_token_e2e.outputs.works }}
        run: |
          node scripts/asana-alert.mjs \
            "FUNCTION DOWN: Netlify functions failed health check" \
            "One or more Netlify functions failed the health check. asana-task: HTTP ${ASANA_STATUS:-unreachable}, risk-backup: HTTP ${BACKUP_STATUS:-unreachable}, brain-soul: HTTP ${BRAIN_STATUS:-unreachable}, Advisor answered end-to-end: ${BRAIN_ANSWERED:-not-reached}, Asana token works: ${ASANA_TOKEN_WORKS:-not-reached}. ${BRAIN_DETAIL:+Advisor detail: ${BRAIN_DETAIL}. }HTTP 500/503 = a required secret (ASANA_ACCESS_TOKEN / ANTHROPIC_API_KEY) is missing. Anything else = function crashed or undeployed. NOTE: 'answered: false' with brain-soul HTTP 400 means the key is CONFIGURED BUT NOT WORKING. READ THE DETAIL BEFORE ACTING — the two causes need OPPOSITE fixes: a usage/credit limit is a BILLING cap (raise it in the Anthropic Console → Billing → Limits, or wait for the stated reset; do NOT rotate a working key), whereas revoked/expired/unentitled means rotate ANTHROPIC_API_KEY in Netlify Site configuration → Environment variables and redeploy. Check Netlify deploys: https://app.netlify.com/projects/hawkeye-sterling-ra — Run log: $RUN_URL"
