name: Function Health

# Weekly check that the live Netlify functions (asana-task, risk-backup,
# brain-soul) are reachable, have their secrets configured, and return 400 for a
# known-bad payload rather than 500/503 (missing secret) or a connection error
# (function not deployed). On failure it creates an alert task in Asana
# and GitHub sends the normal Actions failure email.
#
# Why 400 is the "healthy" signal:
#   Both functions validate the request body before touching Asana.
#   An empty-body POST returns 400 "name required" / "sheet with overrides
#   required" — that proves the function started, passed CORS, found the
#   token, and reached body validation. A 500/503 means the secret is gone
#   (asana-task / risk-backup -> ASANA_ACCESS_TOKEN; brain-soul -> ANTHROPIC_API_KEY);
#   anything else (502, 0) means the function crashed or is undeployed.

on:
  schedule:
    - cron: '15 5 * * *'   # 05:15 UTC daily (just after site-health)
  workflow_dispatch:

# Read-only probe: checks out the repo and curls live functions. The Asana
# alert on failure uses ASANA_ACCESS_TOKEN (a secret), not GITHUB_TOKEN.
permissions:
  contents: read

# A manual dispatch must not race the scheduled run (duplicate alert tasks).
concurrency:
  group: function-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # a hung curl must not pin a runner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Probe asana-task function
        id: asana_task
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://hawkeye-sterling-ra.netlify.app/.netlify/functions/asana-task" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "asana-task → HTTP $STATUS"
          if [ "$STATUS" != "400" ]; then
            echo "FAIL: expected 400 (name required), got $STATUS — 500 = token missing, other = function down"
            exit 1
          fi
          echo "ok: asana-task is live and token is present"

      - name: Probe risk-backup function
        id: risk_backup
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://hawkeye-sterling-ra.netlify.app/.netlify/functions/risk-backup" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "risk-backup → HTTP $STATUS"
          if [ "$STATUS" != "400" ]; then
            echo "FAIL: expected 400 (sheet required), got $STATUS — 500 = token missing, other = function down"
            exit 1
          fi
          echo "ok: risk-backup is live and token is present"

      - name: Probe brain-soul function
        id: brain_soul
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://hawkeye-sterling-ra.netlify.app/.netlify/functions/brain-soul" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "brain-soul → HTTP $STATUS"
          if [ "$STATUS" != "400" ]; then
            echo "FAIL: expected 400 (question required), got $STATUS — 503 = ANTHROPIC_API_KEY missing, other = function down"
            exit 1
          fi
          echo "ok: brain-soul is live and ANTHROPIC_API_KEY is present"

      - name: Alert in Asana on failure
        if: failure()
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ASANA_STATUS: ${{ steps.asana_task.outputs.status }}
          BACKUP_STATUS: ${{ steps.risk_backup.outputs.status }}
          BRAIN_STATUS: ${{ steps.brain_soul.outputs.status }}
        run: |
          node scripts/asana-alert.mjs \
            "FUNCTION DOWN: Netlify functions failed health check" \
            "One or more Netlify functions returned an unexpected status. asana-task: HTTP ${ASANA_STATUS:-unreachable}, risk-backup: HTTP ${BACKUP_STATUS:-unreachable}, brain-soul: HTTP ${BRAIN_STATUS:-unreachable}. HTTP 500/503 = a required secret (ASANA_ACCESS_TOKEN / ANTHROPIC_API_KEY) is missing or revoked. Anything else = function crashed or undeployed. Check Netlify deploys: https://app.netlify.com/projects/hawkeye-sterling-ra — Run log: $RUN_URL"
