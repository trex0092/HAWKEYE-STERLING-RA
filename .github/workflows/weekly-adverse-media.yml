# ============================================================
# FINE GOLD LLC — WEEKLY ADVERSE MEDIA SCREENING
# GitHub Actions Workflow — Hawkeye Sterling V2
# ============================================================
# Runs every Monday at 07:00 UAE (03:00 UTC)
# Screens ALL 324 customers via Google News RSS
# Posts results as separate Asana task in Ongoing Monitoring
# ============================================================

name: Weekly Adverse Media Screening

on:
  schedule:
    - cron: '0 3 * * 1'    # 07:00 UAE (UTC+4) every Monday
  workflow_dispatch:        # Manual trigger

jobs:
  adverse-media:
    runs-on: ubuntu-latest
    timeout-minutes: 180    # 324 customers × 3 locales — full-coverage sweep needs headroom

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install rapidfuzz requests pdfplumber

      - name: Run weekly adverse media sweep
        env:
          ASANA_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN || secrets.ASANA_TOKEN }}
          TRIGGER_TYPE: schedule
          RUN_MODE: weekly_adverse
        run: python screen.py
