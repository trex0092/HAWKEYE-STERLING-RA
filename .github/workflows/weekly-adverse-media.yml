# ============================================================
# HAWKEYE STERLING — DAILY ADVERSE MEDIA SCREENING
# GitHub Actions Workflow — Hawkeye Sterling V2
# ============================================================
# Runs daily at 04:00 UAE (00:00 UTC) so the DEEPER ~4-4.5h sweep (5 locales
# US/GB/AE/TR/AR + a targeted risk-term query) still lands in Asana before
# ~09:00 UAE. Screens ALL companies AND their associated individuals
# (shareholders / UBOs / directors) via Google News RSS.
# Posts one audit-grade summary task in Ongoing Monitoring.
# ============================================================

name: Daily Screening (Sanctions + Adverse Media + PEP)

on:
  schedule:
    - cron: '7 0 * * *'    # 00:07 UTC = 04:07 UAE, daily (odd minute) — early start lets the DEEPER ~4-4.5h sweep (5 locales + targeted query) still deliver by ~08:30 UAE, same UTC day (keeps freshness-check valid)
    - cron: '7 3 * * *'    # 03:07 UTC self-healing retry — the 24 & 25 Jul 00:07 runs died to runner-VM shutdowns mid-sweep and stayed red until someone manually re-ran hours later. This firing is a NO-OP (preflight skips the sweep) whenever today already has a successful run; it only screens when the mandatory daily control would otherwise be missing, and still delivers by ~08:30 UAE.
  workflow_dispatch:        # Manual trigger

# Results are posted to Asana via the screen's own token. contents:write is used
# only to commit the delta-state file (what has already been reported) so the
# next run flags just what is NEW.
permissions:
  contents: read

# A multi-hour sweep must never have a manual run overlap the daily schedule.
# Single-writer group SHARED with onboarding-screen.yml: both workflows
# force-push the screen-delta-state branch (rebuilt as <main> + one data
# commit), so two concurrent runs could drop each other's just-persisted
# run-metrics/delta files — the exact inputs anomaly-watch reads. Concurrency
# groups are repo-wide across workflows; sharing one serialises the writers.
concurrency:
  group: screen-state
  cancel-in-progress: false

jobs:
  # Self-healing gate: the retry firing (03:07 UTC) must not double-screen or
  # double-post to Asana on days when the 00:07 run succeeded. On schedule
  # events this asks the Actions API whether today (UTC) already has a
  # successful run of this workflow and skips the sweep if so; manual
  # dispatches always screen. Skipped-job days still conclude "success", so
  # the badge and freshness-check semantics are unchanged.
  preflight:
    permissions:
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
      - name: Skip if today's screening already succeeded
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -u
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch — always screens"
            exit 0
          fi
          today="$(date -u +%Y-%m-%d)"
          n=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/weekly-adverse-media.yml/runs?status=success&created=%3E%3D${today}&per_page=1" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("total_count", 0))')
          if [ "${n:-0}" -gt 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "today (UTC $today) already has $n successful screening run(s) — retry firing is a no-op"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "no successful screening run yet today (UTC $today) — proceeding with the sweep"
          fi

  adverse-media:
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    # Write scopes live at job level (top level is read-only — least privilege).
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 350    # companies + ~2x individuals × 3 locales — daily full-coverage sweep needs headroom (GitHub job cap is 360)

    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          # This job holds contents:write and fetches external content while handling
          # customer data — block egress to a fixed allowlist so it cannot exfiltrate.
          # Hosts = the sanctions sources + Google-News RSS + Wikidata (PEP) that
          # screen.py contacts, Asana, Anthropic (LLM triage, when enabled), and the
          # GitHub/PyPI infra for checkout + pip. A missed host fails LOUD (the
          # empty-list guard reds the job; adverse/PEP degrade, never a silent clear).
          # OFAC and UN serve their files via 302 to presigned storage URLs, so their
          # storage backends (S3 / Azure blob) are allowlisted next to the primaries —
          # without them both core lists are refused at connect time and screening
          # silently runs DEGRADED (as it did 09–12 Jul).
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            app.asana.com:443
            api.anthropic.com:443
            sanctionslistservice.ofac.treas.gov:443
            wc2h-sls-prod-public-published.s3.us-gov-west-1.amazonaws.com:443
            scsanctions.un.org:443
            unsolprodfiles.blob.core.windows.net:443
            umsanrp1dltx4dj3sxtt.blob.core.windows.net:443
            umsaszjsdz5c04wqdhbq.blob.core.windows.net:443
            ofsistorage.blob.core.windows.net:443
            webgate.ec.europa.eu:443
            data.opensanctions.org:443
            www.international.gc.ca:443
            news.google.com:443
            www.bing.com:443
            api.gdeltproject.org:443
            www.wikidata.org:443
            query.wikidata.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No credentials on disk (zizmor artipacked): the state push below
          # authenticates with an ephemeral env token, and the overlay fetch
          # is anonymous (public repo).
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet --require-hashes -r ci/requirements.txt

      - name: Overlay latest delta-state (lives on the screen-delta-state branch)
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          # Branch protection blocks direct pushes to main (GH006 — the old
          # main-push below failed silently since 7 Jul), so the delta-state
          # lives on a dedicated data branch. Without the overlay every run
          # re-reports findings already delivered. With STATE_ENCRYPTION_KEY
          # set the branch carries <file>.enc instead of subject-data
          # plaintext (P30): decrypt restores the working files; an .enc with
          # no key fails loudly rather than running with amnesia.
          if git fetch origin screen-delta-state --depth=1 2>/dev/null; then
            for f in data/screen-delta-state.json data/adverse-media-evidence.json data/run-metrics.json data/source-coverage-state.json; do
              git checkout FETCH_HEAD -- "$f" 2>/dev/null || true
              git checkout FETCH_HEAD -- "$f.enc" 2>/dev/null || true
            done
            node scripts/state-crypto.mjs decrypt data/screen-delta-state.json data/adverse-media-evidence.json data/run-metrics.json data/source-coverage-state.json
            echo "delta-state overlaid from screen-delta-state"
          else
            echo "no screen-delta-state branch yet — using state from main"
          fi

      - name: Run unified daily screening (sanctions + adverse media + PEP)
        env:
          ASANA_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN || secrets.ASANA_TOKEN }}
          TRIGGER_TYPE: schedule
          RUN_MODE: unified   # ONE report: sanctions (all candidates) + adverse media (with links) + PEP
          # Weaponised WORLDWIDE adverse-media sweep. Two layers, always on:
          #   1. GDELT global index — ONE request/subject, 65+ languages, worldwide
          #      print/broadcast/web (the real "all news around the world" net), now
          #      with a 26-term predicate cluster + 75 records.
          #   2. Google News across the worldwide locale matrix, scored against the
          #      36-language red-flag dictionaries.
          # ADVERSE_LOCALES caps how many of the 74 Google-News locales are swept per
          # subject. The defaults are the EMPIRICAL per-IP ceiling for Google News
          # from a GitHub runner: at 14 locales × 16 workers (10–12 Jul) the limiter
          # tripped and 805/838 subjects got ZERO adverse-media coverage (raised as
          # am_errors and a sustained anomaly); at 5 × 8 the full book swept clean.
          # GDELT keeps worldwide coverage regardless. Raising the repo vars for a
          # manual deep sweep risks re-tripping the limiter — the engine now
          # early-exits throttled subjects and degrades LOUDLY, but the recall loss
          # is real, so raise them only for supervised off-schedule runs.
          ADVERSE_LOCALES: ${{ vars.ADVERSE_LOCALES || '8' }}
          SCREEN_CONCURRENCY: ${{ vars.SCREEN_CONCURRENCY || '8' }}
          # Deliver EVERY new finding (sanctions + adverse media + PEP) to Asana as
          # its own assigned MLRO case subtask, not just the first 40. The full
          # findings list is always in the daily task body regardless of this cap.
          CASE_SUBTASK_CAP: ${{ vars.CASE_SUBTASK_CAP || '200' }}
          # AI layer: key enables GROUNDED triage only (classifies real headlines, cannot invent
          # facts). Generative report prose stays OFF unless REPORT_ALLOW_LLM=1 is also set.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # PDPL GATE: triage sends a subject name + headline to Anthropic (a cross-border
          # transfer). It is held OFF until the Anthropic DPA is executed and the transfer
          # basis recorded (see third-party-register.md / pdpl-data-processing-assessment.md).
          # Re-enable WITHOUT a code change by setting the repo variable LLM_TRIAGE=1 once the
          # DPA is signed. Default '0' = no customer-data egress.
          LLM_TRIAGE: ${{ vars.LLM_TRIAGE || '0' }}
          AI_MODEL: ${{ vars.AI_MODEL || 'claude-haiku-4-5-20251001' }}
        run: python screen.py

      - name: Commit delta-state (what has already been reported)
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          # Stage only the state files that exist: a degraded/early-exit run
          # doesn't write the optional ones, and a hard `git add` of a missing
          # path fatals (exit 128) instead of persisting the rest. With
          # STATE_ENCRYPTION_KEY set, the commit carries only <file>.enc: the
          # plaintext working files are restored to their main-branch content
          # so CURRENT subject data never lands on the public branch (P30,
          # encrypt-forward).
          state_files=()
          for f in data/screen-delta-state.json data/adverse-media-evidence.json data/run-metrics.json data/source-coverage-state.json; do
            [ -f "$f" ] && state_files+=("$f")
          done
          if [ "${#state_files[@]}" -gt 0 ] && [ -n "$(git status --porcelain -- "${state_files[@]}")" ]; then
            git config user.name "daily-screening"
            git config user.email "actions@github.com"
            if [ -n "$STATE_ENCRYPTION_KEY" ]; then
              node scripts/state-crypto.mjs encrypt "${state_files[@]}"
              for f in "${state_files[@]}"; do
                [ -f "$f.enc" ] && git add "$f.enc"
                git checkout HEAD -- "$f" 2>/dev/null || true
              done
            else
              echo "::warning::delta-state persisted in PLAINTEXT (subject data) - set the STATE_ENCRYPTION_KEY secret to encrypt state commits (P30)"
              git add -- "${state_files[@]}"
            fi
            git commit -m "chore(screen): update delta-state [skip ci]"
            # Persist on the screen-delta-state branch (main is protected):
            # rebuilt as <current main> + one data commit, force-updated.
            # Auth is the ephemeral env token in the push URL — the checkout
            # persists no credentials, so nothing lands in .git/config.
            pushed=
            for attempt in 1 2 3 4 5; do
              git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/screen-delta-state && { pushed=1; break; }
              echo "push failed (attempt $attempt) — retrying"
              sleep $((attempt * 3))
            done
            [ -n "$pushed" ] || { echo "::error::state push to screen-delta-state failed after 5 attempts — state NOT persisted"; exit 1; }
          else
            echo "delta-state unchanged"
          fi
