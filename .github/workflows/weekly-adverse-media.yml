# ============================================================
# FINE GOLD LLC — DAILY ADVERSE MEDIA SCREENING
# GitHub Actions Workflow — Hawkeye Sterling V2
# ============================================================
# Runs daily at 06:00 UAE (02:00 UTC) so the audit report lands in
# Asana by ~09:00 UAE. Screens ALL companies AND their associated
# individuals (shareholders / UBOs / directors) via Google News RSS.
# Posts one audit-grade summary task in Ongoing Monitoring.
# ============================================================

name: Daily Adverse Media Screening

on:
  schedule:
    - cron: '0 2 * * *'    # 02:00 UTC = 06:00 UAE, daily — report delivered by ~09:00 UAE
  workflow_dispatch:        # Manual trigger

# Read-only checkout; results are posted to Asana via the screen's own token.
permissions:
  contents: read

# A multi-hour sweep must never have a manual run overlap the daily schedule.
concurrency:
  group: daily-adverse-media
  cancel-in-progress: false

jobs:
  adverse-media:
    runs-on: ubuntu-latest
    timeout-minutes: 350    # companies + ~2x individuals × 3 locales — daily full-coverage sweep needs headroom (GitHub job cap is 360)

    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install rapidfuzz requests pdfplumber

      - name: Run daily adverse media sweep (companies + individuals)
        env:
          ASANA_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN || secrets.ASANA_TOKEN }}
          TRIGGER_TYPE: schedule
          RUN_MODE: weekly_adverse   # internal mode switch (unchanged); cadence is now daily
        run: python screen.py
