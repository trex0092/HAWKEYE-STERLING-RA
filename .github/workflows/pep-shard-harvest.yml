name: PEP Shard Harvest

# Finishes the PEP label backlog FAST by running it on many runners at once.
#
# Why this exists: Wikidata rate-limits a client. A completed link's log carries
# 64 HTTP 429s with backoff, so widening the request window inside ONE job
# fights the limiter and has a ceiling. Each shard here runs on its own runner —
# a separate client with its own rate budget — so N shards buy close to N times
# the throughput, which more parallelism in a single job cannot.
#
# This is ADDITIVE. pep-worldwide.yml keeps its weekly schedule and its
# self-resuming chain untouched; if a sharded run goes wrong, the ordinary
# chain is still grinding away and nothing is lost. Manual dispatch remains
# available. A protected-main push that changes THIS workflow also launches one
# shard run, which makes reviewed harvester changes self-validating and gives us
# a safe way to clear an existing checkpoint backlog without a separate API
# dispatcher. Ordinary source-code pushes do not match the path filter.
#
# Shards never share a ref: each force-pushes ONLY its own pep-shard-<i> branch,
# so concurrent writes cannot race or drop each other's work, and the single
# merge job is the only writer of pep-worldwide-state. Plain git throughout —
# no artifact upload/download action to pin or to open egress for.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pep-shard-harvest.yml'
      - 'scripts/pep-worldwide.mjs'

permissions:
  contents: read

concurrency:
  group: pep-shard-harvest
  cancel-in-progress: false

jobs:
  plan:
    # Is there a banked label backlog to shard? Shards split the checkpoint on
    # pep-worldwide-state; they never sweep the graph from scratch. Once a
    # harvest completes, the checkpoint is spent and dropped, so a push that
    # merely edits this workflow or the harvester (the self-validation trigger
    # above) finds nothing to do. That is a clean no-op, not an outage: every
    # shard used to fail red on "no checkpoint" in that state. Anything else
    # without a checkpoint (no state branch, or no COMPLETE artifact) still
    # fails loudly here.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backlog: ${{ steps.plan.outputs.backlog }}
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            *.githubapp.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Decide whether a checkpoint backlog exists
        id: plan
        run: |
          if ! git fetch origin pep-worldwide-state --depth=1 2>/dev/null; then
            echo "::error::could not read pep-worldwide-state — run the ordinary PEP Worldwide Harvest first"
            exit 1
          fi
          if git cat-file -e FETCH_HEAD:data/pep-worldwide-checkpoint.json 2>/dev/null; then
            echo "backlog=1" >> "$GITHUB_OUTPUT"
            echo "checkpoint banked on pep-worldwide-state — sharding the label backlog"
            exit 0
          fi
          if git show FETCH_HEAD:data/pep-worldwide.json > "$RUNNER_TEMP/pep-worldwide.json" 2>/dev/null \
             && node -e '
               const fs = require("fs"), zlib = require("zlib");
               const b = fs.readFileSync(process.argv[1]);
               const d = JSON.parse((b[0] === 0x1f && b[1] === 0x8b) ? zlib.gunzipSync(b).toString("utf8") : b.toString("utf8"));
               process.exit(d && d.count > 0 && !d.partial ? 0 : 1);
             ' "$RUNNER_TEMP/pep-worldwide.json"; then
            echo "backlog=0" >> "$GITHUB_OUTPUT"
            echo "::notice::no checkpoint and the published PEP artifact is complete — no label backlog to shard"
            exit 0
          fi
          echo "::error::no checkpoint on pep-worldwide-state and no complete artifact — run the ordinary PEP Worldwide Harvest first so the holders phase is banked, then shard the label backlog"
          exit 1

  shard:
    needs: plan
    if: needs.plan.outputs.backlog == '1'
    strategy:
      # One failed shard must not cancel the rest — the merge step refuses to
      # publish an incomplete set anyway, and the survivors' slices stay on
      # their branches ready for a re-run of just the failures.
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3, 4, 5, 6, 7]
    # Writes ONLY refs/heads/pep-shard-<index>, never the shared state branch.
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          # GitHub + node toolchain + the two Wikimedia hosts, plus the
          # hosted-compute watchdog: a runner that cannot answer it gets
          # reclaimed mid-run, which is what killed three earlier harvests.
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            query.wikidata.org:443
            www.wikidata.org:443
            *.githubapp.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Overlay the harvest checkpoint (the shard's read-only input)
        run: |
          # Every shard reads the SAME committed checkpoint: holder rows,
          # positions and the full person list. Nothing is written back here.
          if git fetch origin pep-worldwide-state --depth=1 2>/dev/null; then
            git checkout FETCH_HEAD -- data/pep-worldwide-checkpoint.json 2>/dev/null || true
          fi
          if [ ! -e data/pep-worldwide-checkpoint.json ]; then
            echo "::error::no checkpoint on pep-worldwide-state — run the ordinary PEP Worldwide Harvest first so the holders phase is banked, then shard the label backlog"
            exit 1
          fi
          # The script derives the checkpoint name from the OUTFILE, so a shard
          # writing data/pep-shard.json looks for data/pep-shard-checkpoint.json
          # and would otherwise find nothing — silently restarting the whole
          # harvest (positions + holders + every person's labels) instead of
          # resuming, which overruns the budget and publishes nothing at all.
          cp data/pep-worldwide-checkpoint.json data/pep-shard-checkpoint.json
          echo "checkpoint staged under the name this shard's outfile derives"

      - name: Harvest this shard's slice
        env:
          PEP_SHARD_COUNT: '8'
          PEP_SHARD_INDEX: ${{ matrix.index }}
          # Stamped into the slice so the merge can reject a branch left behind
          # by an earlier run instead of merging its half-finished names.
          PEP_SHARD_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
          PEP_RECENCY_MONTHS: ${{ vars.PEP_RECENCY_MONTHS }}
          PEP_LABEL_CONCURRENCY: ${{ vars.PEP_LABEL_CONCURRENCY }}
          # Sharding is the recovery path after the ordinary serial chain reaches
          # its bounded resume cap. The shared checkpoint can therefore already
          # carry resumeCount >= PEP_MAX_RESUMES. Give this one-shot sharded
          # recovery enough headroom to consume that checkpoint instead of
          # immediately refusing it for the same reason the serial chain stopped.
          PEP_MAX_RESUMES: '1000000'
          # Sized to finish inside the job timeout; the budget is a backstop, not
          # the normal path, because a shard hands nothing to the merge until it
          # completes its slice.
          PEP_TIME_BUDGET_MIN: '145'
        run: |
          # Exit 75 is a PLANNED pause in the ordinary chain, which resumes from
          # the checkpoint it just wrote. A shard has no next link: it publishes
          # its slice only on completion, so a pause means this shard produced
          # nothing usable. Fail with that sentence rather than an opaque 75.
          code=0
          node scripts/pep-worldwide.mjs harvest data/pep-shard.json || code=$?
          if [ "$code" -eq 75 ]; then
            echo "::error::shard ${{ matrix.index }} ran out of time budget before finishing its slice — it publishes nothing and the merge will refuse; raise PEP_TIME_BUDGET_MIN/timeout-minutes or split into more shards"
            exit 1
          fi
          exit "$code"

      - name: Publish this shard's slice (pep-shard-<index> branch)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.index }}
        run: |
          git config user.name "pep-worldwide"
          git config user.email "actions@github.com"
          # Commit the slice and NOTHING else. The overlay step's
          # `git checkout FETCH_HEAD -- <checkpoint>` also STAGES the shared
          # checkpoint, so `git add -- <slice>` alone still committed it: every
          # pep-shard-<i> branch carried a 22MB spent checkpoint, and merging one
          # into main put it on every harvest checkout, where it refused to
          # resume past the cap. Unstage everything, add the slice, verify.
          git reset -q
          git add -A -- data/pep-shard.json
          staged="$(git diff --cached --name-only)"
          if [ "$staged" != "data/pep-shard.json" ]; then
            echo "::error::shard ${SHARD} commit would carry more than its slice: ${staged}"
            exit 1
          fi
          git commit -m "PEP shard ${SHARD} $(date -u +%F) [skip ci]"
          pushed=
          for attempt in 1 2 3 4 5; do
            git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/pep-shard-${SHARD}" && { pushed=1; break; }
            echo "push failed (attempt $attempt) — retrying"
            sleep $((attempt * 5))
          done
          [ -n "$pushed" ] || { echo "::error::shard ${SHARD} push failed after 5 attempts — its slice is NOT available to the merge"; exit 1; }

  merge:
    needs: shard
    # The ONLY writer of pep-worldwide-state in this workflow — one job, one
    # push, no race.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          # www.wikidata.org is here for ONE reason: the merge resolves any
          # country still held as a bare QID into a name. That used to sit at
          # the tail of the office pass, behind ~1,000 serial WDQS queries that
          # can pause at the time budget — and did, twice — leaving offices
          # labelled "Q159" instead of "Russia". It is a few chunks of work, so
          # it belongs where the artifact is assembled.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            www.wikidata.org:443
            *.githubapp.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Collect the checkpoint and every shard slice
        run: |
          set -euo pipefail
          git fetch origin pep-worldwide-state --depth=1
          git checkout FETCH_HEAD -- data/pep-worldwide-checkpoint.json
          git checkout FETCH_HEAD -- data/pep-worldwide.json 2>/dev/null || true
          mkdir -p shards
          for i in 0 1 2 3 4 5 6 7; do
            # A missing shard branch is fatal HERE rather than silently merged
            # around: the merge step would otherwise publish a list short of
            # those people, and a PEP absent from the list screens CLEAN.
            git fetch origin "pep-shard-${i}" --depth=1
            git show FETCH_HEAD:data/pep-shard.json > "shards/pep-shard-${i}.json"
            echo "collected shard ${i} ($(stat -c%s "shards/pep-shard-${i}.json") bytes)"
          done

      - name: Merge the shards into the artifact
        run: |
          node scripts/pep-worldwide.mjs merge-shards \
            data/pep-worldwide.json data/pep-worldwide-checkpoint.json \
            shards/pep-shard-0.json shards/pep-shard-1.json shards/pep-shard-2.json \
            shards/pep-shard-3.json shards/pep-shard-4.json shards/pep-shard-5.json \
            shards/pep-shard-6.json shards/pep-shard-7.json

      - name: Persist the merged artifact (pep-worldwide-state branch)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain -- data/pep-worldwide.json data/pep-worldwide-checkpoint.json)" ]; then
            git config user.name "pep-worldwide"
            git config user.email "actions@github.com"
            # Build the state commit as <previous state tip's tree> + this run's
            # data files, parented on that tip. NEVER as <this run's checkout of
            # main> + data files: main's .github/workflows drifts from the tip's,
            # so a force-push of that tree carries a workflow-file change and
            # GitHub refuses it for the Actions token ("refusing to allow a
            # GitHub App to create or update workflow ... without `workflows`
            # permission"), which lost the whole harvest. Only data/ files may
            # differ from the tip. Every reader takes single files off this
            # branch (`git checkout FETCH_HEAD -- data/...`), never its tree.
            GIT_INDEX_FILE="$(mktemp -u)"
            export GIT_INDEX_FILE
            parent_args=()
            rc=0
            git ls-remote --exit-code --heads origin pep-worldwide-state >/dev/null 2>&1 || rc=$?
            if [ "$rc" -eq 0 ]; then
              git fetch origin pep-worldwide-state --depth=1
              tip="$(git rev-parse FETCH_HEAD)"
              git read-tree "$tip"
              parent_args=(-p "$tip")
            elif [ "$rc" -eq 2 ]; then
              # branch genuinely absent: first harvest, data-only root commit
              git read-tree --empty
            else
              echo "::error::could not read pep-worldwide-state (ls-remote rc=$rc) - refusing to rebuild the branch blind"
              exit 1
            fi
            for f in data/pep-worldwide.json data/pep-worldwide-checkpoint.json; do
              if [ -e "$f" ]; then
                git update-index --add --cacheinfo "100644,$(git hash-object -w "$f"),$f"
              else
                git update-index --force-remove "$f"
              fi
            done
            tree="$(git write-tree)"
            commit="$(git commit-tree "$tree" "${parent_args[@]}" -m "PEP worldwide harvest (sharded) $(date -u +%F) [skip ci]")"
            unset GIT_INDEX_FILE
            pushed=
            for attempt in 1 2 3 4 5; do
              git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$commit":refs/heads/pep-worldwide-state && { pushed=1; break; }
              echo "push failed (attempt $attempt) — retrying"
              sleep $((attempt * 5))
            done
            [ -n "$pushed" ] || { echo "::error::state push failed after 5 attempts — merged artifact NOT persisted"; exit 1; }
            echo "merged artifact persisted to pep-worldwide-state"
          else
            echo "nothing changed — nothing to push"
          fi

      - name: Merge summary
        run: |
          node -e '
            const fs = require("fs"), zlib = require("zlib");
            const b = fs.readFileSync("data/pep-worldwide.json");
            const d = JSON.parse((b[0] === 0x1f && b[1] === 0x8b) ? zlib.gunzipSync(b).toString("utf8") : b.toString("utf8"));
            const L = ["# PEP worldwide harvest — sharded merge", "",
              "Persons: **" + d.count + "**" + (d.partial ? " of " + d.expected + " — PARTIAL" : " — complete"), "",
              "| class | persons |", "| --- | --- |",
              ...Object.entries(d.classes).map(([k, v]) => "| " + k + " | " + v + " |")];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, L.join("\n") + "\n");
          '

      # The runtime-evidence refresh after a successful merge is dispatched by
      # pep-chain-watchdog.yml (refresh-after-sharded-completion), which holds
      # actions: write. It used to ALSO be a step here, but this job holds only
      # contents: write, so that dispatch could not succeed: it turned a
      # successful merge red, and a red run suppressed the watchdog's refresh
      # too. A complete artifact sat on the state branch while runtime
      # assurance kept reporting PEP as partial.
