name: Workflow lint (actionlint + zizmor)

# Lints the GitHub Actions workflows themselves:
#   - actionlint  : YAML / shell / expression errors (blocking), including the
#                   embedded shellcheck pass. The run: blocks are clean, so no
#                   shellcheck rules are suppressed — keep them clean.
#   - zizmor      : CI/CD security audit (dangerous triggers, template injection,
#                   over-broad permissions, unpinned actions). BLOCKING with a
#                   ZERO baseline — there is no .github/zizmor.yml; the only
#                   accepted finding is the documented inline
#                   `zizmor: ignore[dangerous-triggers]` in labeler.yml, so any
#                   other finding fails the gate.
on:
  pull_request:
    paths: ['.github/workflows/**']
  push:
    paths: ['.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  actions-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (egress block)
        # Allowlist observed from the 2026-07-14 run's egress audit: GitHub
        # (checkout + zizmor's advisory queries), the Go module proxy pair for
        # `go install actionlint` (storage.googleapis.com is the module CDN
        # behind the proxy), and PyPI for the hash-locked zizmor install.
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            pypi.org:443
            files.pythonhosted.org:443
            *.githubapp.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          # Version-pinned; integrity is verified by the Go module checksum DB (sum.golang.org).
          # The 26 Oct PR #1051 runner refused its first connection to the
          # already-allowlisted proxy.golang.org even after checkout recovered.
          # Retry only the transport-dependent INSTALL; never retry or suppress
          # a real actionlint YAML/expression/security finding.
          installed=false
          for attempt in 1 2 3; do
            if go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12; then
              installed=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::actionlint Go module download failed; bounded retry $attempt of 3"
              sleep "$((attempt * 10))"
            fi
          done
          # The default GOPROXY does not fall back to VCS on connection refusal
          # (only on 404/410). Try one direct fetch of the same pinned version
          # if all official-proxy attempts were refused. Keep the public
          # checksum database enabled and REQUIRED; never bypass verification.
          if [ "$installed" != true ]; then
            echo "::warning::Go module proxy unavailable; trying one version-pinned direct GitHub fetch with the public checksum database still enforced."
            if GOPROXY=direct GOSUMDB=sum.golang.org go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12; then
              installed=true
            fi
          fi
          # A version-pinned, SHA-256-verified release archive is the final
          # bounded path when both Go module services refuse connections.
          # The expected digest comes from the upstream GitHub release metadata.
          # Never extract or run a downloaded archive until it matches.
          if [ "$installed" != true ]; then
            echo "::warning::Go module services unavailable; trying a checksum-pinned official actionlint release."
            tmp_dir=$(mktemp -d)
            trap 'rm -rf "$tmp_dir"' EXIT
            archive="$tmp_dir/actionlint_1.7.12_linux_amd64.tar.gz"
            if curl --fail --location --silent --show-error --connect-timeout 10 --max-time 60 --retry 1 \
              -o "$archive" \
              "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"; then
              if ! printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check --status; then
                echo "::error::Official actionlint release SHA-256 mismatch; refusing execution."
                exit 1
              fi
              if tar -xzf "$archive" -C "$tmp_dir" actionlint; then
                mkdir -p "$(go env GOPATH)/bin"
                install -m 0755 "$tmp_dir/actionlint" "$(go env GOPATH)/bin/actionlint"
                installed=true
              fi
            fi
          fi
          if [ "$installed" != true ]; then
            echo "::error::actionlint could not be installed via verified Go module or pinned release paths; workflow lint did NOT run."
            exit 1
          fi
          "$(go env GOPATH)/bin/actionlint" -color

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: zizmor (blocking)
        env:
          # zizmor's known-vulnerable-actions audit queries the GitHub advisory API.
          GH_TOKEN: ${{ github.token }}
        run: |
          # Exact version + hashes (ci/zizmor-requirements.txt) — the workflow
          # SAST gate is itself supply-chain pinned.
          python -m pip install --quiet --require-hashes -r ci/zizmor-requirements.txt
          zizmor .github/workflows/
