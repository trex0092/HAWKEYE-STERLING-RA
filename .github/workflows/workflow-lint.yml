name: Workflow lint (actionlint + zizmor)

# Lints the GitHub Actions workflows themselves:
#   - actionlint  : YAML / shell / expression errors (blocking), including the
#                   embedded shellcheck pass. The run: blocks are clean, so no
#                   shellcheck rules are suppressed — keep them clean.
#   - zizmor      : CI/CD security audit (dangerous triggers, template injection,
#                   over-broad permissions, unpinned actions). Advisory for now
#                   (continue-on-error) so it surfaces findings as annotations
#                   without blocking; promote to blocking once the baseline is clean.
on:
  pull_request:
    paths: ['.github/workflows/**']
  push:
    paths: ['.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  actions-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          disable-sudo: true
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: zizmor (advisory)
        continue-on-error: true
        run: |
          python -m pip install --quiet "zizmor>=1"
          zizmor .github/workflows/
