name: Workflow lint (actionlint + zizmor)

# Lints the GitHub Actions workflows themselves:
#   - actionlint  : YAML / shell / expression errors (blocking). SHELLCHECK_OPTS
#                   excludes pre-existing style/info nits (SC2086/2129/2015) so it
#                   enforces real errors without churning the existing run: blocks.
#   - zizmor      : CI/CD security audit (dangerous triggers, template injection,
#                   over-broad permissions, unpinned actions). Advisory for now
#                   (continue-on-error) so it surfaces findings as annotations
#                   without blocking; promote to blocking once the baseline is clean.
on:
  pull_request:
    paths: ['.github/workflows/**']
  push:
    paths: ['.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  actions-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          disable-sudo: true
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: actionlint
        env:
          # Pre-existing style/info shellcheck nits in run: blocks — keep actionlint
          # enforcing real errors without rewriting working compliance scripts.
          SHELLCHECK_OPTS: "-e SC2086 -e SC2129 -e SC2015"
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: zizmor (advisory)
        continue-on-error: true
        run: |
          python -m pip install --quiet "zizmor>=1"
          zizmor .github/workflows/
