name: GitHub CLI readiness

# GitHub-hosted Ubuntu images ship GitHub CLI. Verify the actual runner
# executable and its GitHub API access instead of installing an unpinned
# Windows-only winget package into a Linux job or storing a binary in Git.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/github-cli-readiness.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/github-cli-readiness.yml'

permissions:
  contents: read

concurrency:
  group: github-cli-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner (GitHub API only)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            *.githubapp.com:443

      - name: Require preinstalled GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo '::error::GitHub CLI is missing from the runner image; it must be provisioned and verified before use.'
            exit 1
          fi
          gh --version

      - name: Verify read-only repository API access through gh
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -euo pipefail
          actual="$(gh api "repos/${GH_REPO}" --jq '.full_name')"
          if [[ "$actual" != "$GH_REPO" ]]; then
            echo '::error::GitHub CLI cannot verify access to this repository.'
            exit 1
          fi
          echo 'GitHub CLI is available and authenticated for read-only repository API calls.'
