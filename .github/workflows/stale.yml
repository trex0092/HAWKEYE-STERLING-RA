name: Stale

# Marks issues/PRs stale after 60 days of inactivity and closes them 7 days
# later. Watchdog/automation issues are exempt so monitoring tickets persist.

on:
  schedule:
    - cron: '0 1 * * *'   # 01:00 UTC daily
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
      - uses: actions/stale@eb5cf3af3ac0a1aa4c9c45633dd1ae542a27a899 # v10
        with:
          days-before-stale: 60
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: 'regulatory-watch,sanctions-watch,link-check,pinned,security'
          exempt-pr-labels: 'regulatory-watch,sanctions-watch,visual-regression,pinned'
          stale-issue-message: 'No activity for 60 days — marking stale. It will close in 7 days if nothing changes.'
          stale-pr-message: 'No activity for 60 days — marking stale. It will close in 7 days if nothing changes.'
