name: Stale

# Marks issues/PRs stale after 60 days of inactivity and closes them 7 days
# later. Watchdog/automation issues are exempt so monitoring tickets persist.

on:
  schedule:
    - cron: '13 1 * * *'   # 01:13 UTC daily (odd minute)
  workflow_dispatch:

# Least privilege at the top level; the job declares its own write scopes.
permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:
  stale:
    permissions:
      issues: write # label/close stale issues
      pull-requests: write # label/close stale PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          days-before-stale: 60
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: 'regulatory-watch,sanctions-watch,link-check,pinned,security'
          exempt-pr-labels: 'regulatory-watch,sanctions-watch,visual-regression,pinned'
          stale-issue-message: 'No activity for 60 days — marking stale. It will close in 7 days if nothing changes.'
          stale-pr-message: 'No activity for 60 days — marking stale. It will close in 7 days if nothing changes.'
