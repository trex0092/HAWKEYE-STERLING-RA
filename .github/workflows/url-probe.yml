name: URL Probe (temporary — branch only, never merged)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - name: Probe candidate registry URLs
        run: |
          node --input-type=module -e '
          const HEADERS = {
            "user-agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36",
            "accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
            "accept-language": "en"
          };
          const urls = [
            "https://www.moec.gov.ae/en/anti-money-laundering",
            "https://www.moet.gov.ae/en/anti-money-laundering",
            "https://u.ae/en/information-and-services/justice-safety-and-the-law/anti-money-laundering-and-combatting-the-financing-of-terrorism",
            "https://u.ae/en/information-and-services/finance-and-investment/anti-money-laundering",
            "https://www.centralbank.ae/en/cbuae-amlcft/",
            "https://rulebook.centralbank.ae/en",
            "https://rulebook.centralbank.ae/en/rulebook/anti-money-laundering-and-combating-financing-terrorism",
            "https://mneguidelines.oecd.org/mining.htm",
            "https://www.oecd.org/en/topics/sub-issues/responsible-minerals-supply-chains.html",
            "https://www.oecd.org/en/topics/responsible-business-conduct.html",
            "https://www.oecd.org/en/publications/oecd-due-diligence-guidance-for-responsible-supply-chains-of-minerals-from-conflict-affected-and-high-risk-areas_9789264252479-en.html"
          ];
          for (const u of urls) {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), 25000);
            try {
              const r = await fetch(u, { headers: HEADERS, redirect: "follow", signal: ctrl.signal });
              const body = await r.text();
              const textLen = body.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").length;
              console.log("PROBE|" + r.status + "|" + textLen + "|" + u + "|final=" + r.url);
            } catch (e) {
              console.log("PROBE|ERR|" + String(e && (e.cause && e.cause.code || e.message)).slice(0,60) + "|" + u);
            } finally { clearTimeout(t); }
          }
          '
