name: PEP Worldwide Harvest

# Weekly harvest of the worldwide PEP list from Wikidata (CC0 — the one
# free, license-clean, machine-readable worldwide source of who holds
# PEP-grade public office). scripts/pep-worldwide.mjs partitions the query
# space (root class → position batch) so no request approaches the WDQS 60s
# kill, pulls every-language labels/aliases for the matcher's
# transliteration nets, and REFUSES to overwrite the previous artifact when
# a harvest comes back hollow (floor + shrink gates — an upstream outage
# must never thin the screened list silently). The artifact commits to the
# dedicated pep-worldwide-state branch (public-officials data, CC0 — no
# subject PII, so no encryption); the daily sanctions screen overlays it
# from there and screens every customer against it locally.
#
# Data lineage: Wikidata is crowd-maintained — a hit is a REVIEW-tier
# "verify this person's office" signal for the MLRO, never an auto-decision,
# and the daily screen caps PEP-list hits at band medium by construction.

on:
  schedule:
    - cron: '17 2 * * 0'   # Sundays 02:17 UTC — artifact is ready for Monday's daily screens
  workflow_dispatch:
  # A GitHub-hosted runner can die abnormally mid-harvest (observed three times:
  # the job ends "failure" with the harvest step still in_progress and the later
  # steps never reached). The in-run re-dispatch cannot cover that — a dead
  # runner does not execute its own recovery step, so the chain simply STOPPED
  # with hours of banked work sitting on the state branch. This event fires from
  # OUTSIDE the dead run and restarts the link.
  #
  # Safe use of workflow_run: the watchdog job checks out NOTHING and executes
  # no repository code — it reads this workflow's own run history and POSTs a
  # workflow_dispatch. The only trigger it can ever observe is THIS workflow,
  # which is reachable solely by schedule and manual dispatch (both require
  # write access), never from a pull request, so no untrusted input reaches the
  # privileged context. Do NOT add a checkout to that job.
  workflow_run:                     # zizmor: ignore[dangerous-triggers]
    workflows: ["PEP Worldwide Harvest"]
    types: [completed]

# Least privilege: the workflow token is READ-ONLY at top level; the single
# job below elevates only the two scopes it actually uses. A top-level write
# grants it to every job the file ever gains (Scorecard Token-Permissions).
permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:
  # Chain watchdog: restarts a link whose runner died abnormally. Runs only for
  # the workflow_run event, and only for a FAILED run that was itself a
  # schedule/dispatch link — never for another watchdog run, so the event cannot
  # chain into itself. Bounded by CONSECUTIVE failures read back from the API: a
  # harvest that is genuinely broken (rather than unlucky) stops the chain and
  # fails RED instead of re-dispatching forever.
  resume-after-abnormal-death:
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.event != 'workflow_run'
    permissions:
      actions: write   # read run history + dispatch the resume
    # Its OWN concurrency group. Inheriting the workflow-level one would put the
    # watchdog in the same queue as the harvest it is trying to restart: it
    # would sit pending behind an in-flight link, and a later run entering the
    # group would cancel it as a superseded pending run — silently losing the
    # restart. That is the exact failure this job exists to prevent.
    concurrency:
      group: "${{ github.workflow }}-watchdog"
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Restart the chain link (bounded by consecutive failures)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAX_ABNORMAL: '3'
          # Passed via env, never interpolated into the shell: a ref name is
          # attacker-influencable text and `${{ }}` inside run: is a template
          # injection (zizmor). The payload is built with JSON.stringify.
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          api() { curl -sSf -H "authorization: Bearer ${GITHUB_TOKEN}" -H "accept: application/vnd.github+json" "$@"; }
          api "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pep-worldwide.yml/runs?per_page=20" > runs.json
          # Count failures at the head of the history, ignoring watchdog runs —
          # they are bookkeeping, not harvest links. A success anywhere in that
          # run of failures resets the count, so an unlucky link is retried and
          # a reproducibly broken one is not.
          streak=$(node -e '
            const r = JSON.parse(require("fs").readFileSync("runs.json", "utf8")).workflow_runs || [];
            let n = 0;
            for (const w of r) {
              if (w.event === "workflow_run" || w.status !== "completed") continue;
              if (w.conclusion === "failure") { n++; continue; }
              break;
            }
            console.log(n);
          ')
          echo "consecutive failed harvest links: ${streak} (cap ${MAX_ABNORMAL})"
          if [ "$streak" -ge "$MAX_ABNORMAL" ]; then
            echo "::error::PEP harvest chain has failed ${streak} links in a row — NOT re-dispatching. The checkpoint on pep-worldwide-state is intact; investigate the harvest step log before resuming."
            exit 1
          fi
          payload=$(node -e 'process.stdout.write(JSON.stringify({ ref: process.env.HEAD_BRANCH }))')
          curl -sSf -X POST \
            -H "authorization: Bearer ${GITHUB_TOKEN}" \
            -H "accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pep-worldwide.yml/dispatches" \
            -d "$payload"
          echo "resume dispatched — the run resumes from the committed checkpoint"

  harvest:
    if: github.event_name != 'workflow_run'
    # contents: write — the harvest pushes the artifact + checkpoint to the
    # pep-worldwide-state data branch (branch protection keeps main closed).
    # actions: write — a time-budget-paused run re-dispatches THIS workflow so
    # the next run resumes from the committed checkpoint (workflow_dispatch is
    # the documented GITHUB_TOKEN exception that does trigger workflows).
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    # Time-budgeted: the harvest pauses itself at ~40 min (PEP_TIME_BUDGET_MIN),
    # commits a checkpoint, and re-dispatches to resume — GitHub-hosted runners
    # repeatedly died abnormally 1-3h into the old monolithic run, so short runs
    # sidestep the fragility window. A run past 75 min is a hang: fail loudly.
    timeout-minutes: 75
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          # Egress = GitHub (checkout + state push), node toolchain, and the
          # two Wikimedia hosts the harvester talks to. Nothing else.
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            query.wikidata.org:443
            www.wikidata.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No credentials on disk (zizmor artipacked): the state push below
          # authenticates with the ephemeral env token in the push URL.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Overlay the previous artifact + any checkpoint (resume baseline)
        run: |
          # The refuse-to-overwrite gate compares against the LAST committed
          # harvest — fetch it so a hollow harvest cannot pass as "first run".
          # A checkpoint on the branch means the previous run paused at its
          # time budget; overlaying it makes this run a RESUME, not a restart.
          if git fetch origin pep-worldwide-state --depth=1 2>/dev/null; then
            git checkout FETCH_HEAD -- data/pep-worldwide.json 2>/dev/null || true
            git checkout FETCH_HEAD -- data/pep-worldwide-checkpoint.json 2>/dev/null || true
            echo "previous state overlaid"
          else
            echo "no pep-worldwide-state branch yet — first harvest"
          fi

      - name: Harvest the worldwide PEP list from Wikidata
        id: harvest
        env:
          PEP_RECENCY_MONTHS: ${{ vars.PEP_RECENCY_MONTHS }}
          PEP_FLOOR: ${{ vars.PEP_FLOOR }}
          PEP_TIME_BUDGET_MIN: ${{ vars.PEP_TIME_BUDGET_MIN }}
        run: |
          # Exit 75 = time budget reached, checkpoint written: a PLANNED pause,
          # not a failure — the persist step commits the checkpoint and the
          # re-dispatch step queues the resume run. Any other non-zero exit is
          # a real failure and stays red.
          code=0
          node scripts/pep-worldwide.mjs harvest data/pep-worldwide.json || code=$?
          if [ "$code" -eq 75 ]; then
            echo "resume=1" >> "$GITHUB_OUTPUT"
            echo "time budget reached — checkpoint written; a resume run will be dispatched"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Persist the artifact + checkpoint (pep-worldwide-state branch)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Branch protection blocks direct pushes to main, so harvest state
          # lives on its own data branch: rebuilt as <current HEAD> + one data
          # commit, force-updated each run. A COMPLETE harvest commits the
          # fresh artifact and drops the spent checkpoint; a budget-paused run
          # commits the checkpoint alongside the previous artifact so the
          # dispatched resume picks up exactly where this run stopped. Auth is
          # the ephemeral env token in the push URL — the checkout persisted
          # no credentials.
          if [ -n "$(git status --porcelain -- data/pep-worldwide.json data/pep-worldwide-checkpoint.json)" ]; then
            git config user.name "pep-worldwide"
            git config user.email "actions@github.com"
            # Stage each path only when it EXISTS or is tracked: on a first
            # harvest that pauses at its budget the checkpoint exists but the
            # artifact does not, and `git add` on a pathspec matching nothing
            # is a fatal 128 — which is exactly how the first chain link died
            # AFTER a clean pause, losing the checkpoint it had just written.
            for f in data/pep-worldwide.json data/pep-worldwide-checkpoint.json; do
              if [ -e "$f" ] || git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
                git add -A -- "$f"
              fi
            done
            git commit -m "PEP worldwide harvest $(date -u +%F) [skip ci]"
            pushed=
            for attempt in 1 2 3 4 5; do
              git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/pep-worldwide-state && { pushed=1; break; }
              echo "push failed (attempt $attempt) — retrying"
              sleep $((attempt * 5))
            done
            [ -n "$pushed" ] || { echo "::error::state push to pep-worldwide-state failed after 5 attempts — harvest progress NOT persisted"; exit 1; }
            echo "state persisted to pep-worldwide-state"
          else
            echo "artifact unchanged this week — nothing to push"
          fi

      - name: Re-dispatch to resume (time-budget pause)
        if: steps.harvest.outputs.resume == '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The checkpoint is already on the state branch (persist ran first);
          # concurrency (cancel-in-progress: false) queues the resume run until
          # this one finishes. The script's resume cap bounds this loop — a
          # non-converging harvest fails red instead of dispatching forever.
          curl -sSf -X POST \
            -H "authorization: Bearer ${GITHUB_TOKEN}" \
            -H "accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pep-worldwide.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}"
          echo "resume run dispatched on ${GITHUB_REF_NAME}"

      - name: Harvest summary
        run: |
          node -e '
            const fs = require("fs");
            let cp = null, d = null;
            // Both files are gzipped (uncompressed they carry hundreds of MB of
            // harvest state / multilingual aliases, and GitHub refuses a push
            // over 100MB/file). Read either format.
            const readMaybeGz = (f) => {
              const b = fs.readFileSync(f);
              const t = (b[0] === 0x1f && b[1] === 0x8b)
                ? require("zlib").gunzipSync(b).toString("utf8") : b.toString("utf8");
              return JSON.parse(t);
            };
            try { cp = readMaybeGz("data/pep-worldwide-checkpoint.json"); } catch { cp = null; }
            try { d = readMaybeGz("data/pep-worldwide.json"); } catch { d = null; }
            const L = cp
              ? ["# PEP worldwide harvest — paused at the time budget", "",
                 "Phase **" + cp.phase + "**, resume " + cp.resumeCount + " — "
                 + cp.holderRows.length + " holder rows banked; a resume run has been dispatched."]
              : d
                ? ["# PEP worldwide harvest", "",
                   "Persons: **" + d.count + "** (harvested " + d.harvested + ")", "",
                   "| class | persons |", "| --- | --- |",
                   ...Object.entries(d.classes).map(([k, v]) => "| " + k + " | " + v + " |")]
                : ["# PEP worldwide harvest", "", "no artifact and no checkpoint — see the harvest step log"];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, L.join("\n") + "\n");
          '
