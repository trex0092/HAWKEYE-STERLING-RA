name: Prepare reviewed screening CI repair
on:
  push:
    branches: ['fix/screening-ci-browser-20261021']
permissions:
  contents: write
concurrency:
  group: prepare-screening-ci-browser-20261021
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'trex0092/HAWKEYE-STERLING-RA'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443 api.github.com:443 codeload.github.com:443
            objects.githubusercontent.com:443 raw.githubusercontent.com:443
            nodejs.org:443 *.githubapp.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - name: Verify reviewed base and unchanged source files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 4b05b615363de3f49258efaaf178b894f0f8b48d
          test -z "$(git status --porcelain)"
          test "$(git hash-object conflict-context.html)" = bd92bab54c6dd518e3c7f3952018b224af9972c3
          test "$(git hash-object test/asset-integrity.test.mjs)" = 2299a964976608d2e2d66be0d0c7fb5b642be79f
          test "$(git hash-object test/sanctions-screen.test.mjs)" = a8d59d0806a61543274fe5b0333a7bbce4efa4f4
      - name: Apply only the reviewed favicon and collision-fixture repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PATCH'
          import base64, gzip, hashlib, os
          from pathlib import Path
          # The two previously reviewed unified patches, compressed for transport.
          encoded = ''
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(patch).hexdigest() != '18d163083140c5b89fd1794f502c6ca5b1977d8119d230abb657f95df9e7a347':
              raise SystemExit('Patch digest mismatch')
          (Path(os.environ['RUNNER_TEMP']) / 'reviewed-repair.patch').write_bytes(patch)
          PY_PATCH
          git apply --check "$RUNNER_TEMP/reviewed-repair.patch"
          git apply "$RUNNER_TEMP/reviewed-repair.patch"
          git diff --check
          git diff --stat
      - name: Run complete affected suites against real repository modules
        shell: bash
        run: |
          set -euo pipefail
          node test/sanctions-screen.test.mjs
          node test/asset-integrity.test.mjs
          node test/screening-source-quality.test.mjs
          node test/csp.test.mjs
      - name: Publish only to the repair branch and remove this temporary workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          python3 - <<'PY_CHECK'
          import subprocess
          expected = {'conflict-context.html', 'test/asset-integrity.test.mjs', 'test/sanctions-screen.test.mjs'}
          actual = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit('Unexpected repair file set; refusing publication')
          PY_CHECK
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- conflict-context.html test/asset-integrity.test.mjs test/sanctions-screen.test.mjs
          git rm -- .github/workflows/prepare-screening-ci-repair.yml
          git commit -m "Fix screening collision fixtures and same-origin conflict favicon"
          test "$(git diff --name-only 4b05b615363de3f49258efaaf178b894f0f8b48d HEAD | wc -l)" -eq 3
          ASKPASS=$(mktemp "$RUNNER_TEMP/repair-askpass.XXXXXX")
          trap 'rm -f "$ASKPASS"' EXIT
          cat > "$ASKPASS" <<'ASKPASS_SCRIPT'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS_SCRIPT
          chmod 700 "$ASKPASS"
          GIT_ASKPASS="$ASKPASS" git push origin HEAD:refs/heads/fix/screening-ci-browser-20261021
          git rev-parse HEAD
