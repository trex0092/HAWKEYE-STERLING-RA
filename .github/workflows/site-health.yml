name: Site Health

# Weekly check that the LIVE site is up and actually working: renders the
# deployed app in headless Chrome and asserts the brand, the computed
# verdict, and the gauge. On failure it opens an assigned alert task in the
# HAWKEYE STERLING APP Asana project (plus GitHub's own failure email).
on:
  schedule:
    - cron: '19 5 * * *' # 05:19 UTC daily (09:19 UAE; odd minute)
  workflow_dispatch:

# Read-only probe of the live site; failure alert uses ASANA_ACCESS_TOKEN.
permissions:
  contents: read

# Manual dispatch must not race the scheduled run (duplicate "SITE DOWN" tasks).
concurrency:
  group: site-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # a hung headless-Chrome render must not pin a runner
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          disable-sudo: true
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - name: Render the live site (headless Chrome)
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --force-prefers-reduced-motion \
            --virtual-time-budget=8000 \
            --dump-dom "https://hawkeye-sterling-ra.netlify.app" > /tmp/dom.html || echo "chrome exit tolerated; asserting content"
          test -s /tmp/dom.html
          # Assert the brand and title as the two strings that actually exist in
          # the DOM. The header's all-caps look is CSS (text-transform:uppercase),
          # so the combined 'HAWKEYE STERLING — ENTITY RISK ASSESSMENT' is never
          # present in a --dump-dom and made this check fail every run. The brand
          # ('HAWKEYE STERLING', line ~528) and title ('Hawkeye Sterling — Entity
          # Risk Assessment', the <title>) are the real source strings — same
          # assertions ci.yml uses against this index.html.
          for s in 'HAWKEYE STERLING' 'Entity Risk Assessment' 'CDD — Customer Due Diligence' 'stroke-dasharray: 250.8, 600'; do
            grep -q "$s" /tmp/dom.html || { echo "MISSING: $s"; exit 1; }
          done
          echo "live site healthy — renders and computes"
      - name: Alert in Asana
        if: failure()
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/asana-alert.mjs \
            "SITE DOWN: hawkeye-sterling-ra.netlify.app failed its health check" \
            "The weekly health check could not load or verify the live assessment app. Check the Netlify deploys (https://app.netlify.com/projects/hawkeye-sterling-ra) and the run log: $RUN_URL"
