name: Daily Compliance Brief

# One consolidated Asana task each morning that rolls up the last 24h of
# monitoring (FATF, sanctions list changes, customer-screening hits, regulatory
# changes, site/function health) plus the current standing posture. It always
# files — "all clear" on a quiet day — so there is a daily record that monitoring
# ran. Runs after the daily watchers (sanctions 05:00/06:00, FATF/regulatory
# 06:00) so it captures the day's alerts. Needs the ASANA_ACCESS_TOKEN secret.
on:
  schedule:
    - cron: '9 7 * * *' # 07:09 UTC daily (11:09 UAE), after the daily watchers; odd minute — top-of-hour crons are GitHub's most-delayed slot
  workflow_dispatch:

permissions:
  contents: read

# Manual dispatch must not race the 07:00 schedule and double-post the brief.
concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            app.asana.com:443
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - name: Overlay latest FATF state (lives on the fatf-state branch)
        run: |
          # The authoritative FATF posture lives on the fatf-state branch (main is
          # protected). Without this overlay the brief reads main's stale copy and
          # its "FATF: N call-for-action, last change …" line can be out of date.
          if git fetch origin fatf-state --depth=1 2>/dev/null; then
            git checkout FETCH_HEAD -- data/fatf-state.json 2>/dev/null || true
            echo "FATF state overlaid from fatf-state"
          else
            echo "no fatf-state branch yet — using state from main"
          fi
      - name: Compose and file the daily brief
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
        run: node scripts/daily-brief.mjs
