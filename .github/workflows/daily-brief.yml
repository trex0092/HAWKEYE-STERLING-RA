name: Daily Compliance Brief

# One consolidated Asana task each morning that rolls up monitoring since the
# previous brief (FATF, sanctions list changes, customer-screening hits,
# regulatory changes, site/function health) plus the current standing posture. It
# always files — "all clear" on a quiet day — so there is a daily record that
# monitoring ran. Runs after the daily watchers (sanctions 05:00/06:00,
# FATF/regulatory 06:00) so it captures the day's alerts.
#
# The reported window is anchored to the previous brief, NOT a fixed 24h: this
# cron is routinely delayed by hours and the delay varies, so consecutive briefs
# land 22.5–26h apart. A fixed 24h lookback dropped every hour past 24 into a
# window no brief reported on. Do not reintroduce one here.
# Needs the ASANA_ACCESS_TOKEN secret.
on:
  schedule:
    - cron: '9 7 * * *' # 07:09 UTC daily (11:09 UAE), after the daily watchers; odd minute — top-of-hour crons are GitHub's most-delayed slot
  workflow_dispatch:

permissions:
  contents: read

# Manual dispatch must not race the 07:00 schedule and double-post the brief.
concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            app.asana.com:443
            *.githubapp.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Overlay latest FATF state (lives on the fatf-state branch)
        run: |
          # The authoritative FATF posture lives on the fatf-state branch (main is
          # protected). Without this overlay the brief reads main's stale copy and
          # its "FATF: N call-for-action, last change …" line can be out of date.
          if git fetch origin fatf-state --depth=1 2>/dev/null; then
            git checkout FETCH_HEAD -- data/fatf-state.json 2>/dev/null || true
            echo "FATF state overlaid from fatf-state"
          else
            echo "no fatf-state branch yet — using state from main"
          fi
      - name: Compose and file the daily brief
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
        run: node scripts/daily-brief.mjs
