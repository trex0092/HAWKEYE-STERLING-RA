name: Watchman matching benchmark

# EXPERIMENTAL, shadow-only, dispatch-only. This is a measurement instrument, not
# a control. It is the second independent engine beside yente-bench.yml.
#
# What it does: boots moov-io/watchman (Apache-2.0) on the runner and scores it
# against this repo's OWN frozen screening benchmark
# (test/fixtures/screening-benchmark). The listed names are uploaded through
# Watchman's custom file ingest, and the configuration loads no government list,
# so no sanctions data is downloaded.
#
# Scope: nothing here touches screening state, cases or Asana; the output is a
# report. Adopting Watchman inside the live matcher would be a separate change
# governed by the recall-monotone invariant.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:
  watchman-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit  # Stays audit: first runs must map the Docker Hub registry/CDN endpoints before a block list would be honest

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate the PII-free benchmark dataset and config
        run: node scripts/watchman-bench.mjs dataset .watchman

      - name: Boot Watchman (no downloaded lists)
        run: |
          docker run -d --name watchman -p 127.0.0.1:8084:8084 \
            -v "$PWD/.watchman:/conf:ro" \
            -e APP_CONFIG=/conf/watchman.yml \
            -e DATA_REFRESH_INTERVAL=off \
            moov/watchman:v1.2.0@sha256:e655b7f1484b0913ea9c8e161baeb979cedb7fe815a019b5259183ffcb0d9e81

      - name: Wait for the API
        run: |
          ready=
          for attempt in $(seq 1 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:8084/v2/listinfo; then ready=1; break; fi
            echo "waiting for watchman /v2/listinfo (attempt $attempt)"; sleep 2
          done
          if [ -z "$ready" ]; then
            echo "::error::watchman never became ready"
            docker logs watchman
            exit 1
          fi

      - name: Run the benchmark
        run: |
          node scripts/watchman-bench.mjs run http://127.0.0.1:8084 .watchman/hawkeye-bench.csv
          {
            cat watchman-bench-report.md
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: watchman-bench-report
          path: watchman-bench-report.md
          retention-days: 30

      - name: Container logs (on failure)
        if: failure()
        run: docker logs watchman || true
