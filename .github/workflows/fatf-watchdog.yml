name: FATF Watchdog

# Daily check of FATF's black (call-for-action) and grey (increased
# monitoring) lists against the app's country data. On any change it creates
# a review task in the HAWKEYE STERLING APP Asana project naming the affected
# assessments. Needs the ASANA_ACCESS_TOKEN repository secret.
# Daily so a mid-cycle FATF plenary outcome is caught within a day. The check is
# silent unless the lists actually move, so the daily cadence adds no noise.
on:
  schedule:
    - cron: '7 6 * * *' # 06:07 UTC daily (odd minute)
  workflow_dispatch:
    inputs:
      mode:
        description: 'check (compare + alert) | seed (record lists, no alert) | test-alert ([TEST] Asana task) | setup-sections (risk-band sections) | digest (monthly "Reviews due" task) | backup-risk-data (commit override sheet)'
        default: 'check'

permissions:
  contents: read

# Serialize: this job commits + pushes list-state / risk-data. Overlapping
# runs (manual dispatch vs the 06:00 schedule) would race the push.
concurrency:
  group: fatf-watchdog
  cancel-in-progress: false

jobs:
  watch:
    # Write scopes live at job level (top level is read-only — least privilege).
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15 # bound external list fetches
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            app.asana.com:443
            www.fatf-gafi.org:443
            web.archive.org:443
            archive.org:443
            *.githubapp.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No credentials on disk (zizmor artipacked): the state push below
          # authenticates with an ephemeral env token, and the overlay fetch
          # is anonymous (public repo).
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Overlay latest list state (lives on the fatf-state branch)
        run: |
          # Branch protection blocks direct pushes to main (GH006), so the
          # black/grey list state and risk-data backups live on a dedicated
          # data branch. Without the overlay a list move would re-alert daily
          # and diff against a stale baseline.
          if git fetch origin fatf-state --depth=1 2>/dev/null; then
            git checkout FETCH_HEAD -- data/fatf-state.json 2>/dev/null || true
            git checkout FETCH_HEAD -- data/risk-overrides-backup.json 2>/dev/null || true
            echo "state overlaid from fatf-state"
          else
            echo "no fatf-state branch yet — using state from main"
          fi

      - name: Run watchdog
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          MODE: ${{ inputs.mode || 'check' }}
        run: node scripts/fatf-watchdog.mjs "$MODE"
      - name: Monthly review digest
        # Idempotent monthly digest — self-skips once this month's "Reviews due"
        # task exists, so it is safe to run on the daily schedule. Runs even if the
        # FATF source check above failed.
        if: always() && github.event_name == 'schedule'
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
        run: node scripts/fatf-watchdog.mjs digest
      - name: Monthly risk-data backup
        if: always() && github.event_name == 'schedule'
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
        run: node scripts/fatf-watchdog.mjs backup-risk-data
      - name: Persist list state and backups
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "fatf-watchdog"
            git config user.email "actions@github.com"
            git add data/
            git commit -m "Watchdog: record list state / risk-data backup [skip ci]"
            # Persist on the fatf-state branch (main is protected): rebuilt as
            # <current main> + one data commit, force-updated.
            # Auth is the ephemeral env token in the push URL — the checkout
            # persists no credentials, so nothing lands in .git/config.
            pushed=
            for attempt in 1 2 3 4 5; do
              git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/fatf-state && { pushed=1; break; }
              echo "push failed (attempt $attempt) — retrying"
              sleep $((attempt * 3))
            done
            [ -n "$pushed" ] || { echo "::error::state push to fatf-state failed after 5 attempts — state NOT persisted"; exit 1; }
          else
            echo "state unchanged"
          fi
