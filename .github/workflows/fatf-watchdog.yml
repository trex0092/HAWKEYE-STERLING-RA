name: FATF Watchdog

# Daily check of FATF's black (call-for-action) and grey (increased
# monitoring) lists against the app's country data. On any change it creates
# a review task in the RISK ASSESSMENTS Asana project naming the affected
# assessments. Needs the ASANA_ACCESS_TOKEN repository secret.
# Daily so a mid-cycle FATF plenary outcome is caught within a day. The check is
# silent unless the lists actually move, so the daily cadence adds no noise.
on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      mode:
        description: 'check (compare + alert) | seed (record lists, no alert) | test-alert ([TEST] Asana task) | setup-sections (risk-band sections) | digest (monthly "Reviews due" task) | backup-risk-data (commit override sheet)'
        default: 'check'

permissions:
  contents: write

# Serialize: this job commits + pushes list-state / risk-data. Overlapping
# runs (manual dispatch vs the 06:00 schedule) would race the push.
concurrency:
  group: fatf-watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # bound external list fetches
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            app.asana.com:443
            www.fatf-gafi.org:443
            web.archive.org:443
            archive.org:443
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - name: Run watchdog
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
        run: node scripts/fatf-watchdog.mjs "${{ inputs.mode || 'check' }}"
      - name: Monthly review digest
        # Idempotent monthly digest — self-skips once this month's "Reviews due"
        # task exists, so it is safe to run on the daily schedule. Runs even if the
        # FATF source check above failed.
        if: always() && github.event_name == 'schedule'
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
        run: node scripts/fatf-watchdog.mjs digest
      - name: Monthly risk-data backup
        if: always() && github.event_name == 'schedule'
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
        run: node scripts/fatf-watchdog.mjs backup-risk-data
      - name: Persist list state and backups
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "fatf-watchdog"
            git config user.email "actions@github.com"
            git add data/
            git commit -m "Watchdog: record list state / risk-data backup [skip ci]"
            for attempt in 1 2 3 4 5; do
              git push && break
              echo "push rejected (attempt $attempt) — rebasing on origin/main"
              git pull --rebase origin main || git rebase --abort
              sleep $((attempt * 3))
            done
          else
            echo "state unchanged"
          fi
