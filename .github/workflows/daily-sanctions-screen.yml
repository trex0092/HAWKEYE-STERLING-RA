# ============================================================
# FILE: .github/workflows/daily-sanctions-screen.yml
# PLACE THIS FILE IN YOUR REPO AT THAT EXACT PATH
# ============================================================
#
# REQUIRED GITHUB SECRETS (Settings → Secrets → Actions):
#   ASANA_PAT         — Your Asana Personal Access Token
#
# REQUIRED REPO VARIABLES (Settings → Variables → Actions):
#   ASANA_PROJECT_GID     = 1213914392047129
#   ASANA_SECTION_GID     = 1213914392047131
#   ASANA_ASSIGNEE_GID    = 1213645083721304
#   ASANA_CUSTOMER_DB_GID = 1214107620220121
#
# ============================================================

name: Daily Sanctions Screening

on:
  # RETIRED (schedule removed): superseded by the single unified "Daily Screening
  # (Sanctions + Adverse Media + PEP)" workflow (weekly-adverse-media.yml,
  # RUN_MODE=unified), delivered daily by 09:00 UAE. Kept as manual-only so it can
  # still be re-run on demand; no longer posts a duplicate daily task.
  workflow_dispatch:

# Least privilege: the screen reads the repo and posts results to Asana via
# ASANA_ACCESS_TOKEN (a secret). It never pushes to the repo, so the default
# GITHUB_TOKEN needs read-only contents and nothing else.
permissions:
  contents: read

# A mandatory daily control must not run twice concurrently (manual dispatch
# overlapping the 02:00/14:00 schedule) and double-post to Asana.
concurrency:
  group: daily-sanctions-screen
  cancel-in-progress: false

jobs:
  sanctions-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            files.pythonhosted.org:443
            www.treasury.gov:443
            sanctionslistservice.ofac.treas.gov:443
            wc2h-sls-prod-public-published.s3.us-gov-west-1.amazonaws.com:443
            main.un.org:443
            webgate.ec.europa.eu:443
            assets.publishing.service.gov.uk:443
            app.asana.com:443

      # Check out the repo so the maintained UAE EOCN list
      # (data/eocn-local-terrorist-list.json) is available to the screen.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # --------------------------------------------------------
      # STEP 1 — SET UAE DATE
      # --------------------------------------------------------
      - name: Set UAE date and time
        id: date
        run: |
          export TZ="Asia/Dubai"
          {
            echo "DATE_ISO=$(date +'%Y-%m-%d')"
            echo "DATE_DISPLAY=$(date +'%-d %b %Y')"
            echo "DATE_SLUG=$(date +'%Y-%m-%d')"
            echo "TIME_GST=$(date +'%H:%M')"
            echo "DATETIME_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"


      # --------------------------------------------------------
      # STEP 2 — INSTALL DEPENDENCIES
      # --------------------------------------------------------
      - name: Install Python dependencies
        run: pip install --quiet --require-hashes -r ci/requirements.txt


      # --------------------------------------------------------
      # STEP 3 — DOWNLOAD ALL SANCTIONS LISTS
      # --------------------------------------------------------
      # Downloads use -f with a graceful else-branch: an HTTP failure must
      # neither kill the job before any report can be delivered (bash -e used
      # to die right here on a curl error) nor leave an HTTP error page on
      # disk that gets hashed and "screened" as list data. A failed download
      # leaves NO file; the screening step classifies a missing/empty source
      # file as a SOURCE OUTAGE, screens DEGRADED without that list, says so
      # in the report, and the floor gate fails the job after delivery.
      - name: Download OFAC SDN list
        run: |
          if curl -sfL \
            "https://www.treasury.gov/ofac/downloads/sdn.xml" \
            -o /tmp/ofac_sdn.xml; then
            echo "OFAC_HASH=$(sha256sum /tmp/ofac_sdn.xml | cut -d' ' -f1)" \
              >> "$GITHUB_ENV"
          else
            echo "::warning::OFAC SDN download failed - this run screens DEGRADED without it"
            rm -f /tmp/ofac_sdn.xml
          fi

      - name: Download UN Consolidated list
        run: |
          if curl -sfL \
            "https://main.un.org/securitycouncil/content/un-sc-consolidated-list/en/consolidated.xml" \
            -o /tmp/un_consolidated.xml; then
            echo "UN_HASH=$(sha256sum /tmp/un_consolidated.xml | cut -d' ' -f1)" \
              >> "$GITHUB_ENV"
          else
            echo "::warning::UN Consolidated download failed - this run screens DEGRADED without it"
            rm -f /tmp/un_consolidated.xml
          fi

      - name: Download EU Financial Sanctions list
        run: |
          if curl -sfL \
            "https://webgate.ec.europa.eu/fsd/fsf/public/files/xmlFullSanctionsList_1_1/content" \
            -o /tmp/eu_sanctions.xml; then
            echo "EU_HASH=$(sha256sum /tmp/eu_sanctions.xml | cut -d' ' -f1)" \
              >> "$GITHUB_ENV"
          else
            echo "::warning::EU FSF download failed - this run screens DEGRADED without it"
            rm -f /tmp/eu_sanctions.xml
          fi

      - name: Download UK OFSI Consolidated list
        run: |
          if curl -sfL \
            "https://assets.publishing.service.gov.uk/media/uk-sanctions-consolidated-list.csv" \
            -o /tmp/uk_ofsi.csv; then
            echo "UK_HASH=$(sha256sum /tmp/uk_ofsi.csv | cut -d' ' -f1)" \
              >> "$GITHUB_ENV"
          else
            echo "::warning::UK OFSI download failed - this run screens DEGRADED without it"
            rm -f /tmp/uk_ofsi.csv
          fi

      - name: Load UAE EOCN list (maintained in-repo)
        run: |
          # The UAE EOCN Local Terrorist List is published ONLY as a bot-protected
          # PDF/Excel (no machine-readable feed), so scraping a PDF at runtime failed
          # every day. It is maintained in-repo as data/eocn-local-terrorist-list.json
          # — the same source the Node screener uses. Hash it for the audit trail;
          # only flag failure if the file is genuinely missing.
          EOCN_FILE=data/eocn-local-terrorist-list.json
          if [ -f "$EOCN_FILE" ]; then
            echo "UAE_HASH=$(sha256sum "$EOCN_FILE" | cut -d' ' -f1)" >> "$GITHUB_ENV"
            echo "UAE_PDF_FAILED=false" >> "$GITHUB_ENV"
          else
            echo "UAE EOCN list file missing — manual check required"
            echo "UAE_PDF_FAILED=true" >> "$GITHUB_ENV"
          fi


      # --------------------------------------------------------
      # STEP 4 — FETCH CUSTOMER LIST FROM ASANA
      # --------------------------------------------------------
      - name: Fetch customer list from Asana
        env:
          ASANA_PAT: ${{ secrets.ASANA_ACCESS_TOKEN || secrets.ASANA_PAT }}
          CUSTOMER_DB_GID: ${{ vars.ASANA_CUSTOMER_DB_GID || '1214107620220121' }}
        run: |
          python3 << 'PYEOF'
          import requests, json, os, re

          def extract_principals(notes):
              # Pull natural-person principals (UBOs / shareholders / directors) out
              # of the CDD record's "SECTION 4 — IDENTIFICATIONS" block so each is
              # screened in their own right, not just the company name.
              if not notes: return []
              m = re.search(r'SECTION\s*4\b[^\n]*(?:IDENTIFICATION|IDENTITIES|UBO|BENEFICIAL|SHAREHOLDER|DIRECTOR)([\s\S]*?)(?=\n\s*(?:SECTION|PART)\b|$)', notes, re.I)
              if not m: return []
              block = m.group(0); people = []; seen = set()
              def push(name, role, nat):
                  n = re.sub(r'\s+', ' ', (name or '')).strip()
                  k = n.lower()
                  if not n or k in seen: return
                  if re.match(r'^(n/?a|none|nil|not applicable|pending|tbc)$', n, re.I): return
                  seen.add(k); people.append({"name": n, "role": re.sub(r'\s+', ' ', (role or 'Principal')).strip(), "nationality": (nat or '').strip()})
              structured = False
              for p in re.split(r'(?=Individual\s*\d+\s*[—–\-:])', block):
                  rm = re.match(r'Individual\s*\d+\s*[—–\-:]\s*([^\n]*)', p, re.I)
                  nm = re.search(r'\bName\s*:\s*([^\n]+)', p, re.I)
                  if rm and nm:
                      structured = True
                      nat = re.search(r'\bNationality\s*:\s*([^\n]+)', p, re.I)
                      push(nm.group(1), rm.group(1), nat.group(1) if nat else '')
              if not structured:
                  for nm in re.finditer(r'\b(?:Name|UBO|Beneficial Owner|Authori[sz]ed Signatory|Signatory|Shareholder|Director|Partner)\s*:\s*([^\n]+)', block, re.I):
                      push(nm.group(1), 'Principal', '')
              return people

          pat = os.environ["ASANA_PAT"]
          project_gid = os.environ["CUSTOMER_DB_GID"]
          headers = {"Authorization": f"Bearer {pat}"}
          customers = []
          url = f"https://app.asana.com/api/1.0/tasks"
          params = {
              "project": project_gid,
              "opt_fields": "name,gid,permalink_url,notes",
              "limit": 100
          }

          while True:
              r = requests.get(url, headers=headers, params=params)
              # Fail LOUDLY on an auth/rate error. Without this, a 401 (expired
              # ASANA_PAT) / 403 / 429 returns a JSON error body that parses fine,
              # data.get("data") is [], and the run posts an all-clear for a
              # customer base it never actually read — a silent false negative.
              if not r.ok:
                  raise SystemExit(f"FATAL: Asana customer fetch failed — HTTP {r.status_code}: {r.text[:300]}")
              data = r.json()
              for t in data.get("data", []):
                  if t.get("name","").strip():
                      cname = t["name"].strip()
                      customers.append({
                          "name": cname,
                          "gid": t["gid"],
                          "url": t.get("permalink_url",""),
                          "kind": "entity",
                          "parent": ""
                      })
                      # Screen every recorded principal / UBO / director too.
                      for pr in extract_principals(t.get("notes","")):
                          customers.append({
                              "name": pr["name"],
                              "gid": t["gid"],
                              "url": t.get("permalink_url",""),
                              "kind": "individual",
                              "parent": cname,
                              "role": pr.get("role",""),
                              "nationality": pr.get("nationality","")
                          })
              next_page = data.get("next_page")
              if not next_page:
                  break
              params["offset"] = next_page["offset"]

          # An empty customer base is never a valid "all clear" — it means the
          # project GID is wrong or the read was blocked. Fail rather than post a
          # vacuous clean screen.
          if not customers:
              raise SystemExit("FATAL: 0 customers read from the Asana Customer Database — refusing to post an all-clear. Check ASANA_CUSTOMER_DB_GID and the token's access.")

          with open("/tmp/customers.json","w") as f:
              json.dump(customers, f, ensure_ascii=False)

          entity_count = sum(1 for c in customers if c.get("kind") != "individual")
          individual_count = len(customers) - entity_count
          print(f"Fetched {entity_count} customers + {individual_count} principals/UBOs = {len(customers)} subjects to screen")
          PYEOF


      # --------------------------------------------------------
      # STEP 5 — RUN SCREENING
      # --------------------------------------------------------
      - name: Run sanctions screening
        run: |
          python3 << 'PYEOF'
          import json, os, re, hashlib
          import xml.etree.ElementTree as ET
          from rapidfuzz import fuzz, process
          import unicodedata

          # ---- helpers ----
          def normalise(name):
              """Lowercase, remove punctuation, normalise unicode."""
              name = unicodedata.normalize("NFKD", name)
              name = name.encode("ascii", "ignore").decode("ascii")
              name = re.sub(r"[^\w\s]", " ", name.lower())
              return re.sub(r"\s+", " ", name).strip()

          THRESHOLD = 85

          # ---- load customers ----
          with open("/tmp/customers.json") as f:
              customers = json.load(f)
          print(f"Screening {len(customers)} customers")

          # ---- build sanctions name list ----
          sanctioned = []   # list of dicts: {name, list, programme}

          # OFAC SDN
          try:
              tree = ET.parse("/tmp/ofac_sdn.xml")
              root = tree.getroot()
              ns = {"ns": root.tag.split("}")[0].lstrip("{")} if "}" in root.tag else {}
              prefix = f"{{{ns['ns']}}}" if ns else ""
              for entry in root.iter(f"{prefix}sdnEntry"):
                  last = entry.find(f"{prefix}lastName")
                  first = entry.find(f"{prefix}firstName")
                  name_parts = []
                  if last is not None and last.text:
                      name_parts.append(last.text)
                  if first is not None and first.text:
                      name_parts.append(first.text)
                  full = " ".join(name_parts).strip()
                  # Compute programmes per entry BEFORE the name guard: the alias
                  # loop below references `programmes`, so a name-less primary entry
                  # would otherwise raise NameError (aborting the whole OFAC parse)
                  # or, worse, tag an alias with the PREVIOUS entry's programme.
                  programmes = []
                  for prog in entry.iter(f"{prefix}program"):
                      if prog.text:
                          programmes.append(prog.text)
                  if full:
                      sanctioned.append({
                          "name": full,
                          "list": "OFAC SDN",
                          "programme": ", ".join(programmes)
                      })
                  # aliases
                  for aka in entry.iter(f"{prefix}aka"):
                      al = aka.find(f"{prefix}lastName")
                      af = aka.find(f"{prefix}firstName")
                      parts = []
                      if al is not None and al.text: parts.append(al.text)
                      if af is not None and af.text: parts.append(af.text)
                      alias = " ".join(parts).strip()
                      if alias:
                          sanctioned.append({
                              "name": alias,
                              "list": "OFAC SDN",
                              "programme": ", ".join(programmes)
                          })
              print(f"OFAC SDN: {len([s for s in sanctioned if s['list']=='OFAC SDN'])} entries")
          except Exception as e:
              print(f"OFAC parse error: {e}")

          # UN Consolidated
          try:
              tree = ET.parse("/tmp/un_consolidated.xml")
              root = tree.getroot()
              before = len(sanctioned)
              for ind in root.iter("INDIVIDUAL"):
                  parts = []
                  for tag in ["FIRST_NAME","SECOND_NAME","THIRD_NAME","FOURTH_NAME"]:
                      el = ind.find(tag)
                      if el is not None and el.text:
                          parts.append(el.text)
                  name = " ".join(parts).strip()
                  if name:
                      sanctioned.append({"name": name, "list": "UN Consolidated", "programme": "UN Security Council"})
              for ent in root.iter("ENTITY"):
                  el = ent.find("FIRST_NAME")
                  if el is not None and el.text:
                      sanctioned.append({"name": el.text.strip(), "list": "UN Consolidated", "programme": "UN Security Council"})
              print(f"UN Consolidated: {len(sanctioned)-before} entries")
          except Exception as e:
              print(f"UN parse error: {e}")

          # EU Sanctions — the official EU export (xmlFullSanctionsList_1_1) is
          # namespaced and stores the name in the `wholeName` ATTRIBUTE of each
          # <nameAlias> (not as element text), so match tags by local-name and read
          # the attribute, falling back to firstName/middleName/lastName. The prior
          # element-text parse (root.iter("sanctionEntity") + name_el.text) silently
          # returned 0 EU entries on the real feed — a sanctions-coverage gap.
          try:
              tree = ET.parse("/tmp/eu_sanctions.xml")
              root = tree.getroot()
              before = len(sanctioned)
              seen_eu = set()
              for subject in root.iter():
                  if subject.tag.split("}")[-1] != "sanctionEntity":
                      continue
                  for alias in subject.iter():
                      if alias.tag.split("}")[-1] != "nameAlias":
                          continue
                      nm = (alias.get("wholeName") or "").strip()
                      if not nm:
                          nm = " ".join(p for p in (
                              alias.get("firstName"), alias.get("middleName"), alias.get("lastName")
                          ) if p).strip()
                      if nm and nm.lower() not in seen_eu:
                          seen_eu.add(nm.lower())
                          sanctioned.append({"name": nm, "list": "EU FSF", "programme": "EU Financial Sanctions"})
              print(f"EU FSF: {len(sanctioned)-before} entries")
          except Exception as e:
              print(f"EU parse error: {e}")

          # UK OFSI
          try:
              import csv
              before = len(sanctioned)
              with open("/tmp/uk_ofsi.csv", encoding="utf-8-sig", errors="replace") as f:
                  reader = csv.DictReader(f)
                  for row in reader:
                      # Use only the known OFSI name columns. The old bare
                      # `... or list(row.values())[0] if row else ""` both mis-parsed
                      # (precedence made `else ""` dead) and, when name columns were
                      # empty, injected the first column's value (e.g. "Group Type")
                      # as a sanctioned "name".
                      name = (row.get("Name 6") or row.get("Name") or row.get("LastName") or row.get("name") or "")
                      if name and name.strip():
                          sanctioned.append({"name": name.strip(), "list": "UK OFSI", "programme": row.get("Regime","UK Sanctions")})
              print(f"UK OFSI: {len(sanctioned)-before} entries")
          except Exception as e:
              print(f"UK parse error: {e}")

          # UAE EOCN — maintained in-repo machine-readable list (bot-protected at source)
          uae_names = []
          try:
              with open("data/eocn-local-terrorist-list.json", encoding="utf-8") as f:
                  _eocn = json.load(f)
              for entry in _eocn.get("entries", []):
                  if isinstance(entry, str):
                      cands = [entry]
                  elif isinstance(entry, dict):
                      cands = [entry.get("name", "")] + list(entry.get("aliases", []) or [])
                  else:
                      cands = []
                  for cand in cands:
                      cand = str(cand).strip()
                      if len(cand) > 3:
                          uae_names.append(cand)
                          sanctioned.append({"name": cand, "list": "UAE EOCN", "programme": "UAE Local Terrorist List"})
              print(f"UAE EOCN: {len(uae_names)} names loaded from in-repo list")
              # Review-age gate: the curated list is only as current as its own
              # lastReviewed date. An overdue (or missing) review still screens
              # with the file we have, but flags the run so the report marks it
              # and a post-delivery step fails the job loudly.
              import datetime as _dt_eocn
              _lr = str(_eocn.get("lastReviewed", ""))[:10]
              try:
                  _age = (_dt_eocn.date.today() - _dt_eocn.datetime.strptime(_lr, "%Y-%m-%d").date()).days
              except Exception:
                  _age = None
              _max_age = int(os.environ.get("EOCN_REVIEW_MAX_AGE_DAYS", "7"))
              if _age is None or _age > _max_age:
                  # The age label carries its own unit ("26d" or "unknown") so
                  # downstream consumers never render "Noned"/"unknownd".
                  _age_label = f"{_age}d" if _age is not None else "unknown"
                  print(f"WARNING: EOCN REVIEW OVERDUE - lastReviewed '{_lr or 'missing'}' (age {_age_label}, max {_max_age}d)")
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as _ge:
                      _ge.write("UAE_LIST_STALE=true\n")
                      _ge.write(f"UAE_LIST_REVIEW_AGE={_age_label}\n")
                      _ge.write(f"UAE_LIST_REVIEW_MAX={_max_age}\n")
          except Exception as e:
              print(f"UAE EOCN load error: {e}")
              os.environ["UAE_PDF_FAILED"] = "true"

          # ---- fail-safes: never trust an empty or partially loaded core list ----
          # One list at zero names (parse failure) or a fraction of its known
          # size (truncated download) is a silent false-negative machine; all
          # lists empty would report every customer "clear". Floors here are
          # deliberately conservative (well below normal sizes: this
          # manual-dispatch path parses different file formats than the main
          # engine) so they catch a collapse, never a routine de-listing.
          # Kill-switch: LIST_FLOORS_ENFORCE=0.
          #
          # Two classes, so a source outage cannot silently kill the Asana
          # delivery (the old SystemExit here skipped the report step, so a
          # breach day produced NO task at all and the UAE_PDF_FAILED handling
          # in the report step was unreachable):
          #   outage - the source file was never obtained (absent/empty, the
          #            download steps remove failed fetches): screen DEGRADED
          #            without it, mark it in the report, fail AFTER delivery;
          #   breach - the file is present but parsed below floor (corruption/
          #            truncation): compute NO results, deliver a REFUSAL
          #            notice instead of a report, fail AFTER delivery.
          _floors = {"OFAC SDN": 1000, "UN Consolidated": 200, "EU FSF": 500, "UK OFSI": 1000, "UAE EOCN": 100}
          _srcfile = {"OFAC SDN": "/tmp/ofac_sdn.xml", "UN Consolidated": "/tmp/un_consolidated.xml",
                      "EU FSF": "/tmp/eu_sanctions.xml", "UK OFSI": "/tmp/uk_ofsi.csv",
                      "UAE EOCN": "data/eocn-local-terrorist-list.json"}
          _by_list = {}
          for _s in sanctioned:
              _by_list[_s["list"]] = _by_list.get(_s["list"], 0) + 1
          _obtained = {_l: os.path.exists(_p) and os.path.getsize(_p) > 0 for _l, _p in _srcfile.items()}
          # The EOCN list is a LOCAL curated file with a documented honest-empty
          # DEGRADED state; "obtained" for it means names were actually
          # extracted, so an empty/corrupt/absent local file degrades (like the
          # engine) instead of refusing the whole run.
          _obtained["UAE EOCN"] = _by_list.get("UAE EOCN", 0) > 0
          _enforce = os.environ.get("LIST_FLOORS_ENFORCE", "1") == "1"
          _short = [_l for _l in _floors if _by_list.get(_l, 0) < _floors[_l]]
          _outages = [_l for _l in _short if not _obtained[_l]]
          _breaches = [f"{_l} loaded {_by_list.get(_l, 0)} name(s), below its floor of {_floors[_l]}"
                       for _l in _short if _obtained[_l]]
          _refusal = ""
          if not sanctioned:
              # Every list empty: screening would clear every customer (a
              # universal false negative) - refused regardless of class or
              # kill-switch, but still DELIVERED as a refusal notice below.
              _refusal = ("no sanctions entries loaded from ANY list - refusing to screen "
                          "(every customer would be reported 'clear'); check the list downloads above")
          elif _breaches and _enforce:
              _refusal = ("COVERAGE FLOOR BREACH: " + "; ".join(_breaches)
                          + " - refusing to screen or post an all-clear "
                          "(possible failed download / bad parse / truncated source)")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as _ge:
              if _outages:
                  print("WARNING: SOURCE OUTAGE - screening proceeds DEGRADED without: " + ", ".join(_outages))
                  _ge.write("LIST_OUTAGES=" + ", ".join(_outages) + "\n")
              if _breaches:
                  print(("FATAL: " if _enforce else "WARNING: ")
                        + "COVERAGE FLOOR BREACH: " + "; ".join(_breaches))
              if _refusal:
                  _ge.write("FLOOR_BREACH_MSG=" + _refusal.replace("\n", " ")[:500] + "\n")
              if _refusal or ((_outages or _breaches) and _enforce):
                  _ge.write("FLOOR_GATE=true\n")
          if _refusal:
              # Deliver the refusal instead of results: the report step posts a
              # clearly marked refusal task (no all-clear wording), then the
              # floor gate step turns the job red. Results from corrupt data
              # are never computed.
              results_data = {
                  "total": len(customers),
                  "entity_count": sum(1 for c in customers if c.get("kind") != "individual"),
                  "individual_count": sum(1 for c in customers if c.get("kind") == "individual"),
                  "confirmed": [], "potential": [], "clear_count": 0,
                  "uae_pdf_failed": os.environ.get("UAE_PDF_FAILED", "false"),
                  "refused": _refusal,
                  "unavailable_lists": _outages,
              }
              with open("/tmp/results.json", "w") as f:
                  json.dump(results_data, f, ensure_ascii=False, indent=2)
              print("SCREENING REFUSED - refusal notice written for delivery; the floor gate fails the job after delivery.")
              raise SystemExit(0)

          # ---- normalise all sanctioned names ----
          sanctioned_norm = [(normalise(s["name"]), s) for s in sanctioned]
          norm_names_only = [x[0] for x in sanctioned_norm]

          # ---- screen each customer ----
          confirmed_hits = []
          potential_matches = []
          clear = []

          for customer in customers:
              cname = customer["name"]
              cnorm = normalise(cname)

              # rapidfuzz batch match — top 3
              results = process.extract(
                  cnorm,
                  norm_names_only,
                  scorer=fuzz.token_sort_ratio,
                  limit=3
              )

              hit = False
              for match_name, score, idx in results:
                  if score >= 95:
                      confirmed_hits.append({
                          "customer": cname,
                          "customer_gid": customer["gid"],
                          "customer_url": customer["url"],
                          "kind": customer.get("kind","entity"),
                          "parent": customer.get("parent",""),
                          "role": customer.get("role",""),
                          "matched_name": sanctioned_norm[idx][1]["name"],
                          "matched_list": sanctioned_norm[idx][1]["list"],
                          "programme": sanctioned_norm[idx][1]["programme"],
                          "score": score
                      })
                      hit = True
                      break
                  elif score >= THRESHOLD:
                      potential_matches.append({
                          "customer": cname,
                          "customer_gid": customer["gid"],
                          "customer_url": customer["url"],
                          "kind": customer.get("kind","entity"),
                          "parent": customer.get("parent",""),
                          "role": customer.get("role",""),
                          "matched_name": sanctioned_norm[idx][1]["name"],
                          "matched_list": sanctioned_norm[idx][1]["list"],
                          "programme": sanctioned_norm[idx][1]["programme"],
                          "score": score
                      })
                      hit = True
                      break

              if not hit:
                  clear.append(cname)

          # ---- save results ----
          results_data = {
              "total": len(customers),
              "entity_count": sum(1 for c in customers if c.get("kind") != "individual"),
              "individual_count": sum(1 for c in customers if c.get("kind") == "individual"),
              "confirmed": confirmed_hits,
              "potential": potential_matches,
              "clear_count": len(clear),
              "uae_pdf_failed": os.environ.get("UAE_PDF_FAILED","false"),
              "unavailable_lists": _outages
          }
          with open("/tmp/results.json","w") as f:
              json.dump(results_data, f, ensure_ascii=False, indent=2)

          print(f"\n=== RESULTS ===")
          print(f"Total screened:    {len(customers)}")
          print(f"Confirmed hits:    {len(confirmed_hits)}")
          print(f"Potential matches: {len(potential_matches)}")
          print(f"Clear:             {len(clear)}")
          PYEOF


      # --------------------------------------------------------
      # STEP 6 — BUILD NARRATIVE AND CREATE ASANA TASK
      # --------------------------------------------------------
      - name: Create Asana screening task
        env:
          ASANA_PAT: ${{ secrets.ASANA_ACCESS_TOKEN || secrets.ASANA_PAT }}
          # Dedicated variable names: the shared vars.ASANA_PROJECT_GID was
          # repointed to the HAWKEYE STERLING APP project in the 1 July Asana
          # restructure, while this section lives in Sanctions/Media/PEP —
          # Monitoring — the mismatch made every task creation 400 ("Section
          # must be in project"). Defaults are the verified-correct pair:
          # project "Sanctions/Media/PEP - Monitoring" / section "Screening
          # Daily Report".
          ASANA_PROJECT_GID: ${{ vars.ASANA_SCREEN_PROJECT_GID || '1213914392047129' }}
          ASANA_SECTION_GID: ${{ vars.ASANA_SCREEN_SECTION_GID || '1213914392047131' }}
          ASANA_ASSIGNEE_GID: ${{ vars.ASANA_ASSIGNEE_GID || '1213645083721304' }}
          DATE_ISO: ${{ steps.date.outputs.DATE_ISO }}
          DATE_DISPLAY: ${{ steps.date.outputs.DATE_DISPLAY }}
          TIME_GST: ${{ steps.date.outputs.TIME_GST }}
          OFAC_HASH: ${{ env.OFAC_HASH }}
          UN_HASH: ${{ env.UN_HASH }}
          EU_HASH: ${{ env.EU_HASH }}
          UK_HASH: ${{ env.UK_HASH }}
          UAE_HASH: ${{ env.UAE_HASH }}
          UAE_PDF_FAILED: ${{ env.UAE_PDF_FAILED }}
          UAE_LIST_STALE: ${{ env.UAE_LIST_STALE }}
          UAE_LIST_REVIEW_AGE: ${{ env.UAE_LIST_REVIEW_AGE }}
          UAE_LIST_REVIEW_MAX: ${{ env.UAE_LIST_REVIEW_MAX }}
          SCRIPT_VERSION: "daily-sanctions-screen.yml v1"
        run: |
          python3 << 'PYEOF'
          import json, os, requests

          with open("/tmp/results.json") as f:
              results = json.load(f)

          date_iso    = os.environ["DATE_ISO"]
          date_disp   = os.environ["DATE_DISPLAY"]
          time_gst    = os.environ["TIME_GST"]
          ofac_hash   = os.environ.get("OFAC_HASH","N/A")
          un_hash     = os.environ.get("UN_HASH","N/A")
          eu_hash     = os.environ.get("EU_HASH","N/A")
          uk_hash     = os.environ.get("UK_HASH","N/A")
          uae_hash    = os.environ.get("UAE_HASH","N/A")
          uae_failed  = os.environ.get("UAE_PDF_FAILED","false") == "true"
          script_ver  = os.environ["SCRIPT_VERSION"]

          total       = results["total"]
          entity_count     = results.get("entity_count", total)
          individual_count = results.get("individual_count", 0)
          confirmed   = results["confirmed"]
          potential   = results["potential"]
          clear_count = results["clear_count"]
          refused     = results.get("refused") or ""
          unavailable = results.get("unavailable_lists") or []

          # ---- per-list status lines (refusal / outage aware) ----
          # The old report hardcoded "SCREENED" for every list, so a run that
          # proceeded DEGRADED (source outage) or was REFUSED (floor breach)
          # would still read as fully screened - a false audit statement.
          def _list_status(label, hashval):
              if refused:
                  return ("REFUSED - coverage floor breach, see banner above", "N/A")
              if label in unavailable:
                  return ("⚠️  UNAVAILABLE THIS RUN (source outage) - screening proceeded without this list", "N/A")
              return ("SCREENED", hashval)
          ofac_status, ofac_hash = _list_status("OFAC SDN", ofac_hash)
          un_status,   un_hash   = _list_status("UN Consolidated", un_hash)
          eu_status,   eu_hash   = _list_status("EU FSF", eu_hash)
          uk_status,   uk_hash   = _list_status("UK OFSI", uk_hash)

          # ---- UAE EOCN status line ----
          if refused:
              uae_b_status = "REFUSED - coverage floor breach, see banner above"
              uae_b_hash   = "N/A"
          elif uae_failed or "UAE EOCN" in unavailable:
              uae_b_status = "⚠️  EOCN LIST UNAVAILABLE — manual check required"
              uae_b_hash   = "N/A"
          else:
              uae_b_status = "SCREENED"
              uae_b_hash   = uae_hash

          # ---- in-repo EOCN list metadata (entry count + last review) ----
          try:
              with open("data/eocn-local-terrorist-list.json", encoding="utf-8") as _f:
                  _eocn_meta = json.load(_f)
              eocn_count = _eocn_meta.get("count") or len(_eocn_meta.get("entries", []))
              eocn_last_reviewed = _eocn_meta.get("lastReviewed", "see file")
          except Exception:
              eocn_count = "?"
              eocn_last_reviewed = "?"
          # Review-age gate flag set by the screening step: mark the report line
          # so the MLRO sees the lapsed review where the reconciliation date is.
          # UAE_LIST_REVIEW_AGE carries its own unit ("26d" or "unknown") and the
          # window comes from the configured EOCN_REVIEW_MAX_AGE_DAYS, so this
          # line never renders "unknownd" or a stale hardcoded "7d".
          if os.environ.get("UAE_LIST_STALE", "false") == "true":
              _rev_age = os.environ.get("UAE_LIST_REVIEW_AGE", "unknown")
              _rev_max = os.environ.get("UAE_LIST_REVIEW_MAX", "7")
              eocn_last_reviewed = f"{eocn_last_reviewed}  ⚠️ REVIEW OVERDUE (age {_rev_age}, max {_rev_max}d): re-verify against the official EOCN publication"

          # ---- confirmed hits section ----
          if refused:
              # Never render all-clear wording on a refused run: no results
              # were computed, so "no matches" would be a false statement.
              hits_text = ("SCREENING REFUSED - no match results were computed this run.\n"
                           + refused)
          elif not confirmed:
              hits_text = "No confirmed sanctions matches identified in this run.\nAll customers returned clear across all lists screened."
          else:
              lines = []
              for i, h in enumerate(confirmed, 1):
                  subj = h['customer'] + ("  [INDIVIDUAL — " + (h.get('role') or 'Principal') + " of " + h.get('parent','') + "]" if h.get('kind') == 'individual' else "  [LEGAL ENTITY]")
                  lines.append(
                      f"⛔ HIT {i}\n"
                      f"   Subject:         {subj}\n"
                      f"   Customer Record: {h['customer_url']}\n"
                      f"   Matched List:    {h['matched_list']}\n"
                      f"   Matched Entity:  {h['matched_name']}\n"
                      f"   Match Score:     {h['score']}%\n"
                      f"   Programme:       {h['programme']}\n"
                      f"   Action Required: IMMEDIATE ESCALATION TO MLRO\n"
                      f"                    Transaction freeze pending review.\n"
                      f"                    Do not tip off customer.\n"
                      f"                    Cabinet Resolution No. 74/2020 applies."
                  )
              hits_text = "\n\n".join(lines)

          # ---- potential matches section ----
          if refused:
              potential_text = "SCREENING REFUSED - no match results were computed this run."
          elif not potential:
              potential_text = "No potential matches requiring review in this run."
          else:
              lines = []
              for i, p in enumerate(potential, 1):
                  subj = p['customer'] + ("  [INDIVIDUAL — " + (p.get('role') or 'Principal') + " of " + p.get('parent','') + "]" if p.get('kind') == 'individual' else "  [LEGAL ENTITY]")
                  lines.append(
                      f"⚠️  POTENTIAL MATCH {i}\n"
                      f"   Subject:         {subj}\n"
                      f"   Customer Record: {p['customer_url']}\n"
                      f"   Matched List:    {p['matched_list']}\n"
                      f"   Matched Entity:  {p['matched_name']}\n"
                      f"   Match Score:     {p['score']}%\n"
                      f"   Reason Flagged:  Name similarity / transliteration variant\n"
                      f"   MLRO Decision\n"
                      f"   Required By:     Next business day\n"
                      f"   Decision:        ☐ False Positive — Clear\n"
                      f"                    ☐ True Match — Escalate\n"
                      f"                    ☐ Further Investigation Required"
                  )
              potential_text = "\n\n".join(lines)

          # ---- integrity banner (refusal / degraded run) ----
          if refused:
              banner = ("\n          ⛔ SCREENING REFUSED - COVERAGE FLOOR BREACH\n"
                        "          " + refused + "\n"
                        "          No screening results below are valid; the workflow run is failed red\n"
                        "          after this delivery. Fix the source data and re-run.\n")
          elif unavailable:
              banner = ("\n          ⚠️ DEGRADED RUN - SOURCE OUTAGE\n"
                        "          These core list(s) could not be obtained and were NOT screened this\n"
                        "          run: " + ", ".join(unavailable) + ".\n"
                        "          All other lists screened normally. The workflow run is failed red\n"
                        "          after this delivery so the outage is escalated, not routine.\n")
          else:
              banner = ""

          # ---- build full narrative ----
          narrative = f"""DAILY SANCTIONS SCREENING — AUTOMATED BATCH RUN
          ================================================
          {banner}
          Date:                {date_disp}
          Screening Time:      {time_gst} GST (UTC+4)
          Triggered By:        Automated — GitHub Actions
                               Workflow: {script_ver}
          Prepared By:         Compliance Automation — Hawkeye Sterling V2
          Reviewed By:         Compliance Department

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          REGULATORY BASIS
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          This screening is conducted in accordance with:

          — UAE Federal Decree-Law No. 26 of 2021 (AML/CFT Law)
          — UAE Cabinet Resolution No. 74 of 2020 (TFS Obligations)
          — UAE Federal Decree-Law No. 10 of 2025 (AML/CFT Amendments)
          — FATF Recommendation 6 (Targeted Financial Sanctions)
          — FATF Recommendation 10 (Customer Due Diligence)
          — MoE Due Diligence Regulations — DPMS Sector
          — Cabinet Resolution No. 156 of 2025 (CPF Obligations)

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          LISTS SCREENED
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          ✅ OFAC SDN — US Treasury / Office of Foreign Assets Control
             Source:    https://ofac.treasury.gov/
             File:      sdn.xml (official government download)
             File Hash: {ofac_hash}
             Status:    {ofac_status}

          ✅ UN Consolidated List — UN Security Council
             Source:    https://scsanctions.un.org/resources/xml/en/consolidated.xml
             File:      consolidated.xml (official UN download)
             File Hash: {un_hash}
             Status:    {un_status}

          ✅ EU Financial Sanctions — European Commission
             Source:    https://webgate.ec.europa.eu/fsd/fsf/public/files/
                        xmlFullSanctionsList_1_1/content
             File:      export_sanctions_en.xml (official EU download)
             File Hash: {eu_hash}
             Status:    {eu_status}

          ✅ UK OFSI Consolidated List — HM Treasury
             Source:    https://assets.publishing.service.gov.uk/
                        media/uk-sanctions-consolidated-list.csv
             File:      ConList.csv (official HM Treasury download)
             File Hash: {uk_hash}
             Status:    {uk_status}

          ℹ️ Switzerland SECO — Consolidated sanctions ("Gesamtliste")
             Source:    State Secretariat for Economic Affairs (SECO)
                        https://www.seco.admin.ch/en/searching-for-subjects-sanctions
             Status:    CROSS-REFERENCED — the great majority of SECO
                        designations mirror the UN and EU lists screened above.
                        A direct machine-readable feed is pending (the SECO portal
                        serves an HTML page, not raw XML), so the MLRO reconciles
                        against the official SECO publication periodically.

          ℹ️ Australia DFAT — Consolidated List (Regulation 8)
             Source:    Australian Sanctions Office / DFAT
                        https://www.dfat.gov.au/international-relations/security/sanctions/consolidated-list
             Status:    CROSS-REFERENCED — DFAT autonomous designations largely
                        overlap the UN / OFAC / EU lists screened above. The bulk
                        file is browser/bot-gated (no machine-readable fetch), so
                        the MLRO reconciles against the official DFAT download
                        periodically.

          ✅ UAE EOCN — Local Terrorist List (Executive Office / EOCN)
             Source:    UAE Executive Office for Control & Non-Proliferation
             Reference: data/eocn-local-terrorist-list.json (maintained in-repo —
                        EOCN publishes only a bot-protected PDF/Excel, no machine feed)
             Entries:   {eocn_count}
             File Hash: {uae_b_hash}
             Status:    {uae_b_status}

          ✅ UAE EOCN — Maintenance & Cross-Reference
             Method:    The in-repo EOCN list is screened directly; UN Consolidated
                        + OFAC SDN are screened in parallel as an additional
                        cross-reference for UAE-relevant designations.
             Mitigation: MLRO to reconcile the in-repo list against the official
                         EOCN publication (https://www.uaeiec.gov.ae) periodically.
             Last Reconciled:   {eocn_last_reviewed}

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          SCOPE
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          Subjects Screened:     {total} — FULL Customer Database
                                 ({entity_count} legal entities + {individual_count} principals/UBOs)
          Screening Type:        Fuzzy name matching + alias matching
          Match Threshold:       85% minimum similarity score
          Transliteration:       Arabic / Turkish / Latin variants included
          Entity Types:          Legal entities AND their associated individuals
                                 (every shareholder, director and UBO recorded
                                 in SECTION 4 of the customer assessment is
                                 screened in their own right, not just the company)

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          RESULTS SUMMARY
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          Total Subjects Screened:               {total}  ({entity_count} entities + {individual_count} principals/UBOs)
          Confirmed Hits:                        {len(confirmed)}
          Potential Matches — Pending Review:    {len(potential)}
          Clear — No Match:                      {clear_count}

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          CONFIRMED HITS
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          {hits_text}

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          POTENTIAL MATCHES — PENDING MLRO REVIEW
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          {potential_text}

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          METHODOLOGY
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          Screening is performed using fuzzy name matching against
          government-published sanctions list files downloaded
          directly from official sources at time of run. Match
          threshold set at 85% to balance sensitivity against
          false positive rate. Arabic, Turkish and Latin script
          transliteration variants are normalised prior to
          matching. Aliases and alternative names recorded in
          source lists are included in matching scope.

          This screening does not constitute legal advice. All
          potential matches and confirmed hits require human
          MLRO review and decision before any compliance action
          is taken. Automated output is a decision-support tool
          only, not a final determination.

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          AUDIT TRAIL
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          Script Version:           {script_ver}

          OFAC SDN File Hash:       {ofac_hash}
          UN Consolidated Hash:     {un_hash}
          EU FSF File Hash:         {eu_hash}
          UK OFSI File Hash:        {uk_hash}
          UAE EOCN List Hash:       {uae_b_hash}

          Customer List Source:     Asana — Customer Database
                                    Project GID: 1214107620220121
          Subjects at Time of Run:  {total} ({entity_count} entities + {individual_count} principals/UBOs)

          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          MLRO SIGN-OFF
          ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

          MLRO Review Completed:  ☐ Yes   ☐ No
          MLRO Name:              ___________________________
          Date of Review:         ___________________________
          Overall Decision:       ☐ All Clear — No Action
                                  ☐ False Positives Cleared
                                  ☐ Escalated to Senior Management
                                  ☐ STR / SAR Filed
                                  ☐ TFS Freeze Applied
          STR Reference (if any): ___________________________

          > RETENTION NOTICE: This record and all supporting
          > files must be retained for a minimum of 10 years
          > from the date of screening pursuant to UAE Federal
          > Decree-Law No. 26 of 2021, Article 23, and Cabinet
          > Resolution No. 74 of 2020."""

          # ---- create Asana task ----
          pat             = os.environ["ASANA_PAT"]
          project_gid     = os.environ["ASANA_PROJECT_GID"]
          section_gid     = os.environ["ASANA_SECTION_GID"]
          assignee_gid    = os.environ["ASANA_ASSIGNEE_GID"]
          headers         = {
              "Authorization": f"Bearer {pat}",
              "Content-Type": "application/json"
          }

          # Refusal/degraded runs must be unmistakable in the Asana list view,
          # not only inside the task body.
          if refused:
              task_name = f"⛔ {date_iso} — Daily Sanctions Screening - REFUSED (coverage floor)"
          elif unavailable:
              task_name = f"⚠️ {date_iso} — Daily Sanctions Screening - DEGRADED (source outage)"
          else:
              task_name = f"🔍 {date_iso} — Daily Sanctions Screening"

          payload = {
              "data": {
                  "name": task_name,
                  "notes": narrative,
                  "due_on": date_iso,
                  "assignee": assignee_gid,
                  "projects": [project_gid],
                  "memberships": [
                      {
                          "project": project_gid,
                          "section": section_gid
                      }
                  ]
              }
          }

          r = requests.post(
              "https://app.asana.com/api/1.0/tasks",
              headers=headers,
              json=payload
          )

          if r.status_code == 400 and "Section must be in project" in r.text:
              # Config drift (section GID not in the target project) must never
              # cost the delivery itself: create the task at project level —
              # it lands untriaged at the top of the project, which is visible,
              # not silent — and shout about the drift so it gets fixed.
              print("⚠️ SECTION CONFIG DRIFT — section "
                    f"{section_gid} is not in project {project_gid}; "
                    "creating the task without a section. Fix the "
                    "ASANA_SCREEN_SECTION_GID / ASANA_SCREEN_PROJECT_GID pair.")
              del payload["data"]["memberships"]
              r = requests.post(
                  "https://app.asana.com/api/1.0/tasks",
                  headers=headers,
                  json=payload
              )

          if r.status_code == 201:
              task_gid = r.json()["data"]["gid"]
              task_url = r.json()["data"]["permalink_url"]
              print(f"✅ Task created: {task_name}")
              print(f"   GID: {task_gid}")
              print(f"   URL: {task_url}")
          else:
              print(f"❌ Task creation failed — HTTP {r.status_code}")
              print(r.text)
              exit(1)

          # ---- post comment on each confirmed hit customer task ----
          for h in confirmed:
              comment = (
                  f"⛔ SANCTIONS HIT — {date_disp}\n\n"
                  f"This customer was flagged in the daily sanctions screening run.\n\n"
                  f"Matched List:   {h['matched_list']}\n"
                  f"Matched Entity: {h['matched_name']}\n"
                  f"Match Score:    {h['score']}%\n"
                  f"Programme:      {h['programme']}\n\n"
                  f"Action Required: IMMEDIATE ESCALATION TO MLRO\n"
                  f"Screening Record: {task_url}"
              )
              rc = requests.post(
                  f"https://app.asana.com/api/1.0/tasks/{h['customer_gid']}/stories",
                  headers=headers,
                  json={"data": {"text": comment}}
              )
              if rc.status_code == 201:
                  print(f"   Comment posted on: {h['customer']}")
              else:
                  print(f"   Comment failed on: {h['customer']} — {rc.status_code}")

          PYEOF


      # --------------------------------------------------------
      # STEP 7 — SUMMARY LOG
      # --------------------------------------------------------
      - name: Print summary
        if: always()
        # Step outputs passed via env (not interpolated into the shell) — keeps
        # zizmor's template-injection audit clean.
        env:
          DATE_DISPLAY: ${{ steps.date.outputs.DATE_DISPLAY }}
          TIME_GST: ${{ steps.date.outputs.TIME_GST }}
        run: |
          echo "=============================="
          echo "SCREENING COMPLETE"
          echo "Date: $DATE_DISPLAY"
          echo "Time: $TIME_GST GST"
          echo "=============================="
          if [ -f /tmp/results.json ]; then
            python3 -c "
          import json
          with open('/tmp/results.json') as f:
              r = json.load(f)
          print(f'Total screened:    {r[\"total\"]}')
          print(f'Confirmed hits:    {len(r[\"confirmed\"])}')
          print(f'Potential matches: {len(r[\"potential\"])}')
          print(f'Clear:             {r[\"clear_count\"]}')
          "
          fi

      # --------------------------------------------------------
      # STEP 8 — REVIEW-AGE GATE (fails the run AFTER delivery)
      # --------------------------------------------------------
      # Screening ran and the report was delivered above; a lapsed manual
      # review of the curated local terrorist list must still turn this run
      # red so it is escalated rather than quietly noted in the report body.
      - name: Fail if the local terrorist list review is overdue
        if: always() && env.UAE_LIST_STALE == 'true'
        env:
          AGE: ${{ env.UAE_LIST_REVIEW_AGE }}
          MAXD: ${{ env.UAE_LIST_REVIEW_MAX || '7' }}
        run: |
          # AGE carries its own unit ("26d" or "unknown"); MAXD is the
          # configured EOCN_REVIEW_MAX_AGE_DAYS window, not a hardcoded 7.
          echo "::error::UAE EOCN local list review is overdue (age: ${AGE}, max ${MAXD}d). Screening ran and delivered, but the curated list's manual review has lapsed. Re-verify data/eocn-local-terrorist-list.json against the official EOCN publication and update lastReviewed."
          exit 1

      # --------------------------------------------------------
      # STEP 9 — COVERAGE FLOOR GATE (fails the run AFTER delivery)
      # --------------------------------------------------------
      # A floor breach (corrupt/truncated source: results withheld, refusal
      # notice delivered) or a source outage (list not obtained: run screened
      # DEGRADED, report delivered) must still turn this job red so failure
      # alerting fires and the gap cannot become routine. FLOOR_GATE is set by
      # the screening step, which already honors LIST_FLOORS_ENFORCE=0.
      - name: Fail if a coverage floor was breached or a core list was unavailable
        if: always() && env.FLOOR_GATE == 'true'
        env:
          BREACH: ${{ env.FLOOR_BREACH_MSG }}
          OUTAGES: ${{ env.LIST_OUTAGES }}
        run: |
          if [ -n "$BREACH" ]; then
            echo "::error::$BREACH (the refusal notice was delivered to Asana before this failure)"
          fi
          if [ -n "$OUTAGES" ]; then
            echo "::error::Core list source outage: $OUTAGES. The run screened DEGRADED without them and the report was delivered before this failure."
          fi
          exit 1
