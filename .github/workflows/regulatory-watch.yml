name: Regulatory Watch

# Weekly worldwide (UAE-weighted) check of the regulatory sources in
# data/reg-sources.json (MoE, FIU, NAMLCFTC, EOCN, CBUAE, VARA, jewellery
# sector; FATF guidance, Wolfsberg, RMI, LBMA, OECD, OFAC, UN, EU, UK OFSI,
# Egmont, Basel). On any content change it opens a PULL REQUEST carrying the
# updated fingerprint state, a change report, and — if an ANTHROPIC_API_KEY
# secret is set — an AI-drafted update proposal for MLRO review.
#
# Detection is automatic; the regulator-grade wording change stays a reviewed
# decision (no auto-publish). Country black/grey LIST moves are handled by the
# separate FATF Watchdog workflow.
#
# First-time setup: run once via "Run workflow" with mode = seed to record the
# current fingerprints without raising a PR. Thereafter the weekly run flags
# only genuine changes.

on:
  schedule:
    - cron: '0 6 * * 1'   # 06:00 UTC every Monday
  workflow_dispatch:
    inputs:
      mode:
        description: 'check (compare + open PR on change) | seed (record baseline fingerprints, open a baseline PR)'
        default: 'check'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: regulatory-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run regulatory watch
        id: watch
        run: node scripts/reg-watch.mjs "${{ inputs.mode || 'check' }}"

      - name: AI draft (optional — only if ANTHROPIC_API_KEY is set)
        if: steps.watch.outputs.has_changes == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/reg-draft.mjs

      - name: Open pull request with detected changes
        id: pr
        # Don't fail the run if the repo forbids Actions from creating PRs
        # (Settings -> Actions -> General -> Workflow permissions). The branch is
        # still pushed; the fallback step below opens an issue with the link.
        continue-on-error: true
        if: steps.watch.outputs.has_changes == 'true' || inputs.mode == 'seed'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: regulatory-watch/update
          base: main
          # No add-paths: commit every non-ignored change (the fingerprint state
          # and any AI draft under docs/research/auto). The per-run artifacts
          # reg-watch-report.md and reg-watch-changes.json are gitignored, so
          # they are never committed; the report is used only as the PR body.
          commit-message: ${{ steps.watch.outputs.pr_title }}
          title: ${{ steps.watch.outputs.pr_title }}
          body-path: reg-watch-report.md
          labels: regulatory-watch
          delete-branch: true

      - name: Fallback to an issue if PR creation is blocked
        if: (steps.watch.outputs.has_changes == 'true' || inputs.mode == 'seed') && steps.pr.outcome == 'failure'
        uses: actions/github-script@v9
        env:
          PR_TITLE: ${{ steps.watch.outputs.pr_title }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('reg-watch-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const link = `https://github.com/${owner}/${repo}/pull/new/regulatory-watch/update`;
            const body = report + [
              '', '---',
              '> Automated pull-request creation is disabled for this repository, so this issue was opened instead.',
              '> The change branch `regulatory-watch/update` has already been pushed.',
              `> **Open the PR:** ${link}`,
              '> To get PRs automatically, enable *Settings -> Actions -> General -> Workflow permissions -> "Allow GitHub Actions to create and approve pull requests"*.',
            ].join('\n');
            await github.rest.issues.create({
              owner, repo,
              title: process.env.PR_TITLE || 'Regulatory Watch - changes detected',
              body,
              labels: ['regulatory-watch'],
            });
