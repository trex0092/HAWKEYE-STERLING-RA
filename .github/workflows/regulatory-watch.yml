name: Regulatory Watch

# Weekly worldwide (UAE-weighted) check of the regulatory sources in
# data/reg-sources.json (MoE, FIU, NAMLCFTC, EOCN, CBUAE, VARA, jewellery
# sector; FATF guidance, Wolfsberg, RMI, LBMA, OECD, OFAC, UN, EU, UK OFSI,
# Egmont, Basel, UNODC, EU high-risk third countries, RJC). On any content
# change it creates a task in the "Ongoing Monitoring" Asana
# project, persists the refreshed fingerprint state to the reg-watch-state
# branch (branch protection blocks direct pushes to main; the state branch is
# rebuilt as <main> + one data commit each run, so the same change is not
# re-alerted), and — if an ANTHROPIC_API_KEY secret is set — drafts an
# AI update proposal. If Asana delivery fails (no token / API error) it falls
# back to a labelled GitHub issue so a change is never lost.
#
# Detection is automatic; the regulator-grade wording change stays a reviewed
# decision (no auto-publish). Country black/grey LIST moves are handled by the
# separate FATF Watchdog workflow.
#
# Needs the ASANA_ACCESS_TOKEN repository secret to route alerts to Asana.
# First-time setup: run once via "Run workflow" with mode = seed to record the
# current fingerprints without raising alerts.

on:
  schedule:
    - cron: '19 6 * * *'   # 06:19 UTC daily (odd minute)
  workflow_dispatch:
    inputs:
      mode:
        description: 'check (compare + alert on change) | seed (record baseline fingerprints, no alert)'
        default: 'check'

permissions:
  contents: write
  issues: write

concurrency:
  group: regulatory-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # bound external regulator-source fetches
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          disable-sudo: true
          # contents:write job fetching external content — block egress to the fixed
          # source list (every host in data/reg-sources.json) + Anthropic (AI draft)
          # + Asana + GitHub/node infra. A host missed here fails SAFE and LOUD:
          # reg-watch records that source as status:error in the daily report (with
          # recovered-state suppression), it never silently drops a change.
          egress-policy: block
          # The list must include every REDIRECT TARGET too, not just the
          # registry hostnames: www.moec.gov.ae → www.moet.gov.ae,
          # www.uaefiu.gov.ae → uaefiu.gov.ae, www.namlcftc.gov.ae →
          # namlcftc.gov.ae, www.dmcc.ae → dmcc.ae, www.wolfsberg-principles.com
          # → wolfsberg-group.org, www.un.org → main.un.org (all verified from
          # the 2026-07-01 audit-mode egress log). Blocking a redirect hop
          # starves that source of every snapshot while the run stays green.
          # archive.org + web.archive.org serve the Wayback fallback for
          # sources whose bot protection 403/418s the runner directly.
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            app.asana.com:443
            api.anthropic.com:443
            archive.org:443
            web.archive.org:443
            www.moec.gov.ae:443
            rulebook.centralbank.ae:443
            www.oecd.org:443
            oecd.org:443
            www.moet.gov.ae:443
            moet.gov.ae:443
            www.uaefiu.gov.ae:443
            uaefiu.gov.ae:443
            www.namlcftc.gov.ae:443
            namlcftc.gov.ae:443
            www.uaeiec.gov.ae:443
            uaeiec.gov.ae:443
            www.centralbank.ae:443
            centralbank.ae:443
            www.vara.ae:443
            vara.ae:443
            www.dmcc.ae:443
            dmcc.ae:443
            www.fatf-gafi.org:443
            fatf-gafi.org:443
            www.wolfsberg-principles.com:443
            wolfsberg-group.org:443
            www.wolfsberg-group.org:443
            www.responsiblemineralsinitiative.org:443
            www.responsiblejewellery.com:443
            www.lbma.org.uk:443
            mneguidelines.oecd.org:443
            ofac.treasury.gov:443
            www.un.org:443
            main.un.org:443
            www.unodc.org:443
            finance.ec.europa.eu:443
            www.gov.uk:443
            egmontgroup.org:443
            www.egmontgroup.org:443
            index.baselgovernance.org:443
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Overlay latest watcher state (lives on the reg-watch-state branch)
        run: |
          # Branch protection blocks direct pushes to main (GH006), so the
          # fingerprint state and AI drafts persist on a dedicated data branch.
          # Overlay the newest copies before checking; without this, every run
          # would re-diff against stale state and re-alert the same changes.
          if git fetch origin reg-watch-state --depth=1 2>/dev/null; then
            git checkout FETCH_HEAD -- data/reg-watch-state.json 2>/dev/null || true
            git checkout FETCH_HEAD -- data/reg-watch-snapshots 2>/dev/null || true
            git checkout FETCH_HEAD -- docs/research/auto 2>/dev/null || true
            echo "state overlaid from reg-watch-state"
          else
            echo "no reg-watch-state branch yet — using state from main"
          fi

      - name: Run regulatory watch
        id: watch
        env:
          MODE: ${{ inputs.mode || 'check' }}
          # Optional archive.org API key ("accesskey:secret" from
          # https://archive.org/account/s3.php). When set, bot-blocked sources
          # are captured via authenticated Save Page Now — a real quota instead
          # of the anonymous per-IP lottery that 429s shared runners.
          ARCHIVE_SPN_KEYS: ${{ secrets.ARCHIVE_SPN_KEYS }}
        run: node scripts/reg-watch.mjs "$MODE"

      - name: AI draft (optional — only if ANTHROPIC_API_KEY is set)
        if: steps.watch.outputs.has_changes == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARCHIVE_SPN_KEYS: ${{ secrets.ARCHIVE_SPN_KEYS }}
        run: node scripts/reg-draft.mjs

      - name: Notify Asana — Ongoing Monitoring project
        id: asana
        # Don't fail the run if Asana is unreachable; the issue fallback covers it.
        continue-on-error: true
        if: steps.watch.outputs.has_changes == 'true' || inputs.mode == 'seed'
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          ASANA_REG_PROJECT_GID: ${{ vars.ASANA_REG_PROJECT_GID }}
          # "Regulatory changes" section of the Ongoing Monitoring project
          ASANA_SECTION_GID: ${{ vars.ASANA_REG_SECTION_GID || '1216203873114460' }}
          # Step output crosses into the shell via env (never inline ${{ }} in run:),
          # so a hostile character in a generated title can never become shell syntax.
          PR_TITLE: ${{ steps.watch.outputs.pr_title }}
        run: node scripts/watch-notify.mjs "$PR_TITLE" reg-watch-report.md reg-watch-changes.json

      - name: Persist refreshed fingerprint state (reg-watch-state branch)
        # state_dirty covers runs with no content change but a material state
        # move (e.g. a source's error streak advanced) — without committing
        # those, persistent-failure tracking would reset every run.
        if: steps.watch.outputs.has_changes == 'true' || steps.watch.outputs.state_dirty == 'true' || inputs.mode == 'seed'
        env:
          PR_TITLE: ${{ steps.watch.outputs.pr_title }}
        run: |
          # The per-run artifacts (reg-watch-report.md / reg-watch-changes.json)
          # are gitignored; this persists the fingerprint state and any AI draft
          # so the same change is not re-alerted next run. Branch protection
          # blocks direct pushes to main (GH006 — verified in run 28922304236),
          # so the data lives on the reg-watch-state branch: always rebuilt as
          # <current main> + one data commit, force-updated each run.
          if [ -n "$(git status --porcelain data/ docs/research/auto 2>/dev/null)" ]; then
            git config user.name "regulatory-watch"
            git config user.email "actions@github.com"
            git add data/reg-watch-state.json
            git add data/reg-watch-snapshots 2>/dev/null || true
            git add docs/research/auto 2>/dev/null || true
            git commit -m "$PR_TITLE [skip ci]"
            for attempt in 1 2 3 4 5; do
              git push --force origin HEAD:refs/heads/reg-watch-state && break
              echo "push failed (attempt $attempt) — retrying"
              sleep $((attempt * 3))
            done
          else
            echo "state unchanged"
          fi

      - name: Fallback to a GitHub issue if Asana delivery failed
        if: (steps.watch.outputs.has_changes == 'true' || inputs.mode == 'seed') && steps.asana.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_TITLE: ${{ steps.watch.outputs.pr_title }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('reg-watch-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const body = report + [
              '', '---',
              '> This change could not be delivered to the Asana "Ongoing Monitoring" project',
              '> (no `ASANA_ACCESS_TOKEN` repository secret, or the Asana API call failed), so this issue was opened instead.',
              '> Set the `ASANA_ACCESS_TOKEN` secret to route future changes to Asana automatically.',
            ].join('\n');
            await github.rest.issues.create({
              owner, repo,
              title: process.env.PR_TITLE || 'Regulatory Watch - changes detected',
              body,
              labels: ['regulatory-watch'],
            });
