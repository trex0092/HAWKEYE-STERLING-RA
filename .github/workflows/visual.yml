name: Visual Regression

# Playwright screenshot diff of the three screens.
#   - First time / after intended UI changes: run with mode = baseline to
#     generate and commit the baseline snapshots (PR, or issue fallback).
#   - On pull requests: compares against the committed baseline (NON-blocking;
#     the HTML report is uploaded as an artifact so you can inspect diffs).
#
# Least privilege: the everyday `compare` job (push/PR) is read-only; only the
# explicit `baseline` dispatch path carries the write scopes it needs to open
# the refresh PR / fallback issue.

on:
  push:
    branches: [main]
    paths: ['index.html', 'console.html', 'advisor.html', 'app.js', 'console.js', 'advisor.js', 'i18n.js', 'app.css', 'console.css', 'advisor.css', 'fonts.css', 'assets/**', 'test/visual.spec.mjs', 'playwright.config.mjs']
  pull_request:
    paths: ['index.html', 'console.html', 'advisor.html', 'app.js', 'console.js', 'advisor.js', 'i18n.js', 'app.css', 'console.css', 'advisor.css', 'fonts.css', 'assets/**', 'test/visual.spec.mjs', 'playwright.config.mjs']
  workflow_dispatch:
    inputs:
      mode:
        description: 'compare (default) | baseline (update + commit snapshots)'
        default: 'compare'

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  compare:
    if: inputs.mode != 'baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Install Playwright + Chromium
        # Local install so the `import '@playwright/test'` in the config/spec
        # resolves (the repo has no package.json). node_modules is gitignored.
        run: |
          npm install @playwright/test@1.49.1
          npx playwright install --with-deps chromium

      - name: Compare against baseline
        continue-on-error: true
        run: npx playwright test --config=playwright.config.mjs

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  baseline:
    if: inputs.mode == 'baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false   # no git push here (create-pull-request uses the token directly)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Install Playwright + Chromium
        run: |
          npm install @playwright/test@1.49.1
          npx playwright install --with-deps chromium

      - name: Update baseline snapshots
        run: npx playwright test --config=playwright.config.mjs --update-snapshots

      - name: Open PR with refreshed baseline
        id: pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: visual/baseline
          base: main
          add-paths: test/__screenshots__/**
          commit-message: 'Visual regression: refresh baseline snapshots'
          title: 'Visual regression: refresh baseline snapshots'
          body: 'Auto-generated baseline screenshots for index/console/advisor. Review the images, then merge.'
          labels: visual-regression
          delete-branch: true

      - name: Fallback note if PR creation is blocked
        if: steps.pr.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = 'Visual regression: baseline ready to open';
            const body = `Baseline snapshots were pushed to branch \`visual/baseline\`. Open the PR: https://github.com/${owner}/${repo}/pull/new/visual/baseline`;
            // Idempotent: reuse an already-open fallback issue instead of piling up duplicates.
            const existing = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'visual-regression', per_page: 100,
            });
            const open = existing.data.find(i => !i.pull_request && i.title === title);
            if (open) {
              core.info(`Fallback issue already open: #${open.number} — not creating a duplicate.`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body, labels: ['visual-regression'] });
              core.info(`Opened fallback issue #${created.data.number}.`);
            }
