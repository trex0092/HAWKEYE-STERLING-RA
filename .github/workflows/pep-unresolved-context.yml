name: Temporary PEP source verification
on:
  push:
    branches: [ops/diagnostic-only-not-for-merge-20260929]
    paths: [.github/workflows/pep-unresolved-context.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        # Two public Wikidata reads using the verified retry helper, no data mutation.
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443 api.github.com:443 codeload.github.com:443
            objects.githubusercontent.com:443 nodejs.org:443 www.wikidata.org:443 *.githubapp.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 70a2b63f3d1234ac4d941d2a6e0fddc58cd6f05b
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Read names and removal provenance
        run: |
          node --input-type=module <<'NODE'
          import { fetchJson } from './scripts/pep-worldwide.mjs';
          import { appendFileSync } from 'node:fs';
          const ids = ['Q58316593','Q58316598','Q58316599','Q58334883','Q136689291','Q136689343','Q136689373'];
          const api = params => {
            const url = new URL('https://www.wikidata.org/w/api.php');
            url.search = new URLSearchParams({ format: 'json', formatversion: '2', maxlag: '5', ...params });
            return fetchJson(url.href, { tries: 3 });
          };
          const current = await api({ action: 'wbgetentities', ids: ids.join('|'), props: 'info|labels|aliases|claims|sitelinks', redirects: 'yes' });
          const rows = Object.entries(current.entities || {}).map(([key,e]) => ({
            key, id: e.id, missing: e.missing, lastrevid: e.lastrevid, labels: e.labels, aliases: e.aliases,
            names: Object.fromEntries(['P1477','P1559','P2561','P735','P734'].filter(p => e.claims?.[p]).map(p => [p,e.claims[p]])),
            offices: e.claims?.P39, sitelinks: e.sitelinks,
          }));
          console.log('CURRENT_SOURCE_IDENTITIES ' + JSON.stringify({ redirects: current.redirects, rows }));
          const revisions = await api({ action: 'query', titles: ids.join('|'), prop: 'revisions', rvprop: 'ids|timestamp|comment' });
          console.log('LATEST_SOURCE_REVISIONS ' + JSON.stringify(revisions.query?.pages));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, '```json\n' + JSON.stringify({ rows, revisions: revisions.query?.pages }, null, 2) + '\n```\n');
          NODE
