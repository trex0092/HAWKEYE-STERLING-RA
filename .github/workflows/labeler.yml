name: Labeler

# Auto-labels pull requests by changed paths (.github/labeler.yml) and by size.
#
# Safe use of pull_request_target: neither job checks out or executes PR code —
# path-labels uses actions/labeler (no checkout), size-label only reads PR
# metadata (additions/deletions/labels) via the API. Do NOT add a checkout of
# the PR head ref to this workflow.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]

# Least privilege: no token scope at the top level; each job widens to only what
# it needs (both need pull-requests: write; path-labels also reads content).
permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  path-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
        with:
          sync-labels: true

  size-label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const n = (pr.additions || 0) + (pr.deletions || 0);
            const size = n < 10 ? 'size/XS' : n < 50 ? 'size/S' : n < 250 ? 'size/M' : n < 1000 ? 'size/L' : 'size/XL';
            const { owner, repo } = context.repo;
            const all = ['size/XS','size/S','size/M','size/L','size/XL'];
            const current = (pr.labels || []).map(l => l.name);
            for (const l of all) {
              if (l !== size && current.includes(l)) {
                try { await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: l }); } catch {}
              }
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [size] });
