name: Labeler

# Auto-labels pull requests by changed paths (.github/labeler.yml) and by size.

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  path-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true

  size-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const n = (pr.additions || 0) + (pr.deletions || 0);
            const size = n < 10 ? 'size/XS' : n < 50 ? 'size/S' : n < 250 ? 'size/M' : n < 1000 ? 'size/L' : 'size/XL';
            const { owner, repo } = context.repo;
            const all = ['size/XS','size/S','size/M','size/L','size/XL'];
            const current = (pr.labels || []).map(l => l.name);
            for (const l of all) {
              if (l !== size && current.includes(l)) {
                try { await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: l }); } catch {}
              }
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [size] });
