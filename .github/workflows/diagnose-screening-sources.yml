name: PEP source reference diagnostics, not assurance
on:
  push:
    branches: ['diagnostics/screening-sources-20261021']
    paths: ['.github/workflows/diagnose-screening-sources.yml']
permissions:
  contents: read
concurrency:
  group: screening-source-diagnostic-20261021
  cancel-in-progress: false
jobs:
  inspect-pep-references:
    if: github.repository == 'trex0092/HAWKEYE-STERLING-RA'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden read-only diagnostic runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443 api.github.com:443 codeload.github.com:443
            objects.githubusercontent.com:443 raw.githubusercontent.com:443
            nodejs.org:443 *.githubapp.com:443 www.wikidata.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - name: Inspect explicit source references for the eight existing public identity exceptions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { namesFromEntity } from './scripts/pep-worldwide.mjs';
          const qids = ['Q136689291', 'Q136689343', 'Q136689373', 'Q138161351',
            'Q58316593', 'Q58316598', 'Q58316599', 'Q58334883'];
          const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function request(params) {
            const u = new URL('https://www.wikidata.org/w/api.php');
            u.search = new URLSearchParams({ format: 'json', maxlag: '5', ...params });
            const response = await fetch(u, { redirect: 'error', signal: AbortSignal.timeout(45000), headers: {
              'user-agent': 'HawkeyeSterling-PEPReferenceDiagnostic/1.0 (https://github.com/trex0092/HAWKEYE-STERLING-RA)',
              accept: 'application/json'
            } });
            if (!response.ok) throw new Error('Source HTTP ' + response.status + '; no automatic retry');
            let bytes = 0; const chunks = [];
            for await (const chunk of response.body) {
              bytes += chunk.length;
              if (bytes > 2000000) throw new Error('Response byte budget exceeded');
              chunks.push(chunk);
            }
            const data = JSON.parse(Buffer.concat(chunks).toString('utf8'));
            if (data.error || data.errors) throw new Error('Source API error; no completeness claim');
            return data;
          }
          const data = await request({ action: 'wbgetentities', props: 'info|labels|aliases|descriptions|sitelinks|claims',
            redirects: 'yes', ids: qids.join('|') });
          const redirects = new Map((data.redirects || []).map(r => [r.from, r.to]));
          const values = snaks => Object.fromEntries(Object.entries(snaks || {}).map(([prop, list]) =>
            [prop, list.map(s => ({ type: s.snaktype, value: s.datavalue?.value ?? null }))]));
          for (const qid of qids) {
            const entity = data.entities?.[redirects.get(qid) || qid];
            if (!entity) throw new Error('Requested public QID not returned');
            const claims = Object.fromEntries(Object.entries(entity.claims || {}).map(([prop, list]) =>
              [prop, list.map(s => ({ rank: s.rank, value: s.mainsnak?.datavalue?.value ?? null,
                qualifiers: values(s.qualifiers), references: (s.references || []).map(r => values(r.snaks)) }))]));
            console.log('PUBLIC_PEP_SOURCE ' + JSON.stringify({ qid, checkedAt: new Date().toISOString(),
              revision: entity.lastrevid || null, modified: entity.modified || null,
              parsedNameAvailable: !!namesFromEntity(entity).name,
              descriptions: Object.values(entity.descriptions || {}).map(x => x.value).slice(0, 10), claims }));
            await pause(1500);
            const history = await request({ action: 'query', prop: 'revisions', titles: qid,
              rvprop: 'ids|timestamp|comment', rvlimit: '3' });
            const pages = Object.values(history.query?.pages || {});
            console.log('PUBLIC_PEP_HISTORY ' + JSON.stringify({ qid,
              revisions: pages.flatMap(p => p.revisions || []).map(r => ({ id: r.revid, parent: r.parentid,
                timestamp: r.timestamp, comment: String(r.comment || '').slice(0, 400) })) }));
          }
          console.log('DIAGNOSTIC_ONLY: Public source references inspected. No customer queries, source edits, PEP identities, assurance artifacts, case dispositions or screening policies changed.');
          NODE

  google-news-rss-probe:
    if: github.repository == 'trex0092/HAWKEYE-STERLING-RA'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Restrict network access to Google News and GitHub
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443 api.github.com:443 codeload.github.com:443
            objects.githubusercontent.com:443 raw.githubusercontent.com:443
            nodejs.org:443 *.githubapp.com:443 news.google.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - name: Compare simple and production-shaped Google News RSS responses
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { adverseMediaUrlFor, LOCALES, parseRss } from './scripts/adverse-media.mjs';
          const name = 'Hawkeye Synthetic Diagnostic';
          const en = LOCALES.find(x => x.id === 'en-US');
          const ar = LOCALES.find(x => x.id === 'ar-AE');
          if (!en || !ar) throw new Error('The audited core Google News locales are missing');
          const simple = 'https://news.google.com/rss/search?q='
            + encodeURIComponent('"' + name + '"') + '&hl=en-US&gl=US&ceid=US:en';
          const probes = [
            ['simple-en-US', simple],
            ['production-en-US', adverseMediaUrlFor(name, en)],
            ['production-ar-AE', adverseMediaUrlFor(name, ar)]
          ];
          let failed = 0;
          for (let i = 0; i < probes.length; i++) {
            if (i) await new Promise(resolve => setTimeout(resolve, 5000));
            const [label, url] = probes[i];
            const output = { label, urlLength: url.length, queriedAt: new Date().toISOString(),
              status: 0, validRss: false, articles: null, bytes: 0, error: null };
            try {
              const res = await fetch(url, {
                redirect: 'follow', signal: AbortSignal.timeout(20000),
                headers: { 'user-agent': 'HawkeyeSterling-AdverseMedia/1.0',
                  Accept: 'application/rss+xml, application/xml, text/xml' }
              });
              output.status = res.status;
              output.contentType = res.headers.get('content-type');
              output.retryAfter = res.headers.get('retry-after');
              if (res.ok) {
                let bytes = 0;
                const chunks = [];
                for await (const chunk of res.body) {
                  bytes += chunk.length;
                  if (bytes > 750000) throw new Error('feed exceeds diagnostic byte limit');
                  chunks.push(chunk);
                }
                output.bytes = bytes;
                const items = parseRss(Buffer.concat(chunks).toString('utf8'));
                output.validRss = Array.isArray(items);
                output.articles = output.validRss ? items.length : null;
              }
            } catch (e) {
              output.error = String(e?.name || 'request error').slice(0, 80);
            }
            console.log('GOOGLE_NEWS_DIAGNOSTIC ' + JSON.stringify(output));
            if (output.status !== 200 || !output.validRss) failed++;
          }
          // A few well-spaced, unique synthetic production queries exercise a
          // sequence of real RSS responses, not just one cached successful 200.
          // No live subject data, no automatic retries after a rate limit.
          let steadyPass = 0;
          let steadyFail = 0;
          for (let i = 0; i < 12; i++) {
            await new Promise(resolve => setTimeout(resolve, 3000));
            const url = adverseMediaUrlFor(name + ' Probe ' + (i + 1), en);
            let state = { request: i + 1, status: 0, validRss: false };
            try {
              const response = await fetch(url, {
                redirect: 'follow', signal: AbortSignal.timeout(15000),
                headers: { 'user-agent': 'HawkeyeSterling-AdverseMedia/1.0',
                  Accept: 'application/rss+xml, application/xml, text/xml' }
              });
              state.status = response.status;
              if (response.ok) {
                const text = await response.text();
                if (text.length > 750000) throw new Error('excessive response');
                state.validRss = Array.isArray(parseRss(text));
              }
            } catch (error) {
              state.error = String(error?.name || 'transport error').slice(0, 50);
            }
            console.log('GOOGLE_NEWS_STEADY ' + JSON.stringify(state));
            if (state.status === 200 && state.validRss) steadyPass++;
            else {
              steadyFail++;
              // Stop at first refusal. The probe must not make IP throttling worse.
              break;
            }
          }
          console.log('GOOGLE_NEWS_STEADY_SUMMARY ' + JSON.stringify({
            succeeded: steadyPass, failed: steadyFail, planned: 12, spacingMs: 3000
          }));
          if (steadyFail || steadyPass !== 12) failed++;
          console.log('DIAGNOSTIC_ONLY: No real subject names, screening outputs, source-quality badges or customer records read or changed.');
          if (failed) {
            console.error('GOOGLE_NEWS_DIAGNOSTIC_INCOMPLETE: ' + failed + ' of ' + probes.length + ' probes not verified');
            process.exitCode = 1;
          }
          NODE
