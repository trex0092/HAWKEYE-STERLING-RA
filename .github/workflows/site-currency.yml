name: Site Currency (live deploy vs main)

# Closes the gap the 27 Jun - 25 Jul incident exposed: Netlify production
# deploys silently stopped publishing and the live site served a month-old
# bundle, while Site Health stayed green (the OLD deploy still rendered) and
# nothing compared what production SERVES against what main SHIPS. This probe
# does exactly that comparison daily: the APP_VERSION served by the live
# site's app.js versus the APP_VERSION at HEAD of main.
#
# Self-arming: while the live site still serves the pre-app.js-split bundle
# (the already-reported 27 Jun outage, awaiting the one-time Netlify re-link /
# build-hook setup), the probe annotates a warning and stays green — that
# outage is known, ticketed, and cannot be fixed from CI. From the first
# modern publish onward, any future drift older than the grace window turns
# the run red and files an Asana alert, so production can never again fall
# silently behind main.

on:
  schedule:
    - cron: '7 8 * * *'   # 08:07 UTC daily — after the morning controls, before freshness (~11:07)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-currency
  cancel-in-progress: false

env:
  LIVE_ORIGIN: https://hawkeye-sterling-ra.netlify.app
  GRACE_SECONDS: '86400'   # a version bumped on main within the last day is deploy lag, not drift

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            hawkeye-sterling-ra.netlify.app:443
            app.asana.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # git log -S dates the current APP_VERSION for the grace window

      - name: Compare live APP_VERSION with main
        run: |
          set -u
          repo_ver=$(grep -oE "const APP_VERSION = '[0-9.]+'" app.js | grep -oE "[0-9.]+")
          if [ -z "$repo_ver" ]; then
            echo "::error::could not read APP_VERSION from app.js at HEAD — probe needs updating"
            exit 1
          fi
          live_ver=$(curl -sSL --max-time 30 "$LIVE_ORIGIN/app.js" | grep -oE "APP_VERSION = '[0-9.]+'" | grep -oE "[0-9.]+" | head -1 || true)
          if [ -z "$live_ver" ]; then
            # Pre-app.js-split bundle: the known 27 Jun production-deploy outage.
            # Known, reported, and only fixable via the one-time Netlify UI step
            # (re-link the repository, or create a main build hook and save it as
            # the NETLIFY_BUILD_HOOK_URL secret for netlify-production-deploy.yml).
            echo "::warning::live site still serves the pre-app.js-split bundle (production deploys stopped 27 Jun). This probe arms automatically after the first modern publish."
            echo "repo main: $repo_ver | live: <pre-split bundle>"
            exit 0
          fi
          echo "repo main: $repo_ver | live: $live_ver"
          if [ "$live_ver" = "$repo_ver" ]; then
            echo "CURRENT — production serves the version at HEAD of main"
            exit 0
          fi
          bumped_at=$(git log -1 --format=%ct -S "const APP_VERSION = '$repo_ver'" -- app.js || echo "")
          now=$(date -u +%s)
          age=$(( now - ${bumped_at:-now} ))
          if [ "$age" -le "$GRACE_SECONDS" ]; then
            echo "LAG — main moved to $repo_ver ${age}s ago (grace ${GRACE_SECONDS}s); deploy expected shortly"
            exit 0
          fi
          echo "::error::PRODUCTION DRIFT — live serves $live_ver but main has shipped $repo_ver for ${age}s (> ${GRACE_SECONDS}s grace). Production deploys have stopped publishing again: check the Netlify deploy log / run netlify-production-deploy.yml."
          exit 1

      - name: Alert in Asana on production drift
        if: failure()
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/asana-alert.mjs \
            "PRODUCTION DRIFT: the live site is serving an older build than main" \
            "The Site Currency probe found the deployed site's APP_VERSION behind main beyond the grace window — production deploys have stopped publishing (as happened silently from 27 Jun to 25 Jul). Re-run the Netlify Production Deploy workflow (needs the NETLIFY_BUILD_HOOK_URL secret) or check the Netlify project's deploy log: $RUN_URL"
