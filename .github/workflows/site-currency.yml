name: Site Currency (live deploy vs main)

# Closes the gap the 27 Jun - 25 Jul incident exposed: Netlify production
# deploys silently stopped publishing and the live site served a month-old
# bundle, while Site Health stayed green (the OLD deploy still rendered) and
# nothing compared what production SERVES against what main SHIPS.
#
# THIS PROBE ITSELF FAILED THAT WAY ON 30 JUL 2026. It compared the live
# site's APP_VERSION with the one at HEAD of main, found 3.7.2 on both sides
# and reported
#
#     CURRENT - production serves the version at HEAD of main
#
# while production was serving commit 403f091f (PR #338) and main had moved
# 31 commits past it: PRs #339-#369 - every screening hardening, the advisor
# error hints and the console staleness alert - had never reached the live
# site. The probe was not wrong about what it measured. APP_VERSION is a
# hand-maintained string that had not moved since 16 Jul, so the check passed
# by comparing a constant with itself. Its second escape hatch had rotted the
# same way: the "pre-app.js-split bundle" branch that annotated a warning and
# stayed green could no longer fire, because the stale deploy does serve an
# app.js. Both success criteria were true-once and had become unconditional.
#
# It now compares CONTENT. netlify.toml publishes the repo root with no build
# step, so every served asset is a checked-in file byte-for-byte: hashing them
# is an exact test of "is production serving this commit?", and any merge that
# changes what the site serves necessarily changes a hash. Nothing has to be
# remembered, and there is no branch that can pass without evidence - a site
# that cannot be read is reported UNVERIFIABLE and fails, because an unread
# site is not a current site. See scripts/site-currency.mjs.

on:
  schedule:
    - cron: '7 8 * * *'   # 08:07 UTC daily — after the morning controls, before freshness (~11:07)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-currency
  cancel-in-progress: false

env:
  LIVE_ORIGIN: https://hawkeye-sterling-ra.netlify.app
  GRACE_SECONDS: '86400'   # a version bumped on main within the last day is deploy lag, not drift

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            hawkeye-sterling-ra.netlify.app:443
            app.asana.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # git log dates each divergent asset for the grace window

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Compare every served asset with main
        run: node scripts/site-currency.mjs

      - name: Alert in Asana on production drift
        if: failure()
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/asana-alert.mjs \
            "PRODUCTION DRIFT: the live site is serving an older build than main" \
            "The Site Currency probe hashed every asset production serves and found them diverging from main beyond the grace window — deploys are not publishing, so merged fixes are NOT live for users (this is how PRs #339-#369 sat undeployed for a month behind a probe that reported CURRENT). The run log names each stale asset. Fix: re-link the repository under Netlify -> Build & deploy -> Continuous deployment, or create a main build hook and save it as the NETLIFY_BUILD_HOOK_URL secret so netlify-production-deploy.yml can publish. $RUN_URL"
