name: Runtime gap evidence

on:
  push:
    branches: [ops/runtime-recovery-693]
    paths: [.github/workflows/runtime-gap-evidence.yml]

permissions:
  contents: read

concurrency:
  group: runtime-gap-evidence-693
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/ops/runtime-recovery-693'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          # One public Wikidata lookup and runner control traffic only.
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            www.wikidata.org:443
            *.githubapp.com:443
      - name: Inspect authoritative entity data for the seven observed blank records
        run: |
          node --input-type=module <<'NODE'
          const ids = ['Q58316593', 'Q58316598', 'Q58316599', 'Q58334883',
            'Q136689291', 'Q136689343', 'Q136689373'];
          const url = new URL('https://www.wikidata.org/w/api.php');
          url.search = new URLSearchParams({ action: 'wbgetentities', format: 'json',
            ids: ids.join('|'), props: 'info|labels|aliases|claims|sitelinks', maxlag: '5' });
          const res = await fetch(url, { signal: AbortSignal.timeout(30000),
            headers: { 'user-agent': 'HawkeyeSterling-PEPHarvest/1.0 (entity gap diagnosis; github.com/trex0092/HAWKEYE-STERLING-RA)' } });
          console.log('LOOKUP_HTTP ' + res.status);
          if (!res.ok) throw new Error('Wikidata HTTP ' + res.status);
          const data = await res.json();
          if (data.error || data.errors) throw new Error(JSON.stringify(data.error || data.errors));
          console.log('REDIRECTS ' + JSON.stringify(data.redirects || []));
          for (const [qid, entity] of Object.entries(data.entities || {})) {
            const claims = Object.fromEntries(Object.entries(entity.claims || {}).map(([p, statements]) =>
              [p, statements.map(s => ({ value: s.mainsnak?.datavalue?.value,
                snaktype: s.mainsnak?.snaktype, rank: s.rank,
                references: s.references?.map(r => r.snaks) }))]));
            console.log('ENTITY ' + JSON.stringify({ qid, id: entity.id, type: entity.type,
              missing: Object.hasOwn(entity, 'missing'), lastrevid: entity.lastrevid,
              labels: entity.labels, aliases: entity.aliases, sitelinks: entity.sitelinks, claims }));
          }
          NODE
