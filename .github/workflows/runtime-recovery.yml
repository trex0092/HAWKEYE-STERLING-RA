name: Runtime recovery repair

on:
  push:
    branches: [fix/runtime-recovery-20260929]
    paths: [.github/workflows/runtime-recovery.yml]

permissions:
  contents: write

concurrency:
  group: runtime-recovery-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/fix/runtime-recovery-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        # Only checkout, Node toolchain, and the guarded branch push need egress.
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            *.githubapp.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Apply the immutable, hash-guarded source patch
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync, spawnSync } from 'node:child_process';
          // Reuse the exact patch already exercised by the 32 recovery checks.
          // This literal commit is immutable; no downloaded or PR-provided script.
          const text = execFileSync('git', ['show',
            '31efc7825e29fa974a5e784ee92076dcaed74bdb:.github/workflows/runtime-recovery.yml'],
            { encoding: 'utf8' });
          const match = /^          node --input-type=module <<'NODE'\n([\s\S]*?)^          NODE$/m.exec(text);
          assert.ok(match, 'Expected exact patch heredoc');
          const code = match[1].replace(/^          /gm, '');
          const run = spawnSync(process.execPath, ['--input-type=module'], {
            input: code, stdio: ['pipe', 'inherit', 'inherit'], encoding: 'utf8',
          });
          assert.ifError(run.error);
          assert.equal(run.status, 0, 'Source patch must succeed');
          NODE
          git diff --check
      - name: Verify syntax and offline regressions with production defaults
        run: |
          node --check scripts/adverse-media.mjs
          node --check scripts/pep-worldwide.mjs
          node --check scripts/runtime-recovery.mjs
          node test/runtime-recovery.test.mjs
          node test/adverse-media.test.mjs
          node test/pep-worldwide.test.mjs
          node test/screening-assurance.test.mjs
      - name: Commit verified source repair to this branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/fix/runtime-recovery-20260929
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/adverse-media.mjs scripts/pep-worldwide.mjs CHANGELOG.md
          git commit -m 'fix: wire validated news recovery and retry incomplete PEP harvests'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/runtime-recovery-20260929
