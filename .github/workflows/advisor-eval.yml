name: Advisor Eval

# Weekly Model & Agent Assurance check (Layer 4 of the 6 Layers of Agentic AI
# Governance) for the LLM-backed Advisor (netlify/functions/brain-soul.js).
# scripts/advisor-eval.mjs runs a fixed prompt battery through the production
# system prompt (SOUL_CHARTER) and asserts the charter guardrails (P1/P4/P7/P9/P10)
# held against the real model. On a behavioural regression it files a card in the
# "Ongoing Monitoring" Asana project, falling back to a labelled
# GitHub issue if Asana is unreachable so a regression is never lost.
#
# Runs ONLY if the ANTHROPIC_API_KEY secret is set; otherwise the eval skips and
# the job is a no-op. The offline guardrail tests (test/advisor-assurance.test.js)
# always run in CI regardless.

on:
  schedule:
    - cron: '9 8 * * 1'   # 08:09 UTC every Monday, after the daily watchers (odd minute)
  workflow_dispatch:
  # A model change must not wait up to a week for its live confirmation. The
  # 2026-07-29 Claude 5 swap merged on a Wednesday, which left the guardrails
  # unverified against the new models until the following Monday — recorded as a
  # residual limitation in model-validation-2026.md §5 at the time. Now the eval
  # fires on any push to main that touches the files that define which model
  # runs, so the confirmation window is minutes, not days.
  push:
    branches: [main]
    paths:
      - 'netlify/functions/brain-soul.js'
      - 'data/ai-assets.json'
      - 'scripts/advisor-eval.mjs'

# Least privilege at the top level; the job declares its own write scope.
permissions:
  contents: read

concurrency:
  group: advisor-eval
  cancel-in-progress: false

jobs:
  eval:
    permissions:
      contents: read
      issues: write # regression findings are filed as issues
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            nodejs.org:443
            app.asana.com:443
            api.anthropic.com:443
            *.githubapp.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run Advisor behavioural eval
        id: eval
        # Don't fail the whole job here; we want to route a regression to Asana/issue first.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/advisor-eval.mjs

      - name: Notify Asana on regression — Ongoing Monitoring project
        id: asana
        continue-on-error: true
        if: steps.eval.outcome == 'failure'
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          ASANA_REG_PROJECT_GID: ${{ vars.ASANA_DELIVERY_PROJECT_GID || '1216203370612914' }}
          ASANA_SECTION_GID: ${{ vars.ASANA_DELIVERY_SECTION_GID || '1216203370612916' }}
        # Title must not claim a regression when the eval could not run (e.g. the
        # API returned 400s on a billing lapse) — the report's Result line is the
        # discriminator, written by scripts/advisor-eval.mjs.
        run: |
          TITLE="Advisor guardrail regression detected"
          if grep -q '^\*\*Result: INCOMPLETE' advisor-eval-report.md; then
            TITLE="Advisor eval incomplete — API errors (no regression evidence)"
          fi
          node scripts/watch-notify.mjs "$TITLE" advisor-eval-report.md

      - name: Fallback to a GitHub issue if Asana delivery failed
        if: steps.eval.outcome == 'failure' && steps.asana.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            let report = 'Advisor eval reported a guardrail regression. See the workflow run.';
            try { report = fs.readFileSync('advisor-eval-report.md', 'utf8'); } catch (e) {}
            const incomplete = report.includes('**Result: INCOMPLETE');
            const { owner, repo } = context.repo;
            await github.rest.issues.create({
              owner, repo,
              title: incomplete
                ? 'Advisor eval incomplete — API errors (no regression evidence)'
                : 'Advisor guardrail regression detected',
              body: report + '\n\n---\n> Filed because the Asana delivery was unavailable. Set the `ASANA_ACCESS_TOKEN` secret to route future regressions to Asana.',
              labels: ['advisor-eval'],
            });

      - name: Fail the job if a guardrail regressed or the eval could not run
        if: steps.eval.outcome == 'failure'
        run: |
          echo "Advisor eval reported a guardrail regression or could not complete — see advisor-eval-report.md and the alert above."
          exit 1
