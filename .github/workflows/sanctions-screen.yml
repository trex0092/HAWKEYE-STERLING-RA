name: Sanctions Screen

# Daily ongoing screening of the LIVE customer base against the free consolidated
# designation lists — OFAC SDN + non-SDN, UN, EU, UK OFSI, UAE EOCN Local
# Terrorist List (maintained in-repo) — plus free adverse-media (Google News RSS)
# and a best-effort PEP signal (Wikidata). Matching runs IN THIS ACTION
# (scripts/sanctions-match.mjs); there is no external engine and no API key.
#
# Reads the active counterparties from the Asana "Customer Database" project,
# screens them, and on any NEW match raises one alert card in the "Sanctions
# updates" section of the "Ongoing Monitoring" project for
# MLRO / four-eyes review. A standing match is recorded once, not re-alerted
# daily. The refreshed state is committed to main so the next run only flags what
# changed. Runs AFTER the Sanctions Watch (05:00) so it screens against fresh lists.
#
# A run that could not screen (no Asana token, every list failed to load, empty
# database) NEVER reports all-clear — it opens a GitHub issue instead. Reduced
# coverage (a list failed, or UAE EOCN unpopulated) is flagged as degraded.
#
# Secrets / vars:
#   ASANA_ACCESS_TOKEN  (secret)  read the Customer Database + post the alert
#   ASANA_REG_PROJECT_GID         alert destination project (default in script)
#   ASANA_CUSTOMER_PROJECT_GID    screening subject project (default in script)
#   ASANA_SANCTIONS_SECTION_GID   section to file alerts under
#   SCREEN_MATCH_THRESHOLD        material-match score 0-1 (default 0.85)
#   SCREEN_ADVERSE_MEDIA          '0' to disable Google News adverse-media (default on)
#   SCREEN_PEP                    '0' to disable the Wikidata PEP signal (default on)
#   SCREEN_INTERPOL               '1' to ENABLE the Interpol Red Notice per-subject signal (default OFF; public subset only, supplementary — verify the public API on the runner before turning on)
#   ASANA_OM_PROJECT_GID          "Ongoing Monitoring" project for the daily audit tasks
#   ASANA_OM_AM_PEP_SECTION_GID   optional override (sections are found/created by name)
#   ASANA_OM_LOG_SECTION_GID      optional override (sections are found/created by name)

on:
  # RETIRED (schedule removed): superseded by the single unified "Daily Screening
  # (Sanctions + Adverse Media + PEP)" workflow (weekly-adverse-media.yml,
  # RUN_MODE=unified). Kept as manual-only (the in-engine Node screener stays
  # available for ad-hoc runs); no longer posts a duplicate daily task.
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sanctions-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # bound the daily re-screen; a hang must fail loudly, not stall the control
    steps:
      - name: Harden the runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with:
          disable-sudo: true
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Screen the customer base
        id: screen
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          ASANA_REG_PROJECT_GID: ${{ vars.ASANA_REG_PROJECT_GID }}
          ASANA_CUSTOMER_PROJECT_GID: ${{ vars.ASANA_CUSTOMER_PROJECT_GID }}
          # "Sanctions updates" section of the Ongoing Monitoring project
          ASANA_SECTION_GID: ${{ vars.ASANA_SANCTIONS_SECTION_GID || '1216203873114462' }}
          SCREEN_MATCH_THRESHOLD: ${{ vars.SCREEN_MATCH_THRESHOLD }}
          SCREEN_ADVERSE_MEDIA: ${{ vars.SCREEN_ADVERSE_MEDIA }}
          SCREEN_PEP: ${{ vars.SCREEN_PEP }}
          SCREEN_INTERPOL: ${{ vars.SCREEN_INTERPOL }}
          # Ongoing Monitoring audit trail — sections are found/created by name at
          # runtime, so the section GID vars are optional overrides.
          ASANA_OM_PROJECT_GID: ${{ vars.ASANA_OM_PROJECT_GID || '1213914392047129' }}
          ASANA_OM_AM_PEP_SECTION_GID: ${{ vars.ASANA_OM_AM_PEP_SECTION_GID }}
          ASANA_OM_LOG_SECTION_GID: ${{ vars.ASANA_OM_LOG_SECTION_GID }}
        run: node scripts/sanctions-screen.mjs

      - name: Screening metrics (non-blocking observability)
        if: always()
        continue-on-error: true
        run: node scripts/screening-metrics.mjs

      - name: Commit refreshed screening state to main
        if: steps.screen.outputs.screen_error != 'true'
        env:
          # Step output crosses into the shell via env (never inline ${{ }} in run:)
          # — the title can carry an upstream error message, so this is load-bearing.
          TITLE: ${{ steps.screen.outputs.title }}
        run: |
          if [ -n "$(git status --porcelain data/sanctions-screen-state.json 2>/dev/null)" ]; then
            git config user.name "sanctions-screen"
            git config user.email "actions@github.com"
            git add data/sanctions-screen-state.json
            git commit -m "$TITLE [skip ci]"
            for attempt in 1 2 3 4 5; do
              git push && break
              echo "push rejected (attempt $attempt) — rebasing on origin/main"
              git pull --rebase origin main || git rebase --abort
              sleep $((attempt * 3))
            done
          else
            echo "state unchanged"
          fi

      - name: Open a GitHub issue if the screen could not run, or a hit was not delivered
        if: steps.screen.outputs.screen_error == 'true' || (steps.screen.outputs.has_changes == 'true' && steps.screen.outputs.asana_posted != 'true')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          TITLE: ${{ steps.screen.outputs.title }}
          SCREEN_ERROR: ${{ steps.screen.outputs.screen_error }}
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try { report = fs.readFileSync('sanctions-screen-report.md', 'utf8'); } catch {}
            const failed = process.env.SCREEN_ERROR === 'true';
            const note = failed
              ? ['', '---',
                 '> The daily customer screen **could not run**, so no clearance can be inferred.',
                 '> Check the `ASANA_ACCESS_TOKEN` secret and that the sanctions lists are reachable, then re-run.'].join('\n')
              : ['', '---',
                 '> A customer match was detected but **could not be delivered to Asana** (token missing or the API call failed),',
                 '> so this issue was opened instead. The match must still be reviewed (MLRO + four-eyes).'].join('\n');
            const { owner, repo } = context.repo;
            await github.rest.issues.create({
              owner, repo,
              title: process.env.TITLE || 'Sanctions Screen — attention required',
              body: (report || 'See the workflow run.') + note,
              labels: ['sanctions-screen'],
            });
