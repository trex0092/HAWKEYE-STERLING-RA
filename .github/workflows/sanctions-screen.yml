name: Sanctions Screen

# Daily ongoing screening of the LIVE customer base against the free consolidated
# designation lists — OFAC SDN + non-SDN, UN, EU, UK OFSI, UAE EOCN Local
# Terrorist List (maintained in-repo) — plus free adverse-media (Google News RSS)
# and a best-effort PEP signal (Wikidata). Matching runs IN THIS ACTION
# (scripts/sanctions-match.mjs); there is no external engine and no API key.
#
# Reads the active counterparties from the Asana "Customer Database" project,
# screens them, and on any NEW match raises one alert card in the "Sanctions
# updates" section of the "Ongoing Monitoring" project for
# MLRO / four-eyes review. A standing match is recorded once, not re-alerted
# daily. The refreshed state is committed to main so the next run only flags what
# changed. Runs AFTER the Sanctions Watch (05:00) so it screens against fresh lists.
#
# A run that could not screen (no Asana token, every list failed to load, empty
# database) NEVER reports all-clear — the screen step exits non-zero so the run
# concludes RED (control-retry re-dispatches it and the freshness check sees no
# success for the day), and the issue step below still opens a GitHub issue
# (always()-guarded; the bail writes its outputs before setting the exit code).
# Reduced coverage (a list failed, or UAE EOCN unpopulated) is flagged as degraded.
#
# Secrets / vars:
#   ASANA_ACCESS_TOKEN  (secret)  read the Customer Database + post the alert
#   ASANA_REG_PROJECT_GID         alert destination project (vars.ASANA_DELIVERY_PROJECT_GID -> HAWKEYE STERLING APP)
#   ASANA_CUSTOMER_PROJECT_GID    screening subject project (default in script)
#   ASANA_SANCTIONS_SECTION_GID   section to file alerts under
#   SCREEN_MATCH_THRESHOLD        material-match score 0-1 (default 0.85)
#   SCREEN_ADVERSE_MEDIA          '0' to disable Google News adverse-media (default on)
#   SCREEN_PEP                    '0' to disable the Wikidata PEP signal (default on)
#   SCREEN_INTERPOL               '1' to ENABLE the Interpol Red Notice per-subject signal (default OFF; public subset only, supplementary — verify the public API on the runner before turning on)
#   SCREEN_FBI                    '1' to ENABLE the FBI Wanted per-subject signal (default OFF; wanted posters only — missing-person/information posters are excluded by the module; verify on the runner before turning on)
#   ASANA_OM_PROJECT_GID          daily audit task project (vars.ASANA_DELIVERY_PROJECT_GID -> HAWKEYE STERLING APP)
#   ASANA_OM_AM_PEP_SECTION_GID   optional override (section is found/created by name)

on:
  # Re-scheduled 2026-07-08 as the SCREENING CASE ENGINE: runs daily, fetches
  # every designation list itself (fetchListBody), refreshes the per-subject state,
  # then the case-manager step turns every flag into a managed lifecycle CASE
  # (New -> Under Review -> Cleared/Escalated) with a 5-day SLA and aging
  # alerts. Its own flat alert card + daily audit task stay SUPPRESSED so it
  # never duplicates the unified Daily Screening digest.
  # 09:00 UAE DELIVERY (2026-10-01): results must be in Asana by 09:00 UAE
  # (05:00 UTC). GitHub delivers this repo's scheduled events 4-6h late (the
  # 05:37 slot started 09:41-11:57 UTC over 19-30 Sep) and drops most of a
  # frequent cron (control-retry's 36 daily slots produced 1-3 runs a day), so
  # no cron here can promise 09:00. The on-time trigger is
  # screening-morning-dispatch.yml's workflow_dispatch at 00:05 UTC (~95 min
  # run, in Asana ~06:00 UAE). This slot is the BACKSTOP: the earliest same-UTC-day start (a run on
  # the previous UTC day would break freshness-check's maxAgeDays 0 window),
  # so a missed dispatch still lands ~08:00-10:00 UAE, not mid-afternoon.
  schedule:
    - cron: '17 0 * * *'   # 00:17 UTC = 04:17 UAE daily (odd minute) — backstop to the on-time dispatch
  # A merged change to the screening engine or its assurance/delivery contract
  # invalidates prior exact-commit runtime evidence. Revalidate automatically
  # on integrated main, not on unreviewed PRs or unrelated documentation.
  push:
    branches: [main]
    paths:
      - '.github/workflows/sanctions-screen.yml'
      - '.github/workflows/screening-assurance.yml'
      - '.github/workflows/sanctions-runtime-assurance.yml'
      - 'scripts/sanctions-screen.mjs'
      - 'scripts/screening-assurance.mjs'
      - 'scripts/screening-delivery.mjs'
      - 'scripts/screening-cases.mjs'
      - 'data/worldwide-screening-sources.json'
      - 'screen.py'
      - 'kyc.py'
  workflow_dispatch:

permissions:
  contents: read

# Operational control: CI tests proposals; relevant accepted changes on main
# receive a fresh full-population run and exact-commit assurance. Ordinary
# application/doc merges do not trigger costly screening. Non-cancelling
# concurrency prevents a new push from discarding an active run's evidence.
concurrency:
  group: sanctions-screen-runtime
  cancel-in-progress: false

jobs:
  screen:
    # Write scopes live at job level (top level is read-only — least privilege).
    permissions:
      actions: write
      contents: write
      issues: write
    runs-on: ubuntu-latest
    # The 2026-09-30 run reached the 90-minute enrichment budget with five
    # subjects remaining. Allow 100 minutes without increasing provider rates.
    # Keep 15+ minutes of job headroom after the capped 5-minute adverse-media
    # recovery tail for case review, Asana delivery, and state persistence.
    # Skipped enrichment still fails assurance; a larger budget is not proof
    # that every provider answered or that the full population was covered.
    timeout-minutes: 120
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          disable-sudo: true
          # Allowlist derived from the job's actual fetches: runner/toolchain
          # (github/nodejs), Asana (customer read + alert post), the consolidated
          # designation lists (OFAC/UN/EU/UK, DFAT via its OpenSanctions mirror
          # on data.opensanctions.org — UAE EOCN is an in-repo file), the
          # adverse-media feeds (Google News RSS + GDELT), the Wikidata PEP
          # signal, Interpol (for when SCREEN_INTERPOL=1), FBI Wanted (for when
          # SCREEN_FBI=1), and the worldwide national lists added 2026-08-05
          # (Trade.gov CSL, Sri Lanka, HK CEDB — each fail-safe: a blocked or
          # down source discloses DEGRADED coverage, never a silent all-clear).
          # Anything else — including an exfiltration attempt from a
          # compromised dependency — is blocked and surfaces loudly.
          # UK Sanctions List (sanctionslist.fcdo.gov.uk, repointed 2026-09-22)
          # and NZ MFAT (www.mfat.govt.nz) added 2026-09-27: both were enabled
          # sources whose hosts were missing from this list, so every run
          # blocked them ("fetch failed") and screened without the UK list.
          # test/sanctions-registry-integrity.test.mjs now fails if any enabled
          # source host is missing from this allowlist.
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            nodejs.org:443
            app.asana.com:443
            *.asanausercontent.com:443
            sanctionslistservice.ofac.treas.gov:443
            wc2h-sls-prod-public-published.s3.us-gov-west-1.amazonaws.com:443
            scsanctions.un.org:443
            unsolprodfiles.blob.core.windows.net:443
            umsanrp1dltx4dj3sxtt.blob.core.windows.net:443
            umsaszjsdz5c04wqdhbq.blob.core.windows.net:443
            umsabtc1vb1fc4tfrqf0.blob.core.windows.net:443
            webgate.ec.europa.eu:443
            ecas.ec.europa.eu:443
            ofsistorage.blob.core.windows.net:443
            news.google.com:443
            api.gdeltproject.org:443
            data.gdeltproject.org:443
            www.bing.com:443
            www.wikidata.org:443
            ws-public.interpol.int:443
            www.international.gc.ca:443
            www.publicsafety.gc.ca:443
            gels-avoirs.dgtresor.gouv.fr:443
            www.sesam.search.admin.ch:443
            www.dfat.gov.au:443
            data.opensanctions.org:443
            apigwext.worldbank.org:443
            api.ofac-api.com:443
            data.trade.gov:443
            www.competentauthority.gov.lk:443
            www.government.nl:443
            sifi.minfin.fgov.be:443
            geldefonds.gouv.mc:443
            nbctf.mod.gov.il:443
            pctc.pss.gov.sa:443
            portal.moi.gov.qa:443
            api.fbi.gov:443
            repet.jus.gob.ar:443
            isf.gov.lb:443
            www.migracija.lt:443
            mzv.gov.cz:443
            antiteror.sis.md:443
            www.gov.pl:443
            www.vm.ee:443
            fiubelize.org:443
            olinda.bcb.gov.br:443
            contas.tcu.gov.br:443
            sanctionslist.fcdo.gov.uk:443
            www.mfat.govt.nz:443
            tfs.fic.gov.za:443
            apim.adb.org:443
            data.iadb.org:443
            omawww.sat.gob.mx:80
            *.githubapp.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No credentials on disk (zizmor artipacked): the state push below
          # authenticates with an ephemeral env token, and the overlay fetch
          # is anonymous (public repo).
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Overlay latest screening + case state (lives on the screen-state branch)
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          # Branch protection blocks direct pushes to main, so per-subject
          # screening state and case-lifecycle state persist on a dedicated
          # data branch. Without the overlay every run would re-alert standing
          # matches and re-create existing cases. With STATE_ENCRYPTION_KEY
          # set the branch carries <file>.enc instead of subject-data
          # plaintext (P30): decrypt restores the working files; an .enc with
          # no key fails loudly rather than running with amnesia.
          if git fetch origin screen-state --depth=1 2>/dev/null; then
            for f in data/sanctions-screen-state.json data/screening-cases-state.json; do
              git checkout FETCH_HEAD -- "$f" 2>/dev/null || true
              git checkout FETCH_HEAD -- "$f.enc" 2>/dev/null || true
            done
            node scripts/state-crypto.mjs decrypt data/sanctions-screen-state.json data/screening-cases-state.json
            echo "state overlaid from screen-state"
          else
            echo "no screen-state branch yet — using state from main"
          fi
          # Worldwide PEP list artifact (weekly Wikidata harvest, CC0 —
          # public-officials data, unencrypted). Absent branch = layer off,
          # logged by the screen; standing PEP-list matches stay protected
          # via evaluatedSignals, never silently cleared.
          if git fetch origin pep-worldwide-state --depth=1 2>/dev/null; then
            git checkout FETCH_HEAD -- data/pep-worldwide.json 2>/dev/null || true
            echo "worldwide PEP list overlaid from pep-worldwide-state"
          else
            echo "no pep-worldwide-state branch yet — worldwide PEP layer pending first harvest"
          fi

      - name: Screen the customer base
        id: screen
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          # Licence-free mode: set the repository variable OPENSANCTIONS_DATA=0 to
          # download nothing from data.opensanctions.org (its data needs a
          # commercial licence). Unset = on. See docs/aims/third-party-register.md.
          OPENSANCTIONS_DATA: ${{ vars.OPENSANCTIONS_DATA }}
          ASANA_REG_PROJECT_GID: ${{ vars.ASANA_DELIVERY_PROJECT_GID || '1216203370612914' }}
          ASANA_CUSTOMER_PROJECT_GID: ${{ vars.ASANA_CUSTOMER_PROJECT_GID || '1214107620220121' }}
          ASANA_EMPLOYEE_PROJECT_GID: ${{ vars.ASANA_EMPLOYEE_PROJECT_GID || '1216239131596624' }}
          # "Sanctions updates" section, gid 1218451960830318. Repointed
          # 2026-09-16: same fix as sanctions-watch.yml -- this was reading
          # the generic, never-set ASANA_DELIVERY_SECTION_GID and silently
          # falling through to "Assessment Report" (1216203370612916). The
          # repo variable also held a stale value from an earlier Asana
          # reorganization, corrected in the same pass.
          ASANA_SECTION_GID: ${{ vars.ASANA_SANCTIONS_SECTION_GID || '1218451960830318' }}
          # MIRROR (RETIRED 2026-09-15): the separate "Sanctions/Media/PEP -
          # Monitoring" project (1213914392047129, section 1213914392047131) was
          # merged into HAWKEYE STERLING APP, so mirroring here would just re-add
          # the SAME project the digest above already targets. Both vars below
          # default to empty (disabled) via the original "Clear
          # ASANA_MIRROR_PROJECT_GID to disable" escape hatch, until/unless a
          # genuinely separate MLRO queue exists again.
          ASANA_MIRROR_PROJECT_GID: ${{ vars.ASANA_ALERT_MIRROR_PROJECT_GID }}
          ASANA_MIRROR_SECTION_GID: ${{ vars.ASANA_ALERT_MIRROR_SECTION_GID }}
          SCREEN_ENRICH_BUDGET_MS: '6000000'
          # The initial 100-minute phase exhausted its deadline on 13 Oct and
          # permitted only 2 of 20 queued zero-backbone subjects to retry.
          # Reserve max 5 minutes exclusively for post-sweep failed subjects;
          # the domain still fails assurance until actual coverage is proven.
          SCREEN_AM_RECOVERY_RESERVE_MS: '300000'
          SCREEN_MATCH_THRESHOLD: ${{ vars.SCREEN_MATCH_THRESHOLD }}
          # Personal EU FSF crawler token (optional): the shared public token now
          # redirects to EU Login. Unset = public token, and the EU list fails loudly.
          EU_FSF_TOKEN: ${{ secrets.EU_FSF_TOKEN }}
          SCREEN_ADVERSE_MEDIA: ${{ vars.SCREEN_ADVERSE_MEDIA }}
          # Google News locales swept per subject (pinned core + daily rotation).
          # 8 is the empirical per-IP ceiling from a GitHub runner — the Python
          # engine's record (weekly-adverse-media.yml, ADVERSE_LOCALES note):
          # 14 locales tripped the limiter and 805/838 subjects got ZERO
          # adverse-media coverage; a small budget swept the full book clean.
          # Same env name/semantics as the Python engine; 'all' = full matrix.
          ADVERSE_LOCALES: ${{ vars.ADVERSE_LOCALES || '8' }}
          # Third global news backbone (independent rate-limit pool — worldwide
          # recall needs three simultaneous refusals to go dark). '0' disables.
          BING_NEWS: ${{ vars.BING_NEWS || '1' }}
          SCREEN_PEP: ${{ vars.SCREEN_PEP }}
          SCREEN_INTERPOL: ${{ vars.SCREEN_INTERPOL }}
          SCREEN_FBI: ${{ vars.SCREEN_FBI }}
          # Ongoing Monitoring audit trail — the section is found/created by name
          # at runtime, so the section GID var is an optional override.
          ASANA_OM_PROJECT_GID: ${{ vars.ASANA_DELIVERY_PROJECT_GID || '1216203370612914' }}
          ASANA_OM_AM_PEP_SECTION_GID: ${{ vars.ASANA_OM_AM_PEP_SECTION_GID || '1218979441933783' }}
          # Case-engine mode: the lifecycle cases below ARE the alert surface;
          # the flat alert card + daily audit task would duplicate the unified
          # Daily Screening digest. Set the vars to '0' to restore them.
          SCREEN_SUPPRESS_ALERTS: ${{ vars.SCREEN_SUPPRESS_ALERTS || '1' }}
          SCREEN_SKIP_AUDIT_TASK: ${{ vars.SCREEN_SKIP_AUDIT_TASK || '1' }}
          # OFAC-API SECOND OPINION — independent corroboration attached to
          # NEW/CHANGED matches only (capped, additive-only: it can never
          # downgrade, clear, or re-alert a hit; a failed lookup is disclosed
          # on the case card as a lost signal). Third-party transfer: record
          # the processor in the third-party register, then set repo var
          # OFACAPI=1 (the OFAC_API_KEY secret must also exist).
          OFACAPI: ${{ vars.OFACAPI || '0' }}
          OFAC_API_KEY: ${{ secrets.OFAC_API_KEY }}
          # Cleared-FP registry kill switch (default on; empty registry = no-op)
          SCREEN_WHITELIST: ${{ vars.SCREEN_WHITELIST || '1' }}
        run: node scripts/sanctions-screen.mjs

      - name: Manage screening case lifecycle + post the daily results digest to Asana
        id: cases
        if: steps.screen.outputs.screen_error != 'true'
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          # Case and daily-results evidence MUST reach this approved MLRO
          # project, even if an unrelated repository variable is repointed.
          ASANA_CASES_PROJECT_GID: '1216203370612914'
          ASANA_CASE_ASSIGNEE_GID: ${{ vars.ASANA_CASE_ASSIGNEE_GID || '1213645083721304' }}
          # "Sanctions updates" section — the run's RESULTS surface (Asana, not
          # GitHub). Repointed 2026-09-16: this literal fallback pointed at
          # "Assessment Report" (1216203370612916), not "Sanctions updates",
          # even though the step comment already said "Sanctions updates".
          # The real section is 1218451960830318, verified against the live
          # Asana API.
          ASANA_SCREEN_RESULTS_SECTION_GID: ${{ vars.ASANA_SCREEN_RESULTS_SECTION_GID || '1218451960830318' }}
          # MIRROR (RETIRED 2026-09-15, see the screen step above for why): both
          # vars now default to empty (disabled) since their destination project
          # was merged into HAWKEYE STERLING APP.
          ASANA_MIRROR_PROJECT_GID: ${{ vars.ASANA_ALERT_MIRROR_PROJECT_GID }}
          ASANA_MIRROR_SECTION_GID: ${{ vars.ASANA_ALERT_MIRROR_SECTION_GID }}
          # Telemetry-only, no external paid API is enabled by this variable.
          API_COST_TELEMETRY_ENABLED: '1'
          API_QUOTA_ALERT_TELEMETRY_ENABLED: '1'
        run: node scripts/screening-cases.mjs

      - name: API cost summary (metadata only)
        if: always() && !cancelled()
        continue-on-error: true
        env:
          # Independently dated publisher prices only; never assume a missing
          # price or absent usage receipt means zero spend.
          API_USD_RATES_JSON: ${{ vars.API_USD_RATES_JSON }}
        run: |
          # The dashboard CLI REQUIRES a ledger and a verified price table.
          # Invoking it with no args always exits 2 and loses the monitoring
          # signal. Missing pricing or token usage is UNKNOWN, never priced.
          if [ ! -s api-cost-ledger.jsonl ] || [ -z "${API_USD_RATES_JSON:-}" ]; then
            echo 'API cost dashboard: INCOMPLETE (no verified prices or usage receipts)'
            {
              echo '## API Cost Dashboard'
              echo 'INCOMPLETE: No verified pricing table and sanitized paid-usage receipts were both available. Missing evidence is not zero spending.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            umask 077
            PRICE_FILE="${RUNNER_TEMP}/hawkeye-screen-verified-prices.json"
            trap 'rm -f "$PRICE_FILE"' EXIT
            printf '%s' "$API_USD_RATES_JSON" > "$PRICE_FILE"
            node scripts/api-cost-dashboard.mjs --ledger api-cost-ledger.jsonl --prices "$PRICE_FILE"
          fi

      - name: API credit/quota alerts (sanitized categories only)
        if: always() && !cancelled()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          API_QUOTA_ALERT_ISSUES: '1'
        run: node scripts/api-quota-alerts.mjs

      - name: Screening metrics (non-blocking observability)
        if: always()
        continue-on-error: true
        run: node scripts/screening-metrics.mjs

      - name: Prove worldwide screening runtime assurance
        id: assurance
        # Case-delivery failures must not prevent current coverage evidence.
        if: always() && !cancelled() && steps.screen.outcome == 'success' && steps.screen.outputs.screen_error != 'true'
        run: node scripts/screening-assurance.mjs --write

      - name: Deliver and verify complete daily screening evidence in Asana
        id: delivery
        # A degraded assurance record still needs delivery. The assurance step
        # stays failed; publishing that failure never turns coverage green.
        if: always() && !cancelled() && steps.screen.outcome == 'success' && steps.screen.outputs.screen_error != 'true'
        timeout-minutes: 10
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          ASANA_CASE_ASSIGNEE_GID: ${{ vars.ASANA_CASE_ASSIGNEE_GID || '1213645083721304' }}
        run: node scripts/screening-delivery.mjs

      - name: Persist screening + case state (screen-state branch)
        id: persist
        # always() preserves case GIDs even if case delivery fails after a
        # completed screen. A cancelled/failed screen has no publishable result.
        if: always() && steps.screen.outcome == 'success' && steps.screen.outputs.screen_error != 'true'
        env:
          # Step output crosses into the shell via env (never inline ${{ }} in run:)
          # — the title can carry an upstream error message, so this is load-bearing.
          TITLE: ${{ steps.screen.outputs.title }}
          GITHUB_TOKEN: ${{ github.token }}
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          # screen-state is a DATA branch. Build the commit on its existing tree
          # and replace only screening data files. Rebuilding from the current
          # main checkout can carry .github/workflows changes and GitHub rejects
          # those writes for the Actions token.
          if [ -n "$(git status --porcelain data/sanctions-screen-state.json data/screening-cases-state.json data/screening-assurance.json data/badges/sanctions-operational.svg data/badges/adverse-media-operational.svg data/badges/pep-operational.svg 2>/dev/null)" ]; then
            git config user.name "sanctions-screen"
            git config user.email "actions@github.com"

            if [ -n "$STATE_ENCRYPTION_KEY" ]; then
              node scripts/state-crypto.mjs encrypt data/sanctions-screen-state.json data/screening-cases-state.json
              for f in data/sanctions-screen-state.json data/screening-cases-state.json; do
                git checkout HEAD -- "$f" 2>/dev/null || true
              done
            else
              # The repository is PUBLIC: plaintext state carries customer and
              # employee names, so it is never published. Fail red instead.
              echo "::error::STATE_ENCRYPTION_KEY is not set - refusing to publish screen-state in PLAINTEXT (customer/employee names) to the public repository; state NOT persisted (P30)"
              exit 1
            fi

            GIT_INDEX_FILE="$(mktemp -u)"
            export GIT_INDEX_FILE
            parent_args=()
            rc=0
            git ls-remote --exit-code --heads origin screen-state >/dev/null 2>&1 || rc=$?
            if [ "$rc" -eq 0 ]; then
              git fetch origin screen-state --depth=1
              tip="$(git rev-parse FETCH_HEAD)"
              git read-tree "$tip"
              parent_args=(-p "$tip")
            elif [ "$rc" -eq 2 ]; then
              git read-tree --empty
            else
              echo "::error::could not read screen-state (ls-remote rc=$rc) - refusing to rebuild the branch blind"
              exit 1
            fi

            files=(
              data/screening-assurance.json
              data/badges/sanctions-operational.svg
              data/badges/adverse-media-operational.svg
              data/badges/pep-operational.svg
            )
            files+=(data/sanctions-screen-state.json.enc data/screening-cases-state.json.enc)
            git update-index --force-remove data/sanctions-screen-state.json data/screening-cases-state.json 2>/dev/null || true

            for f in "${files[@]}"; do
              if [ -e "$f" ]; then
                git update-index --add --cacheinfo "100644,$(git hash-object -w "$f"),$f"
              else
                echo "::notice::retaining last published $f; this run produced no replacement"
              fi
            done

            tree="$(git write-tree)"
            commit="$(git commit-tree "$tree" "${parent_args[@]}" -m "$TITLE [skip ci]")"
            unset GIT_INDEX_FILE

            pushed=
            for attempt in 1 2 3 4 5; do
              git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$commit":refs/heads/screen-state && { pushed=1; break; }
              echo "push failed (attempt $attempt) — retrying"
              sleep $((attempt * 3))
            done
            [ -n "$pushed" ] || { echo "::error::state push to screen-state failed after 5 attempts — state NOT persisted"; exit 1; }
          else
            echo "state unchanged"
          fi

      - name: Refresh runtime assurance watchdog
        id: refresh_assurance
        if: always() && steps.screen.outputs.screen_error != 'true' && steps.persist.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/assurance-dispatch.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/screening-assurance.yml/dispatches" \
            -d '{"ref":"main"}')
          if [ "$code" != "204" ]; then
            cat /tmp/assurance-dispatch.out
            echo
            echo "::error::could not dispatch Screening Assurance (HTTP $code)"
            exit 1
          fi
          echo "::notice::Screening Assurance dispatched against freshly persisted runtime evidence."

      - name: Escalate incomplete screening or failed evidence delivery directly to Asana
        id: asana-failure-alert
        # Failure to publish encrypted screening/case state or dispatch the
        # fresh assurance watchdog is also an operational evidence incident.
        # Even if the Asana report appeared, those failures are not clearance.
        # The MLRO queue must receive aggregate-only alert evidence.
        if: always() && (steps.screen.outcome == 'failure' || steps.screen.outputs.screen_error == 'true' || steps.cases.outcome == 'failure' || steps.delivery.outcome == 'failure' || steps.assurance.outcome == 'failure' || steps.persist.outcome == 'failure' || steps.refresh_assurance.outcome == 'failure')
        timeout-minutes: 3
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          ASANA_SECTION_GID: '1218451960830318'
          ASANA_ALERT_REFRESH_OPEN: '1'
          SCREEN_FAILED: ${{ steps.screen.outcome }}
          SCREEN_ERROR: ${{ steps.screen.outputs.screen_error }}
          CASES_FAILED: ${{ steps.cases.outcome }}
          DELIVERY_FAILED: ${{ steps.delivery.outcome }}
          ASSURANCE_FAILED: ${{ steps.assurance.outcome }}
          PERSIST_FAILED: ${{ steps.persist.outcome }}
          REFRESH_ASSURANCE_FAILED: ${{ steps.refresh_assurance.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$SCREEN_FAILED" = "failure" ] || [ "$SCREEN_ERROR" = "true" ]; then
            node scripts/asana-alert.mjs \
              "SCREENING ABORTED: daily sanctions / adverse-media / PEP processing incomplete" \
              "The mandatory daily screening did not complete. Do NOT infer clearance, accept a clean result or close a case. Review the failed workflow, source availability and outstanding human-owned screening cases. Run: $RUN_URL"
          elif [ "$PERSIST_FAILED" = "failure" ] || [ "$ASSURANCE_FAILED" = "failure" ] || [ "$REFRESH_ASSURANCE_FAILED" = "failure" ]; then
            node scripts/asana-alert.mjs \
              "SCREENING EVIDENCE INTEGRITY FAILED: case state or assurance not confirmed" \
              "Screening state was not safely persisted, its assurance evidence could not be produced, or the independent runtime check could not be dispatched. Report delivery does NOT establish valid current evidence; MLRO must reconcile case state and verify a fresh completed assurance run. Keep cases open and do NOT infer clearance. Run: $RUN_URL"
          else
            node scripts/asana-alert.mjs \
              "SCREENING DELIVERY FAILED: compliance case or evidence synchronization" \
              "The screening case lifecycle or independent evidence delivery step failed. Compliance evidence and dispositions have NOT been remotely verified. Keep affected cases open, investigate the failed Asana synchronization and verify a complete rerun. Run: $RUN_URL"
          fi

      - name: Open a GitHub issue when screening or coverage needs human attention
        # Never copy the screening report into this public issue: it contains
        # customer, principal and employee names. Keep coverage failures red and
        # open an aggregate-only human follow-up.
        if: always() && (steps.screen.outputs.screen_error == 'true' || steps.assurance.outcome == 'failure' || steps.persist.outcome == 'failure' || steps.refresh_assurance.outcome == 'failure' || (steps.screen.outputs.has_changes == 'true' && steps.screen.outputs.asana_posted != 'true' && steps.cases.outcome != 'success'))
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SCREEN_ERROR: ${{ steps.screen.outputs.screen_error }}
          ASSURANCE_OUTCOME: ${{ steps.assurance.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
          REFRESH_OUTCOME: ${{ steps.refresh_assurance.outcome }}
        with:
          script: |
            const assuranceFailed = process.env.ASSURANCE_OUTCOME === 'failure';
            const evidenceStateFailed = process.env.PERSIST_OUTCOME === 'failure' ||
              process.env.REFRESH_OUTCOME === 'failure';
            const screenFailed = process.env.SCREEN_ERROR === 'true';
            const title = evidenceStateFailed
              ? 'Sanctions Screen — state persistence or assurance dispatch requires review'
              : assuranceFailed
              ? 'Sanctions Screen — worldwide assurance requires review'
              : screenFailed
                ? 'Sanctions Screen — run requires review'
                : 'Sanctions Screen — delivery requires review';
            const runUrl = process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY
              + '/actions/runs/' + process.env.GITHUB_RUN_ID;
            const note = evidenceStateFailed
              ? 'Encrypted screening or case state was not confirmed as persisted, or the independent assurance dispatch failed. Human MLRO review and a fresh evidence-verified run are required; do not clear cases.'
              : assuranceFailed
              ? 'Worldwide runtime assurance failed. Review the aggregate domain evidence on the restricted operational record; the run remains degraded until coverage is verified.'
              : screenFailed
                ? 'The daily customer screen could not complete. No clearance can be inferred; investigate the run and retry after the cause is corrected.'
                : 'A screening match could not be delivered to the case system. Review through the restricted case channel and preserve human MLRO review.';
            const { owner, repo } = context.repo;
            const body = [
              'Automated screening requires human follow-up.',
              '',
              'Workflow run: ' + runUrl,
              '',
              note,
              '',
              'This public issue intentionally omits customer, principal, employee, and case identifiers. Do not post them in comments. Do not record a clearance or disposition here.'
            ].join('\n');
            await github.rest.issues.create({
              owner, repo,
              title,
              body,
              labels: ['sanctions-screen'],
            });
