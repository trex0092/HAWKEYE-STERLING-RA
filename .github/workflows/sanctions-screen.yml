name: Sanctions Screen

# Daily ongoing screening of the LIVE customer base against the free consolidated
# designation lists — OFAC SDN + non-SDN, UN, EU, UK OFSI, UAE EOCN Local
# Terrorist List (maintained in-repo) — plus free adverse-media (Google News RSS)
# and a best-effort PEP signal (Wikidata). Matching runs IN THIS ACTION
# (scripts/sanctions-match.mjs); there is no external engine and no API key.
#
# Reads the active counterparties from the Asana "Customer Database" project,
# screens them, and on any NEW match raises one alert card in the "Sanctions
# updates" section of the "Ongoing Monitoring" project for
# MLRO / four-eyes review. A standing match is recorded once, not re-alerted
# daily. The refreshed state is committed to main so the next run only flags what
# changed. Runs AFTER the Sanctions Watch (05:00) so it screens against fresh lists.
#
# A run that could not screen (no Asana token, every list failed to load, empty
# database) NEVER reports all-clear — the screen step exits non-zero so the run
# concludes RED (control-retry re-dispatches it and the freshness check sees no
# success for the day), and the issue step below still opens a GitHub issue
# (always()-guarded; the bail writes its outputs before setting the exit code).
# Reduced coverage (a list failed, or UAE EOCN unpopulated) is flagged as degraded.
#
# Secrets / vars:
#   ASANA_ACCESS_TOKEN  (secret)  read the Customer Database + post the alert
#   ASANA_REG_PROJECT_GID         alert destination project (vars.ASANA_DELIVERY_PROJECT_GID -> HAWKEYE STERLING APP)
#   ASANA_CUSTOMER_PROJECT_GID    screening subject project (default in script)
#   ASANA_SANCTIONS_SECTION_GID   section to file alerts under
#   SCREEN_MATCH_THRESHOLD        material-match score 0-1 (default 0.85)
#   SCREEN_ADVERSE_MEDIA          '0' to disable Google News adverse-media (default on)
#   SCREEN_PEP                    '0' to disable the Wikidata PEP signal (default on)
#   SCREEN_INTERPOL               '1' to ENABLE the Interpol Red Notice per-subject signal (default OFF; public subset only, supplementary — verify the public API on the runner before turning on)
#   SCREEN_FBI                    '1' to ENABLE the FBI Wanted per-subject signal (default OFF; wanted posters only — missing-person/information posters are excluded by the module; verify on the runner before turning on)
#   ASANA_OM_PROJECT_GID          daily audit task project (vars.ASANA_DELIVERY_PROJECT_GID -> HAWKEYE STERLING APP)
#   ASANA_OM_AM_PEP_SECTION_GID   optional override (section is found/created by name)

on:
  # Re-scheduled 2026-07-08 as the SCREENING CASE ENGINE: runs daily after the
  # Sanctions Watch (05:07) with fresh lists, refreshes the per-subject state,
  # then the case-manager step turns every flag into a managed lifecycle CASE
  # (New -> Under Review -> Cleared/Escalated) with a 5-day SLA and aging
  # alerts. Its own flat alert card and daily audit task stay SUPPRESSED so it
  # never duplicates the unified Daily Screening digest.
  schedule:
    - cron: '37 5 * * *'   # 05:37 UTC = 09:37 UAE daily (odd minute)
  workflow_dispatch:

permissions:
  contents: read

# This workflow is an OPERATIONAL control, not a code-validation workflow.
# Source changes are exercised by CI. Keeping the runtime workflow schedule/
# manual-only prevents ordinary merges from creating hour-long full-base
# screens or being mistaken by freshness checks for today's mandatory control.
concurrency:
  group: sanctions-screen-runtime
  cancel-in-progress: false

jobs:
  screen:
    # Write scopes live at job level (top level is read-only — least privilege).
    permissions:
      actions: write
      contents: write
      issues: write
    runs-on: ubuntu-latest
    # Sized for FULL-BASE enrichment: sanctions matching is instant, but the
    # adverse-media/PEP phase now runs to a 90-min budget so every subject gets
    # worldwide-media coverage every run (the old 12-min budget skipped the same
    # ~720 tail subjects daily). The digest lands ~75 min later than before as a
    # consequence. A hang past the budget+wrap-up must still fail loudly.
    timeout-minutes: 120
    steps:
      - name: Harden the runner (egress block)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          # Allowlist derived from the job's actual fetches: runner/toolchain
          # (github/nodejs), Asana (customer read + alert post), the consolidated
          # designation lists (OFAC/UN/EU/UK, DFAT via its OpenSanctions mirror
          # on data.opensanctions.org — UAE EOCN is an in-repo file), the
          # adverse-media feeds (Google News RSS + GDELT), the Wikidata PEP
          # signal, Interpol (for when SCREEN_INTERPOL=1), FBI Wanted (for when
          # SCREEN_FBI=1), and the worldwide national lists added 2026-08-05
          # (Trade.gov CSL, Sri Lanka, HK CEDB — each fail-safe: a blocked or
          # down source discloses DEGRADED coverage, never a silent all-clear).
          # Anything else — including an exfiltration attempt from a
          # compromised dependency — is blocked and surfaces loudly.
          # UK Sanctions List (sanctionslist.fcdo.gov.uk, repointed 2026-09-22)
          # and NZ MFAT (www.mfat.govt.nz) added 2026-09-27: both were enabled
          # sources whose hosts were missing from this list, so every run
          # blocked them ("fetch failed") and screened without the UK list.
          # test/sanctions-registry-integrity.test.mjs now fails if any enabled
          # source host is missing from this allowlist.
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            nodejs.org:443
            app.asana.com:443
            sanctionslistservice.ofac.treas.gov:443
            wc2h-sls-prod-public-published.s3.us-gov-west-1.amazonaws.com:443
            scsanctions.un.org:443
            unsolprodfiles.blob.core.windows.net:443
            umsanrp1dltx4dj3sxtt.blob.core.windows.net:443
            umsaszjsdz5c04wqdhbq.blob.core.windows.net:443
            umsabtc1vb1fc4tfrqf0.blob.core.windows.net:443
            webgate.ec.europa.eu:443
            ofsistorage.blob.core.windows.net:443
            news.google.com:443
            api.gdeltproject.org:443
            www.bing.com:443
            www.wikidata.org:443
            ws-public.interpol.int:443
            www.international.gc.ca:443
            gels-avoirs.dgtresor.gouv.fr:443
            www.sesam.search.admin.ch:443
            www.dfat.gov.au:443
            data.opensanctions.org:443
            apigwext.worldbank.org:443
            api.ofac-api.com:443
            data.trade.gov:443
            www.competentauthority.gov.lk:443
            www.government.nl:443
            sifi.minfin.fgov.be:443
            geldefonds.gouv.mc:443
            nbctf.mod.gov.il:443
            pctc.pss.gov.sa:443
            portal.moi.gov.qa:443
            api.fbi.gov:443
            repet.jus.gob.ar:443
            www.migracija.lt:443
            mzv.gov.cz:443
            antiteror.sis.md:443
            www.gov.pl:443
            www.vm.ee:443
            fiubelize.org:443
            olinda.bcb.gov.br:443
            contas.tcu.gov.br:443
            sanctionslist.fcdo.gov.uk:443
            www.mfat.govt.nz:443
            tfs.fic.gov.za:443
            apim.adb.org:443
            data.iadb.org:443
            omawww.sat.gob.mx:80
            *.githubapp.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # No credentials on disk (zizmor artipacked): the state push below
          # authenticates with an ephemeral env token, and the overlay fetch
          # is anonymous (public repo).
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Overlay latest screening + case state (lives on the screen-state branch)
        env:
          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
        run: |
          # The state branch is a DATA branch. Build the new commit on top of
          # its current tree and replace only the screening data files. Rebuilding
          # it from the current main checkout also carries .github/workflows
          # changes; GitHub correctly rejects an Actions token that tries to
          # rewrite workflow files without workflow permission. That was the
          # cause of a completed screen failing at the final persistence step.
          if [ -n "$(git status --porcelain data/sanctions-screen-state.json data/screening-cases-state.json data/screening-assurance.json data/badges/sanctions-operational.svg data/badges/adverse-media-operational.svg data/badges/pep-operational.svg 2>/dev/null)" ]; then
            git config user.name "sanctions-screen"
            git config user.email "actions@github.com"

            if [ -n "$STATE_ENCRYPTION_KEY" ]; then
              node scripts/state-crypto.mjs encrypt data/sanctions-screen-state.json data/screening-cases-state.json
              for f in data/sanctions-screen-state.json data/screening-cases-state.json; do
                git checkout HEAD -- "$f" 2>/dev/null || true
              done
            else
              echo "::warning::screen-state persisted in PLAINTEXT (subject data) - set the STATE_ENCRYPTION_KEY secret to encrypt state commits (P30)"
            fi

            GIT_INDEX_FILE="$(mktemp -u)"
            export GIT_INDEX_FILE
            parent_args=()
            rc=0
            git ls-remote --exit-code --heads origin screen-state >/dev/null 2>&1 || rc=$?
            if [ "$rc" -eq 0 ]; then
              git fetch origin screen-state --depth=1
              tip="$(git rev-parse FETCH_HEAD)"
              git read-tree "$tip"
              parent_args=(-p "$tip")
            elif [ "$rc" -eq 2 ]; then
              git read-tree --empty
            else
              echo "::error::could not read screen-state (ls-remote rc=$rc) - refusing to rebuild the branch blind"
              exit 1
            fi

            files=(
              data/screening-assurance.json
              data/badges/sanctions-operational.svg
              data/badges/adverse-media-operational.svg
              data/badges/pep-operational.svg
            )
            if [ -n "$STATE_ENCRYPTION_KEY" ]; then
              files+=(data/sanctions-screen-state.json.enc data/screening-cases-state.json.enc)
              git update-index --force-remove data/sanctions-screen-state.json data/screening-cases-state.json 2>/dev/null || true
            else
              files+=(data/sanctions-screen-state.json data/screening-cases-state.json)
              git update-index --force-remove data/sanctions-screen-state.json.enc data/screening-cases-state.json.enc 2>/dev/null || true
            fi

            for f in "${files[@]}"; do
              if [ -e "$f" ]; then
                git update-index --add --cacheinfo "100644,$(git hash-object -w "$f"),$f"
              else
                git update-index --force-remove "$f" 2>/dev/null || true
              fi
            done

            tree="$(git write-tree)"
            commit="$(git commit-tree "$tree" "${parent_args[@]}" -m "$TITLE [skip ci]")"
            unset GIT_INDEX_FILE

            pushed=
            for attempt in 1 2 3 4 5; do
              git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$commit":refs/heads/screen-state && { pushed=1; break; }
              echo "push failed (attempt $attempt) — retrying"
              sleep $((attempt * 3))
            done
            [ -n "$pushed" ] || { echo "::error::state push to screen-state failed after 5 attempts — state NOT persisted"; exit 1; }
          else
            echo "state unchanged"
          fi

      - name: Refresh runtime assurance watchdog
        if: always() && steps.screen.outputs.screen_error != 'true' && steps.persist.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/assurance-dispatch.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/screening-assurance.yml/dispatches" \
            -d '{"ref":"main"}')
          if [ "$code" != "204" ]; then
            cat /tmp/assurance-dispatch.out
            echo
            echo "::error::could not dispatch Screening Assurance (HTTP $code)"
            exit 1
          fi
          echo "::notice::Screening Assurance dispatched against freshly persisted runtime evidence."

      - name: Open a GitHub issue if the screen could not run, or a hit was not delivered
        # In case-engine mode alerts are suppressed (asana_posted is always false)
        # and the MLRO CASES are the delivery surface — so a new match is only
        # "undelivered" when the cases step ALSO failed. Without the cases-outcome
        # guard this opened a false "not delivered" issue on every real match, and
        # (conversely) stayed silent when case delivery genuinely failed.
        # always() is load-bearing twice over: an unscreened bail now FAILS the
        # screen step (red run — so control-retry re-dispatches), and this step
        # must still run afterwards to file the issue from the bail's outputs.
        if: always() && (steps.screen.outputs.screen_error == 'true' || (steps.screen.outputs.has_changes == 'true' && steps.screen.outputs.asana_posted != 'true' && steps.cases.outcome != 'success'))
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          TITLE: ${{ steps.screen.outputs.title }}
          SCREEN_ERROR: ${{ steps.screen.outputs.screen_error }}
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try { report = fs.readFileSync('sanctions-screen-report.md', 'utf8'); } catch {}
            const failed = process.env.SCREEN_ERROR === 'true';
            const note = failed
              ? ['', '---',
                 '> The daily customer screen **could not run**, so no clearance can be inferred.',
                 '> Check the `ASANA_ACCESS_TOKEN` secret and that the sanctions lists are reachable, then re-run.'].join('\n')
              : ['', '---',
                 '> A customer match was detected but **could not be delivered to Asana** (token missing or the API call failed),',
                 '> so this issue was opened instead. The match must still be reviewed (MLRO + four-eyes).'].join('\n');
            const { owner, repo } = context.repo;
            await github.rest.issues.create({
              owner, repo,
              title: process.env.TITLE || 'Sanctions Screen — attention required',
              body: (report || 'See the workflow run.') + note,
              labels: ['sanctions-screen'],
            });
