name: Screening Assurance

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/screening-assurance.mjs'
      - 'data/worldwide-screening-sources.json'
      - '.github/workflows/screening-assurance.yml'

permissions:
  contents: read

concurrency:
  group: screening-assurance
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            nodejs.org:443
            *.githubapp.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Overlay latest runtime assurance evidence
        run: |
          git fetch origin screen-state --depth=1
          git checkout FETCH_HEAD -- data/screening-assurance.json
          git checkout FETCH_HEAD -- data/badges/sanctions-operational.svg
          git checkout FETCH_HEAD -- data/badges/adverse-media-operational.svg
          git checkout FETCH_HEAD -- data/badges/pep-operational.svg

      - name: Require fresh operational evidence
        run: node scripts/screening-assurance.mjs --check
