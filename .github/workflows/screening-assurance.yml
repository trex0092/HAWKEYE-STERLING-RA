name: Screening Assurance

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screening-assurance
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            nodejs.org:443
            app.asana.com:443
            *.githubapp.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Overlay latest runtime assurance evidence
        run: |
          git fetch origin screen-state --depth=1
          git checkout FETCH_HEAD -- data/screening-assurance.json
          git checkout FETCH_HEAD -- data/badges/sanctions-operational.svg
          git checkout FETCH_HEAD -- data/badges/adverse-media-operational.svg
          git checkout FETCH_HEAD -- data/badges/pep-operational.svg

      - name: Require fresh operational evidence
        env:
          # A previous successful 991-subject screen is not proof the newly
          # merged Asana customer+employee source mapping was exercised.
          SCREENING_ASSURANCE_EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/screening-assurance.mjs --check

      - name: Alert in Asana when worldwide screening assurance fails
        if: failure()
        env:
          ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
          ASANA_SECTION_GID: '1218451960830318'
          # An existing MLRO alert keeps its task and human disposition, but
          # each fresh failing run must be appended as remotely verified proof.
          ASANA_ALERT_REFRESH_OPEN: '1'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/asana-alert.mjs \
            "SCREENING ASSURANCE DEGRADED: worldwide sanctions / adverse media / PEP evidence failed" \
            "The fail-loud runtime assurance control found stale or degraded screening evidence. A green 195-country scope badge is not operational proof. Review the Screening Assurance run and the underlying Sanctions Screen / adverse-media / PEP evidence before relying on a clean screening result. Run: $RUN_URL"
