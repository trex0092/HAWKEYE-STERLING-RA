name: Scorecard supply-chain security

# OpenSSF Scorecard — audits this repo's security posture (branch protection,
# token permissions, pinned dependencies, dangerous workflow patterns, etc.)
# and publishes the findings to the Security → Code scanning tab and the public
# Scorecard API (drives the README badge). Runs weekly and whenever a branch
# protection rule changes.
on:
  branch_protection_rule:
  schedule:
    - cron: '30 7 * * 1' # 07:30 UTC every Monday
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the top level; the analysis job widens to only what it needs.
permissions: read-all

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF results to code scanning
      id-token: write # publish results to the OpenSSF Scorecard API
      contents: read
    steps:
      - name: Harden the runner (egress block)
        # Allowlist observed from the 2026-07-14 run's egress audit: GitHub
        # (checkout/API), the Scorecard probes (OSS-Fuzz build logs,
        # bestpractices.dev, OSV, deps.dev), the SARIF/artifact upload hosts
        # (*.actions.githubusercontent.com), the Sigstore trio for signed
        # publishing, and the Scorecard API itself (publish_results).
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            www.bestpractices.dev:443
            api.osv.dev:443
            api.deps.dev:443
            fulcio.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            api.scorecard.dev:443
            *.githubapp.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # GitHub's artifact service intermittently rejects CreateArtifact with
      # ECONNREFUSED after Scorecard successfully analyzed and signed results
      # (26 Oct 2026, runs 40277010685 and 40288017901). Retry once through
      # the SAME pinned upload action. The second name is distinct: when the
      # first request was committed but the response was lost, v4+ artifacts
      # are immutable and an identical name would be refused as a duplicate.
      # The final gate MUST fail if neither upload confirms retention.
      - name: Upload SARIF artifact (primary)
        id: artifact_primary
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          if-no-files-found: error
          retention-days: 5

      - name: Cool down after transient artifact service failure
        if: steps.artifact_primary.outcome == 'failure'
        run: sleep 10

      - name: Retry SARIF artifact upload once
        id: artifact_retry
        if: steps.artifact_primary.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file retry
          path: results.sarif
          if-no-files-found: error
          retention-days: 5

      - name: Require verified Scorecard SARIF artifact retention
        if: always()
        env:
          PRIMARY_UPLOAD_OUTCOME: ${{ steps.artifact_primary.outcome }}
          RETRY_UPLOAD_OUTCOME: ${{ steps.artifact_retry.outcome }}
        run: |
          if [ "$PRIMARY_UPLOAD_OUTCOME" != "success" ] && [ "$RETRY_UPLOAD_OUTCOME" != "success" ]; then
            echo "::error::Scorecard SARIF artifact was NOT retained after a bounded retry; no supply-chain evidence may be certified."
            exit 1
          fi
          echo "Verified: Scorecard SARIF artifact upload succeeded."

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
