name: Scorecard supply-chain security

# OpenSSF Scorecard — audits this repo's security posture (branch protection,
# token permissions, pinned dependencies, dangerous workflow patterns, etc.)
# and publishes the findings to the Security → Code scanning tab and the public
# Scorecard API (drives the README badge). Runs weekly and whenever a branch
# protection rule changes.
on:
  branch_protection_rule:
  schedule:
    - cron: '30 7 * * 1' # 07:30 UTC every Monday
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege at the top level; the analysis job widens to only what it needs.
permissions: read-all

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload the SARIF results to code scanning
      id-token: write # publish results to the OpenSSF Scorecard API
      contents: read
    steps:
      - name: Harden the runner (egress block)
        # Allowlist observed from the 2026-07-14 run's egress audit: GitHub
        # (checkout/API), the Scorecard probes (OSS-Fuzz build logs,
        # bestpractices.dev, OSV, deps.dev), the SARIF/artifact upload hosts
        # (*.actions.githubusercontent.com), the Sigstore trio for signed
        # publishing, and the Scorecard API itself (publish_results).
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            www.bestpractices.dev:443
            api.osv.dev:443
            api.deps.dev:443
            fulcio.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443
            api.scorecard.dev:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: results.sarif
