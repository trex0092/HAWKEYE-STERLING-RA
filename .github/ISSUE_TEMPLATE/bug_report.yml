name: Bug report
description: Report something that isn't working as expected
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.
        **Do not report security vulnerabilities here** — see [SECURITY.md](../blob/main/SECURITY.md).
        **Never paste API tokens, customer data, or other secrets.**
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: page
    attributes:
      label: Which page?
      options:
        - index.html (Entity Risk Assessment)
        - console.html (AI Operations Console)
        - advisor.html (Hawkeye Sterling Advisor)
        - Automation / GitHub Action
        - Other / not sure
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "e.g. Chrome 126, Safari 17.5, Firefox 127"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Screenshots or additional context
      description: Drag-and-drop screenshots or add any other context here.
    validations:
      required: false
