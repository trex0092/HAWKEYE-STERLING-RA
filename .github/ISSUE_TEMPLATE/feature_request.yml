name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to Hawkeye Sterling RA.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? Is it related to a frustration or gap?
      placeholder: "I'm always frustrated when…"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you'd like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Risk scoring / methodology
        - Report / export
        - Advisor (Q&A)
        - Operations console
        - Automation (watchdogs, screening, releases)
        - Accessibility
        - Documentation / governance
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      validations:
        required: false
