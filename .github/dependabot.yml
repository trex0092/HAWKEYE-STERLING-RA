version: 2
updates:
  # Keep the GitHub Actions used across the workflows patched (also clears the
  # "Node 20 actions are deprecated" runner warnings as new majors ship).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    # Bundle all action bumps into one PR per week to cut review noise. Dependabot
    # keeps the SHA-pinned `uses:` refs current by reading the `# vX` comment.
    groups:
      github-actions:
        patterns:
          - "*"

  # Keep the pinned Python screening dependencies (ci/requirements.txt) patched.
  - package-ecosystem: pip
    directory: /ci
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      python:
        patterns:
          - "*"

  # Keep the committed npm dev toolchain (package.json + package-lock.json)
  # patched. All entries are devDependencies — the app ships zero runtime npm
  # dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      npm-dev:
        patterns:
          - "*"
    ignore:
      # Playwright minor/major bumps change rendering and would invalidate the
      # committed visual baselines (test/__screenshots__). Bump deliberately and
      # refresh baselines via the Visual Regression workflow's baseline mode.
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
