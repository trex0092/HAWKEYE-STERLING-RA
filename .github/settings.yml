    color: "1d76db"
    description: Core application pages / assets
  - name: data
    color: "0e8a16"
    description: Risk baseline data and source registries
  - name: automation
    color: "5319e7"
    description: CI/CD workflows and scripts
  - name: tests
    color: "fbca04"
    description: Test suites and fixtures
  - name: docs
    color: "0075ca"
    description: Documentation and governance
  - name: netlify
    color: "00ad9f"
    description: Netlify config and serverless functions
  - name: visual-regression
    color: "d4c5f9"
    description: Visual baseline / screenshot changes
  - name: compliance
    color: "b60205"
    description: Compliance-sensitive change (MLRO review)
  - name: security
    color: "ee0701"
    description: Security-relevant change
  - name: "size/XS"
    color: "3cbf00"
    description: "< 10 lines changed"
  - name: "size/S"
    color: "5d9801"
    description: "10–99 lines changed"
  - name: "size/M"
    color: "7f7203"
    description: "100–499 lines changed"
  - name: "size/L"
    color: "a14c05"
    description: "500–999 lines changed"
  - name: "size/XL"
    color: "c32607"
    description: "≥ 1000 lines changed"
  - name: dependencies
    color: "0366d6"
    description: Dependency / supply-chain update
  # Issue-triage set — referenced by the .github/ISSUE_TEMPLATE forms
  # (bug_report → bug+triage, feature_request → enhancement+triage,
  # compliance_review → compliance+review). Template auto-labelling fails
  # silently if these are missing, so they live in the source of truth.
  - name: bug
    color: "d73a4a"
    description: Something broken in the app or automation
  - name: enhancement
    color: "a2eeef"
    description: New capability or improvement request
  - name: triage
    color: "ededed"
    description: Awaiting initial assessment
  - name: review
    color: "f9a825"
    description: Under MLRO / maintainer review
  - name: question
    color: "d876e3"
    description: Further information requested
  - name: duplicate
    color: "cfd3d7"
    description: Already tracked elsewhere
  - name: wontfix
    color: "ffffff"
    description: Considered and deliberately not planned
  # Domain set — auto-applied by .github/labeler.yml path rules.
  - name: engine
    color: "306998"
    description: Python screening engine (screen / ai / agents / kyc / txn / monitoring)
  - name: screening
    color: "c2185b"
    description: Sanctions / PEP / adverse-media screening automations and data
  - name: advisor
    color: "e99695"
    description: AI Advisor pages and the brain-soul function
  - name: governance
    color: "6f42c1"
    description: AIMS, policies, DPIA, model cards, assessments
  - name: a11y
    color: "0052cc"
    description: Accessibility (WCAG / axe / pa11y)
  - name: i18n
    color: "bfd4f2"
    description: Localisation / Arabic UI
  - name: pwa
    color: "1f6feb"
    description: Offline support — service worker, manifest, icons
  - name: design
    color: "c5def5"
    description: Design handoff reference (design/)
  - name: release
    color: "2ea44f"
    description: Release, changelog, versioning
  - name: config
    color: "37474f"
    description: Toolchain / repository configuration

# ── Branch protection ───────────────────────────────────────────────────────────
# main is the deploy branch. No direct pushes: every change lands via a reviewed,
# CI-green, up-to-date PR with a linear history. Admin enforcement is OFF as the
# deliberate single-maintainer merge path — see the notes inline below.
branches:
  - name: main
    protection:
      required_pull_request_reviews:
        # SINGLE-MAINTAINER OPERATING MODE (2026-07-16): reviews are REQUIRED
        # (1 approval + code owners) and the admin bypass below (enforce_admins
        # off) is the sole maintainer's merge path. GitHub never counts the PR
        # author's own approval, so with enforce_admins ON any count > 0 would
        # make every owner-authored PR unmergeable — including the PR reverting
        # this file, a full lockout, because the installed Settings app
        # re-applies this file on every push to main. Rules of the mode:
        #   - Owner-authored PRs: merge via the logged admin bypass
        #     ("Merge without waiting for requirements to be met").
        #   - Bot-authored PRs (Dependabot): the owner CAN approve those —
        #     approve, don't bypass. Each approval also counts toward the
        #     Scorecard Code-Review check (last-30-changesets window).
        #   - Second maintainer joins: keep count 1, turn enforce_admins back
        #     ON, stop using the bypass.
        # History: raised 0 → 1 on 2026-07-16. Live branch protection (checklist
        # rows 1/10) made the Branch-Protection check readable for the first
        # time; it priced the count-0 config at 3/10 and the badge fell
        # 8.1 → 7.7. See docs/governance/scorecard-9.5-path.md for the math.
        # NOTE: if the Settings app is not installed, apply this by hand:
        # Settings → Branches → main → check "Require approvals" (1) and
        # "Require review from Code Owners", and uncheck "Do not allow
        # bypassing the above settings" (a.k.a. "Include administrators").
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
      required_status_checks:
        strict: true        # branch must be up to date with main before merge
        contexts:
          # Each context must equal the reporting job's display name (its
          # `name:` field, or the job id when unnamed). A context that matches
          # no check name sits at "Expected — waiting for status" forever and
          # deadlocks every PR. "Dependency Review" is pinned via `name:` in
          # dependency-review.yml.
          - test
          - lint
          - smoke
          - analyze         # CodeQL
          - semgrep         # Semgrep SAST (app-invariant blocking rules)
          - gitleaks
          - size
          - Dependency Review
      enforce_admins: false             # OFF by design: the admin bypass is the
                                        # single maintainer's merge path now that
                                        # approvals are required (see the
                                        # required_pull_request_reviews note).
                                        # Restore to true when a second
                                        # maintainer joins.
      required_linear_history: true
      required_conversation_resolution: true
      allow_force_pushes: false
      allow_deletions: false
      restrictions: null                # no user/team push allowlist (PR-only for all)
